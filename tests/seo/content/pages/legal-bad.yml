# Плохой пример правового аудита (этап 7, ДЗ04): стоп-слова в исходном тексте и разрешённые контексты, которые не должны срабатывать.
title: Препарат безопасен для пшеницы
text: Натуральный препарат гарантированно уничтожает сорняки. Подходит физлицам.
ok:
  - Срок безопасного выхода людей на обработанные площади — 3 дня.
  - Обезвредить сорбент раствором соды.
  - Класс опасности для пчёл — 3 (малоопасный).
  - Синтетические ауксины замещают природные гормоны роста.
