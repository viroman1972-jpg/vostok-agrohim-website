seo:
  sections:
  - title: Основные задачи защиты подсолнечника
    paras:
    - Защита подсолнечника включает контроль злаковых и двудольных сорняков, защиту от грибных заболеваний и вредителей, а также предпосевную обработку семян. При необходимости применяют предуборочную десикацию.
    - Гербицидная схема особенно зависит от типа гибрида. Для классического подсолнечника и гибридов, устойчивых к имидазолинонам или трибенурон-метилу, применяются разные технологии и разные препараты.
  - title: Какие препараты применяют на подсолнечнике
    products: auto
    paras:
    - 'На гибридах, устойчивых к имидазолинонам, применяют специализированные гербициды соответствующей технологии. В ассортименте представлен Евро-Ленд. Такие препараты нельзя использовать на обычных, неустойчивых гибридах.'
  - title: Что учитывать при выборе
    paras:
    - Первый вопрос при подборе гербицида — тип гибрида. Препараты имидазолиноновой технологии применяют только на устойчивом к ним подсолнечнике. Для гибридов других технологий необходимо подбирать зарегистрированные именно для них решения.
    - Фунгицидные обработки планируют по риску и фактическому развитию болезней, с учётом погодных условий и восприимчивости гибрида. При нескольких обработках желательно чередовать механизмы действия.
    - В период цветения особое значение имеют требования по охране пчёл и других опылителей. Инсектицид выбирают по конкретному вредителю и регламенту применения.
    - При планировании севооборота необходимо учитывать ограничения по последующим культурам после гербицидов с почвенным последействием, особенно препаратов группы имидазолинонов и некоторых ALS-ингибиторов.
  cta: '**Планируете защиту подсолнечника?** Укажите площадь, тип гибрида и основные вредные объекты — поможем подобрать препараты и схему обработок.'
