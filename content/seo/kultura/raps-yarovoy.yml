seo:
  sections:
  - title: Основные задачи защиты ярового рапса
    paras:
    - Защита ярового рапса включает контроль злаковых и двудольных сорняков, защиту от крестоцветных блошек, рапсового цветоеда, капустной моли и других вредителей, а также фунгицидную защиту от комплекса заболеваний. При необходимости в систему включают предпосевную обработку семян и предуборочную десикацию.
    - 'Схему защиты строят с учётом технологии выращивания: для классических сортов и гибридов и для гибридов, устойчивых к имидазолинонам, набор допустимых гербицидов различается.'
  - title: Какие препараты применяют на яровом рапсе
    products: auto
    paras:
    - 'На гибридах рапса, устойчивых к имидазолинонам, могут применяться специализированные гербициды этой технологии, в том числе Парадокс и Грейдер. Их нельзя применять на обычных, неустойчивых гибридах.'
  - title: Что учитывать при выборе
    paras:
    - Крестоцветные блошки и рапсовый цветоед способны быстро увеличивать повреждение посевов, поэтому решение об инсектицидной обработке принимают по результатам мониторинга и с учётом экономического порога вредоносности.
    - Во время цветения особенно важны ограничения по охране пчёл и других опылителей. Выбирают только допустимые для конкретных условий препараты и соблюдают требования их регламентов.
    - Гербицидная схема зависит от типа гибрида. Препараты для имидазолиноноустойчивых гибридов нельзя использовать на обычном рапсе. При совместном применении граминицидов и противодвудольных гербицидов необходимо проверять совместимость и рекомендации производителей.
    - При нескольких фунгицидных и инсектицидных обработках желательно чередовать механизмы действия.
  cta: '**Планируете защиту ярового рапса?** Укажите тип гибрида, площадь, основные сорняки и вредителей — поможем подобрать препараты и схему обработок.'
