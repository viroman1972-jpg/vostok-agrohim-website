seo:
  sections:
  - title: Основные задачи защиты овса
    paras:
    - Защита овса включает прежде всего контроль двудольных сорняков, а при необходимости — защиту от болезней и вредителей в период вегетации и предпосевную обработку семян.
    - 'Выбор препаратов на овсе требует особенно внимательной проверки регистрации: ассортимент решений для этой культуры уже, чем для пшеницы и ячменя. Схему строят под фитосанитарную ситуацию на поле и качество семенного материала.'
  - title: Какие препараты применяют на овсе
    products: auto
    paras:
    - 'Специализированные противозлаковые гербициды, применяемые в посевах пшеницы или на двудольных культурах, нельзя автоматически переносить на овёс: селективность и регистрация должны проверяться для каждого продукта.'
  - title: Что учитывать при выборе
    paras:
    - Для овса особенно важно не переносить без проверки схемы защиты других зерновых культур. Допустимые препараты, нормы и фазы применения определяются регистрацией конкретного продукта.
    - При засорённости многолетними злаковыми сорняками, например пыреем, основную работу целесообразно проводить вне вегетирующих посевов овса — в севообороте, на парах или до посева препаратами и способами, разрешёнными соответствующими регламентами.
    - Фунгицидные и инсектицидные обработки проводят по фактической фитосанитарной ситуации, а не как обязательный элемент календарной схемы.
  cta: '**Планируете защиту овса?** Укажите площадь посева, основные сорняки, болезни или вредителей и историю обработок — поможем подобрать зарегистрированные решения.'
