seo:
  sections:
  - title: Основные задачи защиты ярового ячменя
    paras:
    - Защита ярового ячменя включает контроль двудольных и злаковых сорняков, болезней листьев и колоса, вредителей в период вегетации, а также защиту семян и всходов от семенной и почвенной инфекции.
    - Схему обработок подбирают под фактическую фитосанитарную ситуацию на поле, качество семенного материала, сорт и историю обработок.
  - title: Какие препараты применяют на яровом ячмене
    products: auto
  - title: Что учитывать при выборе
    paras:
    - Допустимая фаза применения гербицида устанавливается регламентом конкретного препарата. При выборе противозлакового решения особенно важно учитывать вид сорняка и его фазу развития.
    - 'Комплекс болезней ячменя отличается от пшеничного: для культуры характерны, в частности, сетчатая пятнистость и ринхоспориоз. Поэтому фунгицид выбирают по фактическому спектру заболеваний, а не только по действующему веществу.'
    - Инсектицидные обработки планируют по результатам мониторинга, с учётом вида и численности вредителя. При нескольких обработках желательно чередовать механизмы действия.
    - Протравитель подбирают по качеству семенного материала и фитосанитарной истории поля. Для каждого препарата необходимо проверять действующий регламент, нормы, сроки и ограничения применения.
  cta: '**Планируете защиту ярового ячменя?** Укажите площадь посева, основные проблемы и историю поля — поможем подобрать препараты и схему обработок.'
