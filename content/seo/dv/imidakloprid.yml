seo:
  sections:
  - title: Что такое имидаклоприд
    paras:
    - Имидаклоприд — системное инсектицидное действующее вещество из класса неоникотиноидов. Оно действует на нервную систему насекомых и применяется против ряда сосущих и грызущих вредителей.
    - Имидаклоприд используют как в препаратах для обработки растений в период вегетации, так и в инсектицидных протравителях семян. В смесевых инсектицидах его сочетают с действующими веществами других групп, чтобы объединить разные свойства и расширить спектр применения.
  - title: Препараты на основе имидаклоприда в ассортименте
    products: auto
    paras:
    - Культуры, вредители, нормы расхода и сроки применения необходимо сверять по действующему регламенту конкретного препарата.
  - title: Где применяют препараты на основе имидаклоприда
    paras:
    - 'Основные направления применения:'
    - list:
      - защита зарегистрированных культур в период вегетации от тлей, цикадок, клопов, жуков и других вредителей — в зависимости от препарата;
      - защита картофеля и других культур от зарегистрированных вредителей, если такой способ применения предусмотрен регламентом;
      - предпосевная обработка семян инсектицидными протравителями для защиты от почвообитающих вредителей и вредителей всходов.
  - title: Что учитывать при выборе
    paras:
    - Имидаклоприд особенно востребован против вредителей, питающихся соком растений, но спектр конкретного препарата определяется его полной рецептурой и регистрацией. Для скрытоживущих вредителей и отдельных групп гусениц могут потребоваться другие действующие вещества.
    - При повторных инсектицидных обработках желательно чередовать механизмы действия, поскольку у ряда вредителей возможно формирование устойчивости к неоникотиноидам.
    - Особое внимание необходимо уделять ограничениям по охране пчёл и других опылителей. Требования зависят от препарата, культуры и способа применения и должны проверяться по действующему регламенту.
    - Для протравителей важны равномерность нанесения и соблюдение требований к хранению, транспортировке и высеву обработанных семян.
  cta: '**Нужен инсектицид или протравитель на основе имидаклоприда?** Укажите культуру, вредителя и задачу обработки — поможем подобрать препарат.'
