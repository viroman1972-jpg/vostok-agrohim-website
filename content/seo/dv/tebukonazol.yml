seo:
  sections:
  - title: Что такое тебуконазол
    paras:
    - Тебуконазол — системное фунгицидное действующее вещество из класса триазолов. Его применяют для защиты сельскохозяйственных культур от комплекса грибных заболеваний, а также в составе фунгицидных протравителей семян.
    - В препаратах тебуконазол используется самостоятельно или в сочетании с другими фунгицидными действующими веществами. Комбинации позволяют расширять спектр контролируемых болезней и сочетать компоненты с различающимися свойствами.
  - title: Препараты на основе тебуконазола в ассортименте
    products: auto
    paras:
    - 'Препараты с тебуконазолом нельзя считать взаимозаменяемыми: культуры, спектр болезней, нормы расхода и сроки применения необходимо проверять по действующему регламенту каждого продукта.'
  - title: Где применяют препараты на основе тебуконазола
    paras:
    - 'Основные направления применения:'
    - list:
      - защита зерновых и других зарегистрированных культур в период вегетации от ржавчин, мучнистой росы, септориоза и других заболеваний — в зависимости от регламента конкретного фунгицида;
      - защита технических и других культур, если они предусмотрены регистрацией выбранного препарата;
      - предпосевная обработка семян — в составе фунгицидных протравителей против комплекса семенной и почвенной инфекции.
  - title: Что учитывать при выборе
    paras:
    - Фунгицид выбирают не только по наличию тебуконазола, но и по полному составу препарата, культуре и комплексу болезней. Для смесевых продуктов важно учитывать свойства всех действующих веществ.
    - Наиболее целесообразно планировать фунгицидную защиту профилактически или на ранних стадиях развития заболевания. При нескольких обработках за сезон желательно чередовать механизмы действия, чтобы снижать риск формирования устойчивости патогенов.
    - Для протравителей дополнительно важно равномерное нанесение рабочего раствора на семена и соблюдение требований к обращению с обработанным семенным материалом.
  cta: '**Нужен фунгицид или протравитель на основе тебуконазола?** Укажите культуру, заболевание и задачу обработки — поможем подобрать препарат по действующему регламенту.'
