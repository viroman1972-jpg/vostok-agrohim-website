seo:
  sections:
  - title: Что такое клопиралид
    paras:
    - Клопиралид — системное гербицидное действующее вещество из группы синтетических ауксинов. Оно особенно востребовано для контроля осотов, бодяка и ряда других чувствительных двудольных сорняков.
    - Клопиралид поступает через листья и перемещается по растению, поэтому способен воздействовать не только на надземную часть чувствительных многолетних сорняков, но и на их подземные органы.
    - В препаратах клопиралид применяется самостоятельно или в сочетании с другими гербицидными действующими веществами, например пиклорамом.
  - title: Препараты на основе клопиралида в ассортименте
    products: auto
    paras:
    - 'Препараты с клопиралидом не являются взаимозаменяемыми: зарегистрированные культуры, спектр сорняков, нормы и сроки применения различаются.'
  - title: Где применяют препараты на основе клопиралида
    paras:
    - Препараты на основе клопиралида используют для контроля чувствительных однолетних и многолетних двудольных сорняков на тех культурах, которые предусмотрены регистрацией конкретного продукта.
    - Хакер 300 зарегистрирован на сахарной свёкле и ряде других культур и объектов. Галион — смесевой препарат на основе клопиралида и пиклорама — применяется, в частности, на рапсе и капусте. Поэтому нельзя считать зерновые универсальной или основной областью применения всей группы препаратов с клопиралидом.
  - title: Что учитывать при выборе
    paras:
    - Для многолетних корнеотпрысковых сорняков важны активная вегетация и достаточная листовая поверхность. Точный оптимальный срок обработки зависит от культуры, вида сорняка и регламента выбранного гербицида.
    - Особое внимание необходимо уделять севообороту. Ограничения по последующим культурам зависят от конкретного препарата и особенно важны для смесей, содержащих пиклорам. Их следует проверять по действующему регламенту, а не переносить с одного препарата на другой.
    - При регулярном использовании гербицидов одного механизма действия желательно чередовать их с препаратами других групп.
  cta: '**Нужен препарат на основе клопиралида?** Укажите культуру, основные сорняки и планируемый севооборот — поможем подобрать подходящий продукт.'
