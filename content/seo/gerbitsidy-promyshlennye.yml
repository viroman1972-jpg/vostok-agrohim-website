lead: Гербициды для обочин дорог, полос отвода, охранных зон ЛЭП и промышленных площадок — только с регистрацией на землях несельскохозяйственного назначения.
seo:
  sections:
  - title: Как выбрать гербицид для промышленной территории
    paras:
    - Гербицид для промышленной территории подбирают под тип объекта и характер нежелательной растительности. На обочинах дорог, полосах отчуждения железных и шоссейных дорог, в охранных зонах ЛЭП, на аэродромах и промышленных площадках применяют только препараты, в регламенте которых прямо предусмотрены земли несельскохозяйственного назначения.
    - Для сплошного контроля травянистой растительности используют системные гербициды на основе глифосата. В ассортименте к этой группе относятся Торнадо 500, Торнадо 540 и Силач. Такие препараты применяют по активно вегетирующим сорнякам; конкретный спектр контролируемой растительности и нормы расхода зависят от препарата и степени зарастания участка.
    - 'При наличии многолетних сорняков, тростника, вейника или древесно-кустарниковой растительности особенно важно сверять объект обработки с регламентом конкретного препарата: допустимые нормы и перечень контролируемой растительности для разных территорий различаются.'
  - title: Что учитывать при выборе
    paras:
    - Для несельскохозяйственных территорий нельзя автоматически переносить схемы, применяемые на сельскохозяйственных посевах. Перед обработкой необходимо проверить действующую регистрацию препарата именно для нужного типа территории и соблюдать ограничения, указанные в регламенте.
    - При выборе учитывают видовой состав растительности, фазу её развития, площадь объекта и возможность повторного отрастания многолетних видов. Для баковых смесей дополнительно проверяют совместимость компонентов и допустимость их применения на конкретном объекте.
  cta: '**Работаете с обочинами дорог, полосами отвода, ЛЭП или промышленной площадкой?** Укажите тип территории, площадь и основные виды растительности — поможем подобрать зарегистрированный препарат и вариант обработки.'
