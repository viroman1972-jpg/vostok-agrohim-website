procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Семена протравливают перед посевом, семена сахарной свёклы — на семенных заводах по их методикам. Опрыскивание
    дна борозды раствором препарата проводят во время посадки картофеля. При высокой численности хлебной
    жужелицы и внутристеблевых мух (шведской, гессенской, чёрной пшеничной) на зерновых наиболее эффективны
    максимальные разрешённые нормы расхода — 0,6–0,8 л/т.
  - Бак протравочной машины на треть заполняют водой, включают мешалку, вливают расчётное количество препарата
    и доливают воду до требуемого объёма. Рабочая жидкость во время обработки должна постоянно перемешиваться.
  - Для приготовления рабочего раствора используют воду температурой не ниже 10 °C — холодная вода снижает
    диспергируемость препарата. Значение pH воды — 4,5–7. Рабочую жидкость используют в тот же день.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Табу можно применять с фунгицидными протравителями Бункер, Виал ТрасТ, Виал Трио, Синклер, Оплот, Оплот
    Трио, ТМТД. Препарат совместим с различными пестицидами для обработки семян, кроме препаратов с сильнощелочной
    или сильнокислой реакцией.
  - 'Порядок добавления компонентов в бак протравочной машины: СП → Табу → СК (КС, ВСК) → СЭ → МЭ → ВРГ
    → ВРК (ВР). Каждый последующий компонент добавляется после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять смешиваемые компоненты на совместимость, а обработанные
    смесью семена перед посевом — на всхожесть.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −10 до +40 °C.'
  - 'Срок хранения: 3 года при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - Работы с препаратом проводят обязательно со средствами индивидуальной защиты кожи, глаз и органов дыхания
    (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10).
  - Срок безопасного выхода людей на обработанные площади для механизированных и ручных работ — 3 дня.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.2584-10.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат стоек в почве (2 класс опасности по стойкости). Высокотоксичен для дождевых червей; по данным
    производителя, в рекомендованных нормах расхода опасность для них отсутствует.
  - Препарат применяется для обработки семян, клубней и дна борозды при посадке; класс опасности для пчёл
    в госреестре не указан.
  - Рыбохозяйственная оценка — 2 класс опасности. Применение в санитарной зоне рыбохозяйственных водоёмов
    запрещено.
mechanism:
- key: mech
  title: Как работает имидаклоприд
  paras:
  - Имидаклоприд относится к неоникотиноидам и обладает контактно-кишечным действием. Он блокирует никотинэргические
    рецепторы нервной системы насекомых.
  - Препарат обладает выраженной системной активностью — проникает в проростки и молодые растения через
    корни, поэтому вредитель получает действующее вещество, питаясь всходами.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат быстро нарушает передачу сигналов в нервной системе насекомых — они теряют подвижность, прекращают
    питаться и вскоре погибают.
  - По данным производителя, при соблюдении рекомендаций препарат защищает всходы в ранний период их развития.
    Препаративная форма образует на семенах прочную окрашенную плёнку, которая после высыхания не осыпается.
- key: spectrum
  title: Спектр действия
  paras:
  - Почвообитающие и наземные вредители всходов — проволочники, хлебная жужелица, хлебные и крестоцветные
    блошки, злаковые мухи, клубеньковые долгоносики, а на картофеле также колорадский жук — на культурах,
    указанных в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Во избежание резистентности Табу необходимо чередовать с инсектицидами других химических классов. Ориентироваться
    только на разные торговые названия недостаточно — разные препараты могут содержать действующие вещества
    одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — немедленно прополоскать рот водой, дать пострадавшему выпить несколько стаканов воды с активированным
    углём (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки глотки вызвать
    рвоту, после чего выпить стакан воды с активированным углём и принять солевое слабительное (20 г сернокислой
    магнезии на полстакана воды).'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани или ваты, не втирая, а затем обмыть загрязнённый участок водой
    с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно промыть глаза при разомкнутых веках большим количеством чистой проточной воды.'
- lead: При первых признаках отравления
  text: ' — вывести пострадавшего из зоны воздействия пестицида, осторожно снять с него одежду и средства
    индивидуальной защиты, избегая попадания препарата на кожу или органы дыхания.'
- lead: ''
  text: После оказания первой помощи немедленно обратиться к врачу.
