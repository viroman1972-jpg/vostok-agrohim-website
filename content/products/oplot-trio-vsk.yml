procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Протравливать семена можно заблаговременно (до 1 года) или непосредственно перед посевом; заблаговременно
    обрабатывают только кондиционные семена при надлежащих условиях дальнейшего хранения. Рекомендуется
    использовать семена, очищенные от пыли и примесей.
  - Рабочую жидкость готовят непосредственно перед применением. Препарат тщательно перемешивают, встряхивая
    канистру, и смешивают с водой в отдельной ёмкости в соотношении 1:1. Бак протравочной машины на треть
    заполняют водой и при непрерывном перемешивании вливают маточный раствор; ёмкость из-под него ополаскивают,
    сливая смыв в бак. Затем доводят бак водой до полного объёма и перемешивают до однородной суспензии;
    перемешивание продолжают во время обработки.
  - Для приготовления рабочего раствора используют воду температурой не ниже 10 °C — холодная вода снижает
    диспергируемость препарата. Значение pH воды — 5,5–7. Рабочую жидкость используют в тот же день.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Оплот Трио совместим в баковой смеси с инсектицидными протравителями Табу и Табу Нео. Смешивать его
    с препаратами сильнощелочной или сильнокислой реакции не рекомендуется.
  - 'Порядок добавления компонентов в бак протравочной машины: СП → Оплот Трио → СК (КС, ВСК) → СЭ → МЭ
    → ВРК (ВР). Каждый последующий компонент добавляется после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять смешиваемые компоненты на совместимость и фитотоксичность
    по отношению к обрабатываемым семенам.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке, с защитой от прямых солнечных лучей, увлажнения, загрязнения
    и механического повреждения.'
  - 'Температурный режим: от −5 до +40 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - В связи с тератогенной активностью тебуконазола работы с препаратом проводят только специалисты по защите
    растений или под их контролем, или лица, прошедшие специальную подготовку, обязательно со средствами
    индивидуальной защиты органов дыхания, зрения и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10, СанПиН
    1.2.1330-03). Запрещено применение в личных подсобных хозяйствах.
  - Протравливание проводят на централизованных пунктах протравливания при полной механизации процесса,
    эффективной вентиляции и обезвреживании сточных вод.
  - Место разлива засыпают песком или другим негорючим сорбентом, сорбент собирают в контейнеры и вывозят
    на обезвреживание в места, согласованные с природоохранными органами и Роспотребнадзором. Участок в
    помещении промывают водой с мылом или содой, участок земли перекапывают.
  - Тару трижды ополаскивают водой, смывы выливают в бак с рабочим раствором. Вторичное использование тары
    не допускается. Запрещается сливать препарат и промывные воды на землю, в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат — протравитель семян, оценка токсичности для пчёл не требуется.
  - Применение в водоохранной зоне водных объектов, включая рыбохозяйственные водоёмы, запрещено.
mechanism:
- key: mech
  title: Как работают дифеноконазол, тебуконазол и азоксистробин
  paras:
  - 'Препарат сочетает три действующих вещества двух химических классов. Тебуконазол и дифеноконазол относятся
    к триазолам: подавляют биосинтез эргостерина в мембранах клеток грибов, что приводит к гибели возбудителя.
    Азоксистробин относится к стробилуринам: блокирует дыхание грибов в митохондриях, подавляет образование
    спор и рост мицелия.'
  - Тебуконазол отличается высокой подвижностью, обладает искореняющим и лечащим действием и сдерживает
    внутреннюю семенную инфекцию. Дифеноконазол менее подвижен, поглощается семенами и проростками постепенно
    и накапливается преимущественно в корневой системе и прикорневой части стебля, поэтому продолжительно
    защищает растения от возбудителей корневых гнилей; по данным производителя, действует также против
    пыльной и карликовой головни.
  - Азоксистробин даёт длительный защитный эффект. По данным производителя, он также положительно влияет
    на физиологию молодых растений — помогает усвоению азота и экономнее расходовать воду, что особенно
    важно в засуху.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - На семенную инфекцию препарат начинает действовать в первые часы после обработки семян. При набухании
    и прорастании зерновки он проникает в растение и распределяется по нему по мере роста.
  - Оплот Трио защищает от поверхностной и внутренней семенной, а также почвенной инфекции согласно регламенту
    применения. Против корневых гнилей и листостебельной инфекции препарат действует на начальных этапах
    роста — от прорастания семян до начала выхода в трубку; головнёвые болезни колоса подавляются обработкой
    семян.
  - Препаративная форма образует на поверхности семян прочную окрашенную плёнку, которая после высыхания
    не осыпается и не пылит.
- key: spectrum
  title: Спектр действия
  paras:
  - Головнёвые заболевания (твёрдая, каменная, пыльная, ложная пыльная, стеблевая), гельминтоспориозная
    и фузариозная корневые гнили, плесневение семян, в том числе альтернариозная семенная инфекция, сетчатая
    пятнистость, снежная плесень, ранняя мучнистая роса, а на горохе и льне — аскохитоз, фузариозное увядание,
    антракноз, крапчатость, пасмо.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Действующие вещества относятся к двум химическим классам с разными механизмами действия, что снижает
    риск возникновения резистентности. При планировании защиты всё же желательно чередовать препараты разных
    групп по годам и обработкам.
  - Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки
    глотки вызвать рвоту; повторить несколько раз (рвоту вызывают только у пострадавших в сознании), после
    чего вновь дать выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат с кожи куском ткани или ваты, не втирая, а затем обмыть загрязнённый участок
    водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть глаза мягкой струёй чистой проточной воды при разомкнутых веках.'
- lead: При первых признаках недомогания
  text: ' — немедленно отстранить пострадавшего от работы и вывести из зоны воздействия пестицида; осторожно
    снять с него одежду и средства индивидуальной защиты, избегая попадания препарата на кожу или органы
    дыхания; немедленно обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
