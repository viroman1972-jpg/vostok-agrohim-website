# Источники: регламент — госреестр (agroxxi v176, vial-trio-vsk-4); процедуры — инструкция АО Фирма «Август»
# (avgust.com/products/rf/vial_trio/, 26.10.2026); срок хранения — госреестр (ПИ10). Не перенесено: «идеально
# подходит», «полную защиту». Табу Супер не назван — нет в ассортименте. ПИ12.
rate_header: Норма, л/т
regulation:
- rate: '0,8–1,25'
  crop: 'Зерновые колосовые озимые и яровые, за исключением овса'
  object: 'Твёрдая головня, твёрдая (каменная) головня, пыльная головня, ложная пыльная головня, фузариозная
    корневая гниль, гельминтоспориозная корневая гниль, плесневение семян, снежная плесень, мучнистая роса'
  method: 'Обработка семян с увлажнением перед посевом или заблаговременно (до 1 года). Расход рабочей жидкости
    — 10 л/т'
  wait: '— (1)'
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Протравливать семена можно заблаговременно (до 1 года) или непосредственно перед посевом; заблаговременно
    обрабатывают только кондиционные семена при надлежащих условиях дальнейшего хранения. Если обработанные
    семена хранятся до следующего сезона, необходимо контролировать их всхожесть. Рекомендуется использовать
    семена, очищенные от пыли и примесей.
  - Рабочий раствор готовят непосредственно перед применением. Препарат тщательно перемешивают, встряхивая
    канистру, и смешивают с водой в отдельной ёмкости в соотношении 1:1. Бак протравочной машины на треть
    заполняют водой и при непрерывном перемешивании вливают маточный раствор; ёмкость из-под него ополаскивают,
    сливая смыв в бак. Затем доводят бак водой до полного объёма и перемешивают до однородной суспензии;
    перемешивание продолжают во время обработки.
  - Для приготовления рабочего раствора используют воду температурой не ниже 10 °C — холодная вода снижает
    диспергируемость препарата. Значение pH воды — 5–7. Рабочую жидкость используют в тот же день.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Виал Трио можно применять в комбинации с инсектицидными протравителями Табу и Табу Нео. Препарат совместим
    с различными пестицидами для обработки семян, кроме препаратов с сильнощелочной или сильнокислой реакцией.
  - 'Порядок добавления компонентов в бак протравочной машины: СП → Виал Трио → СК (КС, ВСК) → СЭ → МЭ →
    ВРК (ВР). Каждый последующий компонент добавляется после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять смешиваемые компоненты на совместимость, а обработанные
    смесью семена перед посевом — на всхожесть.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке, с защитой от прямых солнечных лучей, увлажнения, загрязнения
    и механического повреждения.'
  - 'Температурный режим: от −10 до +30 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - Работы с препаратом проводят обязательно со средствами индивидуальной защиты органов дыхания, зрения
    и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10, СанПиН 1.2.1330-03). Запрещено применение в личных подсобных
    хозяйствах.
  - Протравливание проводят на централизованных пунктах протравливания при полной механизации процесса,
    эффективной вентиляции и обезвреживании сточных вод.
  - Место разлива засыпают песком или другим негорючим сорбентом, сорбент собирают в контейнеры и вывозят
    на обезвреживание в места, согласованные с природоохранными органами и Роспотребнадзором. Участок в
    помещении промывают водой с мылом или содой, участок земли перекапывают.
  - Не допускается загрязнение водоёмов препаратом или использованной тарой; запрещается сливать препарат
    на землю, в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат — протравитель семян, оценка токсичности для пчёл не требуется.
  - Применение в санитарной зоне рыбохозяйственных водоёмов запрещено.
mechanism:
- key: mech
  title: Как работают прохлораз, тиабендазол и ципроконазол
  paras:
  - Препарат сочетает три действующих вещества с разными механизмами действия. Ципроконазол (триазол) и
    прохлораз (имидазол) подавляют фермент деметилазу и нарушают образование клеточных мембран грибов;
    тиабендазол (бензимидазол) нарушает деление ядер клеток возбудителя.
  - Ципроконазол передвигается в молодые проростки и надёжно защищает от головнёвых заболеваний. Прохлораз
    проникает в семя неглубоко и эффективен против возбудителей на поверхности и в верхних покровах семян,
    а также против корневых гнилей; за счёт стабильности в почве защищает озимые от снежной плесени. Тиабендазол
    усиливает действие против возбудителей корневых гнилей и снежной плесени, сохраняющихся на растительных
    остатках в почве.
  - По данным производителя, препарат подходит для минимальной и нулевой обработки почвы и севооборотов,
    насыщенных зерновыми; полимерные добавки формы образуют на зерновке микроплёнку, препятствующую плесневению
    семян при хранении.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - На некоторые виды семенной инфекции препарат начинает действовать в первые часы после обработки; полностью
    его спектр раскрывается после высева протравленных семян в почву.
  - Защитное действие против почвенной и семенной инфекции сохраняется от прорастания семян до начала выхода
    в трубку.
- key: spectrum
  title: Спектр действия
  paras:
  - Головнёвые заболевания (твёрдая, каменная, пыльная, ложная пыльная), фузариозная и гельминтоспориозная
    корневые гнили, плесневение семян, снежная плесень и мучнистая роса на зерновых колосовых, кроме овса.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Сочетание трёх веществ с разными механизмами действия снижает риск резистентности. При планировании
    защиты всё же желательно чередовать препараты разных групп.
  - Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки
    глотки вызвать рвоту; повторить несколько раз (рвоту вызывают только у пострадавших в сознании), после
    чего вновь выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат с кожи куском ткани или ваты, не втирая, а затем обмыть загрязнённый участок
    водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды при разомкнутых веках.'
- lead: При первых признаках недомогания
  text: ' — немедленно отстранить пострадавшего от работы и вывести из зоны воздействия пестицида; осторожно
    снять с него одежду и средства индивидуальной защиты, избегая попадания препарата на кожу или органы
    дыхания; немедленно обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
