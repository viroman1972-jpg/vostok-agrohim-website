# и первая помощь — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/kadet/,
# 27.10.2026); срок хранения — госреестр (ПИ10; Гарант Оптима пишет 3 года, госреестр — 2). Форма — ВР по
# регистрации и канистре (заказчик 27.10.2026). Не перенесены: класс опасности «2 (высоко опасное)» (в карточке
# — по госреестру); «более 200 видов сорняков»; «нет необходимости смешивать с другими гербицидами»; марки
# опрыскивателей и агрегатов; сроки в днях и неделях и температура из описания действия (ПИ12); центр в информации
# для врача — ФГБУ. ПИ12.
