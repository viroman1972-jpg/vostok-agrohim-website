procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Препарат вносят наземным опрыскиванием вегетирующих посевов в фазу и с нормой, указанными в регламенте
    применения, утром или вечером. Широколистные культуры (овощные, плодовые, технические, виноградники)
    чувствительны к препарату — нельзя допускать сноса раствора на соседние посевы.
  - Рабочий раствор готовят на стационарных пунктах или передвижными агрегатами, позволяющими тщательно
    перемешать препарат с водой и отфильтровать раствор. В бак заливают расчётное количество воды и при
    включённой мешалке добавляют препарат. Без средств механизации готовить раствор не допускается; проливать
    раствор нельзя. Приготовленный раствор используют в тот же день, после обработки опрыскиватель промывают
    и высушивают.
  - Раствор готовят на заправочных площадках с асфальтовым или бетонным покрытием и санитарно-защитной
    зоной не менее 200 м, которую после работ обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим со многими фунгицидами и инсектицидами. Не следует смешивать его с гербицидами на
    основе производных циклогександиона, арилоксифеноксипропионатов и сульфонилмочевин.
  - Перед смешиванием в каждом конкретном случае необходима проверка на совместимость.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Условия хранения: в исправной заводской таре с этикеткой, в помещениях, специально предназначенных
    для пестицидов, отдельно от пищевых продуктов и фуража, с защитой от прямых солнечных лучей, влаги,
    загрязнения и механических повреждений.'
  - 'Температурный режим: от 0 до +30 °C.'
  - 'Срок хранения: 2 года.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в водоохранной зоне водных
    объектов. Препарат токсичен при вдыхании и выраженно раздражает слизистые оболочки глаз, поэтому работать
    с ним могут только специалисты по защите растений, лица под их контролем или прошедшие специальную
    профессиональную подготовку — в средствах индивидуальной защиты органов дыхания, зрения и кожи. Возможность
    скармливания животным соломы и зелёной массы кукурузы решают органы государственного ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Разлитый препарат не допускают в канализацию и водоёмы — его поглощают древесными опилками, песком
    или землёй. Загрязнённый сорбент и почву обезвреживают 10 % раствором кальцинированной соды или 7 %
    кашицей свежегашёной извести, собирают в промаркированные контейнеры для утилизации в местах, согласованных
    с природоохранными органами; загрязнённую землю перекапывают на штык лопаты.
  - Остатки препарата и тару утилизируют в соответствии с законодательством и санитарно-эпидемиологическими
    нормами.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат — 3 класс опасности по стойкости в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    20–24 часов. Пчеловодов оповещают о предстоящей обработке за 4–5 суток.
  - Запрещено применение в водоохранной зоне водных объектов.
mechanism:
- key: mech
  title: Как работают 2,4-Д и дикамба
  paras:
  - Оба действующих вещества относятся к синтетическим ауксинам. Препарат проникает в сорняки через листья,
    стебли и корни; действующие вещества передвигаются по растению во всех направлениях и нарушают обмен
    веществ, что приводит к гибели надземной массы и корневой системы.
  - Препарат уничтожает и корнеотпрысковые сорняки вместе с корневой системой — осот розовый, вьюнок полевой.
    Злаки (зерновые колосовые и кукуруза) к нему устойчивы.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Сначала сорняки теряют тургор, их листья и стебли подкручиваются; затем в верхней части растений появляются
    хлорозы и некрозы листьев. Скорость действия зависит от погоды — в тепле без осадков при достаточной
    влажности воздуха препарат действует быстрее.
  - Защитное действие против двудольных сорняков сохраняется в течение вегетационного периода.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние двудольные сорняки, в том числе устойчивые к 2,4-Д, 2М-4Х и триазинам, и некоторые многолетние
    двудольные — виды осота, бодяк, вьюнок полевой.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - По данным производителя, для комбинированного препарата резистентность маловероятна. Чтобы предотвратить
    появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
first_aid:
- lead: При первых признаках отравления
  text: ' (одышка, слезотечение, слюнотечение) — прекратить работу, вывести пострадавшего из опасной зоны,
    осторожно снять одежду и респиратор, избегая попадания препарата на кожу и в органы дыхания, и обратиться
    за медицинской помощью.'
- lead: При попадании на кожу
  text: ' — немедленно снять загрязнённую одежду, удалить препарат бумажной салфеткой, куском ткани или
    ватой, избегая грубого растирания, затем тщательно промыть кожу водой с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно обильно промыть большим количеством чистой проточной воды.'
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, дать пострадавшему выпить несколько стаканов воды со взвесью активированного
    угля (из расчёта 1 г сорбента на 1 кг массы тела) и вызвать рвоту раздражением задней стенки глотки
    (только если пострадавший в сознании); повторить несколько раз, после чего снова выпить стакан воды
    с активированным углём и немедленно обратиться к врачу.'
- lead: ''
  text: В местах работы с препаратом должна быть аптечка первой помощи. Во всех случаях отравления после
    оказания первой помощи необходимо обратиться к врачу.
