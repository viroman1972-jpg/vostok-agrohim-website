procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Перед применением препарат тщательно перемешивают в заводской упаковке. Бак опрыскивателя наполовину
    заполняют водой, включают мешалку, вливают расчётное количество препарата и при работающей мешалке
    доводят бак водой до полного объёма. Во время обработки рабочую жидкость постоянно перемешивают.
  - Рабочую жидкость используют в течение 2 часов после приготовления. Значение pH воды для приготовления
    рабочего раствора — 5–7.
  - Растения опрыскивают в период вегетации при появлении вредителей, против саранчовых — в период развития
    личинок младших возрастов. В рабочий раствор рекомендуется добавлять адъювант, например Аллюр, — особенно
    на сильно облиственных, опушённых и покрытых восковым налётом культурах.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Мамба → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях с принудительной
    и естественной вентиляцией, в герметично закрытой, без повреждений заводской упаковке, с защитой от
    прямых солнечных лучей, увлажнения, загрязнения и механического повреждения.'
  - 'Температурный режим: от −10 до +35 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Запрещается транспортировка и хранение совместно с пищевыми продуктами,
    лекарствами и кормами.
  - В связи с ингаляционной токсичностью и раздражающим действием на слизистые оболочки глаз работы с препаратом
    проводят только специалисты по защите растений или под их контролем, или лица, прошедшие специальную
    подготовку, обязательно со средствами индивидуальной защиты органов дыхания, зрения и кожи; во время
    работы нельзя есть, пить и курить. Запрещено применение в личных подсобных хозяйствах и авиационным
    способом.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для ручных
    — 7 дней.
  - Место разлива засыпают песком, землёй или другим негорючим сорбентом, сорбент собирают в контейнеры
    и вывозят на обезвреживание в места, согласованные с природоохранными органами и Роспотребнадзором.
    Участок в помещении промывают водой с мылом или содой, участок земли перекапывают.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 1 (высокоопасный). Применение требует соблюдения «Инструкции по профилактике
    отравления пчёл пестицидами», в том числе обязательного оповещения пчеловодов за 4–5 суток о препарате,
    сроках и зонах обработки.
  - 'Ограничения: обработка вечером после захода солнца при скорости ветра не более 1–2 м/с; погранично-защитная
    зона для пчёл — не менее 4–5 км; ограничение лёта пчёл — не менее 4–6 суток или удаление пчелиных семей
    из зоны обработки на срок более 6 суток.'
  - Применение в водоохранных зонах водных объектов, включая рыбоохранные зоны, запрещено.
mechanism:
- key: mech
  title: Как работает альфа-циперметрин
  paras:
  - Альфа-циперметрин — синтетический пиретроид с быстрым контактным и кишечным действием на нервную систему
    вредителей, проявляет так называемый «нокдаун-эффект».
  - Препарат некоторое время сохраняет остаточную активность за счёт отпугивающего действия — насекомые
    избегают питаться на обработанных растениях.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Вскоре после обработки вредители перестают питаться и передвигаться, а затем гибнут.
  - Продолжительность защитного действия зависит от вида вредителя, стадии его развития и погодных условий.
- key: spectrum
  title: Спектр действия
  paras:
  - Клопы, пьявицы, трипсы, тли, цикадки, блошки, цветоеды, долгоносики, колорадский жук, плодожорки, листовёртки,
    листовая филлоксера, саранчовые и другие объекты, указанные в регламенте применения для каждой культуры.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Для предупреждения резистентности препарат чередуют с инсектицидами другого механизма действия. Ориентироваться
    только на разные торговые названия недостаточно — разные препараты могут содержать действующие вещества
    одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить 1–2 стакана воды со взвесью энтеросорбента
    (активированный уголь или другой) по инструкции к нему, затем раздражением корня языка вызвать рвоту,
    после чего вновь дать выпить 1–2 стакана воды со взвесью сорбента и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат с кожи куском ткани или ваты, не втирая, а затем обмыть загрязнённый участок
    водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть глаза мягкой струёй чистой проточной воды при разомкнутых веках.'
- lead: При первых признаках недомогания
  text: ' — немедленно отстранить пострадавшего от работы и вывести из зоны воздействия пестицида; осторожно
    снять с него одежду и средства индивидуальной защиты, избегая попадания препарата на кожу или органы
    дыхания; немедленно обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: антидота нет, лечение симптоматическое. При необходимости — консультация
