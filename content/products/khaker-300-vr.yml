procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Наибольшая эффективность достигается при обработке молодых, активно растущих сорняков. Однолетние виды
    наиболее чувствительны в фазе 2–6 листьев, осоты — в фазе розетки. При перерастании сорняками чувствительной
    фазы и при сильной засорённости используют максимальные нормы. На сахарной свёкле в фазах «вилочка»
    — первая пара листьев применяют минимальные нормы.
  - Если вода жёсткая, гидрокарбонатная или щелочная (pH выше 7), перед заправкой Хакера 300 в воду рекомендуется
    добавить кондиционер Сойлент согласно инструкции; на льне Сойлент не добавляют.
  - Рабочий раствор готовят непосредственно перед опрыскиванием. Бак опрыскивателя наполовину заполняют
    чистой водой, включают мешалку, добавляют отмеренное количество препарата и доливают воду до полного
    объёма при перемешивании. Перемешивание продолжают и во время обработки; раствор используют в течение
    нескольких часов. Значение pH воды — 6–7.
  - Раствор готовят и заправляют опрыскиватель на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → Хакер 300 → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +30 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - При необходимости пересева обработанных площадей в текущем году можно высевать зерновые, кукурузу,
    рапс, горчицу, капусту, лён; на следующий год — все культуры без ограничений. Для оценки последействия
    рекомендуется биотестирование почвы.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение авиационным методом. Работы с препаратом без средств индивидуальной защиты органов
    дыхания, глаз и кожи запрещены (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10). Возможность скармливания животным
    соломы зерновых, зелёной массы кукурузы, кормовой свёклы и ботвы сахарной свёклы решают органы государственного
    ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    собирают в контейнеры для обезвреживания. Участок в помещении промывают водой с мылом или содой (200
    г соды на ведро воды), участок земли перекапывают.
  - Обезвреживание и утилизация остатков препарата и сорбента — по СанПиН 1.2.2584-10 и СанПиН 1.2.1330-03.
    Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Пчеловодов оповещают за 4–5 суток о препарате, сроках
    и зонах применения; обработку проводят ранним утром или вечером после захода солнца при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    20–24 часов.
  - Запрещено применение в водоохранных зонах водных объектов, включая рыбохозяйственные водоёмы.
mechanism:
- key: mech
  title: Как работает клопиралид
  paras:
  - Клопиралид — синтетический ауксин из хлорпроизводных пиридинкарбоновой кислоты. Он поглощается листьями,
    переносится в точку роста, корни и корневища, легко перемещается по растению, нарушает деление клеток
    и останавливает рост сорняка.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост сорняков подавляется вскоре после обработки. Затем листья чувствительных растений становятся хлоротичными,
    утолщаются и скручиваются, стебли утолщаются и растрескиваются, точка роста отмирает. Скорость гибели
    зависит от видового состава сорняков, их фазы, степени засорённости и погоды.
  - Хакер 300 уничтожает сорняки, попавшие под обработку, и некоторое время сдерживает последующие всходы
    чувствительных однолетних двудольных сорняков.
- key: spectrum
  title: Спектр действия
  paras:
  - Амброзия полыннолистная, бодяк полевой, василёк синий, вика сорно-полевая, горец (виды), горчак ползучий,
    гречиха татарская, гречишка вьюнковая, дурнишник обыкновенный, крестовник обыкновенный, латук компасный,
    мать-и-мачеха, одуванчик лекарственный, осот голубой, осот огородный, осот полевой, паслён чёрный, полынь
    (виды), пупавка собачья, ромашка (виды) и другие сорняки семейств астровых, бобовых, гречишных и паслёновых.
  - Уничтожает падалицу подсолнечника, в том числе сортов и гибридов, устойчивых к сульфонилмочевинам (трибенурон-метилу)
    и имидазолинонам.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - При длительном применении в посевах могут накапливаться виды сорняков, слабовосприимчивые к клопиралиду.
    Чтобы этого избежать, препарат чередуют с гербицидами других химических классов.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить 1–2 стакана воды со взвесью энтеросорбента
    (активированный уголь и др.) в соответствии с рекомендациями по его применению, затем раздражением задней
    стенки глотки вызвать рвоту; повторить несколько раз, после чего снова выпить 1–2 стакана воды со взвесью
    сорбента и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть глаза мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять средства индивидуальной защиты и рабочую одежду, избегая попадания препарата на кожу, и немедленно
    обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
