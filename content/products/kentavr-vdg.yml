# Источники: регламент — госреестр (agroxxi v176, kentavr-vdg-2); процедуры — инструкция АО Фирма «Август»
# (avgust.com/products/rf/kentavr/, 27.10.2026); срок хранения — госреестр (ПИ10, совпадает с Августом).
# Фитотоксичность не заполнена — «безопасен для пшеницы» не формулировка ПИ12, Август упоминает изменение
# окраски листьев. Не перенесены: «низкие уровни рисков», «проблема резистентности не возникает», данные
# испытаний по пырею, сроки в днях из описания действия (ПИ12). ПИ12.
