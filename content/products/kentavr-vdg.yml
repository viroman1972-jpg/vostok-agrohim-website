regulation_notes:
  liquid_flow: 50–300 л/га (в зависимости от типа распылителей)
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Самостоятельно Кентавр наиболее эффективен в норме 50 г/га. В норме 25 г/га его рекомендуется применять
    только в смеси с Ластиком Топ (0,3 л/га) или Ластиком Экстра (0,6–0,8 л/га).
  - Рабочий раствор готовят непосредственно перед применением. Бак наполовину заполняют чистой водой, включают
    мешалку, добавляют отмеренное количество препарата и доливают воду при перемешивании; адъювант вносят
    в конце заполнения бака.
  - Рекомендуется маточный раствор — в миксере (баке-смесителе), заполненном на треть водой, или в ведре
    на 8–10 л, заполненном наполовину (не более 300 г препарата на ведро, долить до трёх четвертей объёма);
    тару и мерную ёмкость ополаскивают, сливая смыв в бак.
  - Значение pH воды — 6–8. Раствор готовят на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной реакцией; для
    лучшего эффекта можно добавить адъювант Адью. Не применять совместно с фосфорорганическими инсектицидами
    и не чередовать с ними, если между опрыскиваниями проходит менее 14 дней, — опасность фитотоксичности.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → Кентавр → ВДГ (СТС) → СК (ВСК)
    → СЭ → КЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: банки по 300 г.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +35 °C.'
  - 'Срок хранения: 4 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Твёрдую пшеницу можно высевать не ранее чем через 4 месяца после применения; ячмень, картофель, сою,
    сахарную свёклу, рапс, подсолнечник — через 9 месяцев; горох — через 11; кормовую и столовую свёклу,
    капусту, морковь, редис — через 12; горчицу — через 24 месяца.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах и авиационным способом. Работы с препаратом без средств
    индивидуальной защиты органов дыхания, зрения и кожи запрещены (ГОСТ 12.3.041-86, СП 2.2.3670-20, СанПиН
    2.1.3684-21, СанПиН 1.2.3685-21).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Рассыпанный препарат собирают в сухие ёмкости для обезвреживания и герметично закрывают; участок в
    помещении промывают водой с мылом, участок земли перекапывают. Остатки препарата подлежат сбору, термическому
    обезвреживанию или вывозу на полигоны токсичных промышленных отходов. Запрещается сливать препарат
    в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    20–24 часов.
  - Запрещено применение в водоохранных зонах водных объектов, включая рыбохозяйственные водоёмы.
mechanism:
- key: mech
  title: Как работает флукарбазон натрия
  paras:
  - Флукарбазон натрия относится к сульфониламинокарбонилтриазолинонам — ингибиторам ацетолактатсинтазы.
    Препарат действует на сорняки через почву и листья, по флоэме и ксилеме распределяется по всему растению
    и, поглощаясь проростками, останавливает их рост.
  - Пшеница быстро разрушает действующее вещество в молодых тканях; иногда после обработки окраска её листьев
    ненадолго меняется, на урожае это не сказывается.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Первые симптомы — пожелтение и побеление листьев сорняков — появляются через несколько дней, затем сорняки
    погибают; скорость зависит от погоды. Препарат сохраняет защитное действие длительное время.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние злаковые сорняки — метлица (виды), овсюг, щетинник (виды); подавляет костёр японский и ржаной,
    райграс.
  - 'Двудольные: контролирует горчицу полевую, ярутку полевую, редьку дикую, пастушью сумку, гулявник Лёзеля,
    дескурайнию Софии и др.; подавляет щирицу запрокинутую, горец вьюнковый, подмаренник цепкий, пикульник
    обыкновенный, коноплю сорную, липучку оттопыренную и др.'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Флукарбазон натрия — ингибитор ацетолактатсинтазы, поэтому препарат рекомендуется применять не чаще
    одного раза за сезон и чередовать с гербицидами с другим механизмом действия.
  - Для расширения спектра против двудольных его можно смешивать с другими ингибиторами ацетолактатсинтазы;
    с гербицидами группы ингибиторов АЦЦазы — только если это усиливает действие против злаковых.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить 1–2 стакана воды со взвесью энтеросорбента
    (активированный уголь и др.) в соответствии с рекомендациями по его применению, затем раздражением задней
    стенки глотки вызвать рвоту; повторить несколько раз, после чего снова выпить 1–2 стакана воды со взвесью
    сорбента.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть глаза мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять средства индивидуальной защиты и рабочую одежду, избегая попадания препарата на кожу, и немедленно
    обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России (круглосуточно): 129090,
    Москва, Большая Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
