procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочую жидкость готовят непосредственно перед опрыскиванием на стационарных заправочных станциях
    или с помощью передвижных агрегатов с механическими мешалками; при их отсутствии — прямо в баке опрыскивателя.
    Бак наполовину заполняют водой, включают мешалку, вливают расчётное количество препарата и при работающей
    мешалке доводят водой до полного объёма.
  - Рабочую жидкость используют в день приготовления; после обработки опрыскиватель промывают и высушивают.
    Значение pH воды для приготовления рабочего раствора — 4–5. При жёсткой, гидрокарбонатной или щелочной
    воде перед заправкой Алиота в воду рекомендуется добавлять кондиционер Сойлент.
  - При опрыскивании полевых культур в рабочий раствор рекомендуется добавлять адъювант Аллюр.
  - Незагруженные складские помещения обрабатывают перед загрузкой — влажной дезинсекцией ручными или
    моторизованными опрыскивателями. Раствор готовят непосредственно перед применением и используют в
    день приготовления.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Алиот нельзя смешивать или применять последовательно с гербицидами на основе карбаматов,
    сульфонилмочевин, имидазолинонов и мезотриона из-за опасности фитотоксичности.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Алиот → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после
    полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, с защитой от
    солнечных лучей, увлажнения, загрязнения и механического повреждения, в герметично закрытой, без повреждений
    заводской упаковке, не ближе 3 м от отопительных приборов.'
  - 'Температурный режим: от 0 до +25 °C. Не допускать замерзания препарата при хранении.'
  - 'Срок хранения: 2 года в невскрытой заводской упаковке при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов (ГОСТ
    14189, СанПиН 1.2.2584-10). Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - При применении соблюдают требования СанПиН 1.2.2584-10 и ГОСТ 12.3.041-86; работы без средств индивидуальной
    защиты органов дыхания, зрения и кожи запрещены. Запрещено применение авиационным способом.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня. Вход в обработанные
    складские помещения — не ранее чем через 1 сутки, после тщательного проветривания и при содержании
    малатиона в воздухе рабочей зоны не выше ПДК.
  - Пролитый препарат засыпают негорючим сорбентом (песок, земля) до полного впитывания, сорбент собирают
    в контейнеры, участок обезвреживают 10 % раствором кальцинированной соды, загрязнённую землю перекапывают
    на глубину штыка лопаты.
  - Остатки препарата, загрязнённые сорбенты и тару вывозят на термическое уничтожение в места, согласованные
    с природоохранными органами и Роспотребнадзором.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 1 (высокоопасный). Применение требует соблюдения «Инструкции по профилактике
    отравления пчёл пестицидами», в том числе предварительного оповещения местных пчеловодов о препарате,
    сроках и зонах обработки.
  - 'Ограничения: обработка в утренние и вечерние часы при скорости ветра не более 0–1 м/с, днём — в пасмурную
    прохладную погоду, когда пчёлы не вылетают из улья; погранично-защитная зона для пчёл — не менее 4–5
    км; ограничение лёта пчёл — не менее 4–5 суток.'
  - Применение в водоохранной зоне рыбохозяйственных водоёмов запрещено.
mechanism:
- key: mech
  title: Как работает малатион
  paras:
  - Малатион относится к фосфорорганическим соединениям, обладает контактным и частично фумигационным
    действием на насекомых и клещей.
  - Действующее вещество подавляет фермент ацетилхолинэстеразу и нарушает передачу нервных импульсов у
    насекомых, что приводит к параличу и гибели вредителей.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Гибель вредителей и их личинок наступает вскоре после обработки. Препарат не действует на яйца насекомых.
- key: spectrum
  title: Спектр действия
  paras:
  - Алиот эффективен в основном против сосущих вредителей — тлей, трипсов, цикадок, клопов и растительноядных
    клещей. Подавляет гусениц младших возрастов и личинок пилильщиков, а также вредителей запасов в складских
    помещениях.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы снизить риск резистентности, препарат чередуют с инсектицидами другого механизма действия из
    других химических классов. Ориентироваться только на разные торговые названия недостаточно — разные
    препараты могут содержать действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, дать пострадавшему выпить несколько стаканов тёплой воды с активированным
    углём (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки глотки вызвать
    рвоту (если пострадавший в сознании). Повторить несколько раз, затем вновь дать выпить стакан воды с
    активированным углём.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания кожи, а затем
    обмыть загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — немедленно промыть глаза мягкой струёй чистой проточной воды.'
- lead: При первых признаках отравления
  text: ' — вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду и средства индивидуальной
    защиты, избегая попадания препарата на кожу.'
- lead: ''
  text: После оказания первой помощи при необходимости обратиться за медицинской помощью.
