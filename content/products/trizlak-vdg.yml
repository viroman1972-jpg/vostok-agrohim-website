# Источники: регламент — госреестр (agroxxi v176, trizlak-vdg-2); описание, рекомендации и условия хранения
# — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/trizlak/, 27.10.2026);
# срок хранения — госреестр (ПИ10, совпадает с Гарант Оптимой). ПАВ в регламенте назван по действующему
# веществу (торгового названия нет в ассортименте). Не перенесены: «уборка не ранее 45 дней» (по госреестру
# срок ожидания 60 дней), сроки в часах и днях из описания действия (ПИ12). Первой помощи и транспортировки
# у Гарант Оптимы нет — блоки пустые (этикетки не запрашиваем). ПИ12.
