regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Препарат применяют от фазы 2–3 листьев культуры до выхода в трубку у ярового ячменя и до появления
    флагового листа у озимой пшеницы. Против однолетних двудольных лучший результат — в фазе 2–4 листьев
    сорняков; горчица полевая, мак дикий и ромашка лучше уничтожаются в более поздние фазы; осоты — в фазе
    розетки или при высоте 10–15 см; подмаренник цепкий — до 4 мутовок. Переросшие и менее чувствительные
    сорняки могут не погибнуть, но прекращают рост и перестают конкурировать с культурой.
  - При высокой густоте стояния растений расход рабочего раствора увеличивают до 400 л/га. Рабочий раствор
    используют в течение 24 часов.
  - На изреженных посевах, при высокой численности трудноискоренимых и переросших сорняков, в жаркую и
    сухую погоду в раствор обязательно добавляют ПАВ — он улучшает смачивание сорняков. Овёс обрабатывают
    без ПАВ — возможно угнетение культуры. Препарат не рекомендуется применять на посевах проса.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с большинством пестицидов и жидких удобрений; совместимость компонентов баковой смеси
    в каждом конкретном случае проверяют заранее.
  - Против вероники плющелистной, вьюнка полевого, паслёна чёрного и амброзии полыннолистной Тризлак применяют
    в баковых смесях с гербицидами на основе 2,4-Д и дикамбы в половинных нормах.
  - Не рекомендуется смешивать препарат с фосфорорганическими инсектицидами — возможно угнетение культуры.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: ёмкости 500 г.'
  - 'Условия хранения: в исправной заводской таре с этикеткой, на складах, специально предназначенных для
    пестицидов, отдельно от других пестицидов, пищевых продуктов и фуража, с защитой от прямых солнечных
    лучей, влаги, загрязнения и механических повреждений.'
  - 'Температурный режим: от −25 до +25 °C.'
  - 'Срок хранения: 5 лет.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Препарат быстро разлагается в почве и не ограничивает посев последующих культур. Если обработанные посевы
    погибли, пересевать можно только яровые зерновые.
mechanism:
- key: mech
  title: Как работает трибенурон-метил
  paras:
  - Трибенурон-метил относится к сульфонилмочевинам. Он проникает в сорняки через надземную часть и блокирует
    деление клеток — рост чувствительных сорняков прекращается вскоре после обработки.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Видимые симптомы появляются через несколько дней, затем сорняки полностью погибают. Низкая температура
    и засуха замедляют действие препарата.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние и многолетние двудольные сорняки, в том числе устойчивые к 2,4-Д и МЦПА, — подмаренник
    цепкий, виды ромашки, виды мака, дескурайния Софии, фиалка полевая, бодяк полевой и др.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
