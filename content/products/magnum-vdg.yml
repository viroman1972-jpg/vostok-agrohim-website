# для ЛПХ не переносилась; строки наземной и авиаобработки объединены); процедуры — инструкция АО Фирма «Август»
# (avgust.com/products/rf/magnum/, 27.10.2026); срок хранения — госреестр (ПИ10, совпадает с Августом).
# По госреестру: применение в водоохранной зоне запрещено (Август пишет только о запрете авиаприменения в
# санитарной зоне рыбохозяйственных водоёмов). Не названы Деймос и Форкаст (нет в ассортименте). Не перенесены:
# «практически не токсичен» (ДЗ04), «эффективность практически не зависит от погоды», «случаев резистентности
# не выявлено», центр Склифосовского (в информации для врача — ФМБА), сроки в часах, днях и неделях из описания
# действия (ПИ12). ПИ12.
