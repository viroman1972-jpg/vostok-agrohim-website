regulation_notes:
  liquid_flow: наземное опрыскивание — 50–300 л/га, авиационное — 25–50 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Обработку рекомендуется проводить рано утром (до 9 часов) и вечером (с 17 часов). Тщательно избегать
    сноса рабочей жидкости на соседние участки с чувствительными культурами — свёклой, рапсом, подсолнечником,
    бобовыми и овощными. Запрещена обработка зерновых с подсевом бобовых и кормовых трав.
  - В рабочий раствор рекомендуется добавлять адъювант Адью.
  - После обработки опрыскиватель необходимо особенно тщательно очищать и промывать — даже незначительные
    остатки препарата способны повредить чувствительные (незерновые) культуры.
  - 'Рабочий раствор готовят непосредственно перед применением; сначала рекомендуется сделать маточный
    раствор: ведро на четверть заполняют водой, добавляют препарат на одну заправку, тщательно перемешивают
    и доливают воду до трёх четвертей объёма. Бак опрыскивателя наполовину заполняют водой, включают мешалку,
    вливают маточный раствор и доливают воду до полного объёма. Значение pH воды — 6–7.'
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - По данным производителя, Магнум можно комбинировать в баковых смесях с гербицидами Балерина и Балерина
    Супер и адъювантом Адью. Не смешивать с фосфорорганическими инсектицидами и не чередовать с ними, если
    между обработками проходит менее 14 дней.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → Магнум → ВДГ (СТС) → СК (ВСК)
    → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после
    полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: банки по 100 г препарата.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +45 °C.'
  - 'Срок хранения: 5 лет со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - На нейтральных и щелочных почвах на следующий год после уборки зерновых (льна) нельзя высевать свёклу
    и овощи; подсолнечник и гречиху — только после глубокой вспашки.
  - Нельзя высевать подсолнечник, гречиху и рапс на следующий год, если pH почвы выше 7,5 или если от применения
    препарата до посева этих культур была продолжительная засуха.
  - При необходимости пересева обработанных площадей высевают только зерновые (по госреестру — яровые зерновые).
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Работы с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены (ГОСТ
    12.3.041-86, СанПиН 1.2.2584-10).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый рабочий раствор засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый
    песок собирают в контейнеры для утилизации согласно местной инструкции; участок промывают водой с мылом
    или содой (200 г соды на ведро воды). Обезвреживание и утилизация тары, остатков препарата и промывных
    вод — по СанПиН 1.2.2584-10. Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Действующее вещество среднестойко или очень стойко в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят ранним утром или вечером после захода
    солнца при скорости ветра менее 4–5 м/с; погранично-защитная зона для пчёл — от 2–3 км; ограничение
    лёта пчёл — 6–9 часов. Обязательно предварительное оповещение местных пчеловодов о препарате, сроках
    и зонах применения.
  - Рыбохозяйственная оценка — 3 класс опасности. Запрещено применение в водоохранной зоне водных объектов.
mechanism:
- key: mech
  title: Как работает метсульфурон-метил
  paras:
  - Метсульфурон-метил относится к производным сульфонилмочевины. Магнум проникает в сорняки через листья
    и корни и передвигается по ксилеме и флоэме. Препарат подавляет фермент ацетолактатсинтазу и тем самым
    синтез незаменимых аминокислот — лейцина, изолейцина и валина; деление клеток прекращается, рост останавливается,
    и сорняки погибают.
  - Препарат быстро и полностью поглощается растением, поэтому дождь после этого не снижает его эффективность.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост сорняков замедляется вскоре после поглощения препарата. Видимые симптомы появляются через несколько
    дней — в тёплую влажную погоду раньше, при холоде и засухе позже; затем сорняки полностью погибают.
  - 'Симптомы: резкая остановка роста побегов и корней, антоциановая окраска, обесцвечивание жилок, гибель
    верхушечной почки, хлороз, некроз. Переросшие или менее чувствительные сорняки не погибают, но угнетаются
    и прекращают развитие.'
  - По данным производителя, препарат защищает посевы в течение всего вегетационного сезона.
- key: spectrum
  title: Спектр действия
  paras:
  - Амброзия полыннолистная, бодяк полевой, борщевик Сосновского, горец (виды), горчица полевая, дескурайния
    Софии, звездчатка средняя, одуванчик лекарственный, осот огородный, пастушья сумка, пикульник (виды),
    подсолнечник сорный, редька дикая, ромашка непахучая, щирица запрокинутая, фиалка полевая, ярутка полевая
    и др.; на землях несельскохозяйственного назначения — также древесно-кустарниковая растительность.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, Магнум чередуют с гербицидами других химических групп
    или применяют в баковых смесях.
first_aid:
- lead: При случайном проглатывании
  text: ' — выпить 1–2 стакана воды с активированным углём (из расчёта 1 г сорбента на 1 кг массы тела),
    вызвать рвоту раздражением задней стенки глотки.'
- lead: При попадании на кожу
  text: ' — обильно смыть водой с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно промыть большим количеством проточной воды.'
- lead: ''
  text: При всех случаях отравления — немедленно вызвать врача.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, антидота нет. При необходимости — консультация
