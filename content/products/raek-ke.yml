procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочую жидкость готовят непосредственно перед применением. Препарат перемешивают в заводской упаковке,
    отмеряют количество на одну заправку, бак опрыскивателя наполовину заполняют водой и при непрерывном
    перемешивании вливают препарат, затем доводят бак водой до полного объёма. Перемешивание продолжают
    во время обработки.
  - Рабочую жидкость используют в тот же день. Значение pH воды для приготовления рабочего раствора — 5–7.
  - На яблоне и груше профилактические опрыскивания проводят начиная с фазы розового бутона; до фазы «диаметр
    плодов 10 мм» интервал — 7–10 дней, далее — 10–14 дней. По сигналам службы прогноза обработку проводят
    не позднее чем через 4 суток после начала заражения. Раёк применяют блоком обработок или чередуют с
    фунгицидами других химических классов; после блока препараты других классов можно применять через 8
    дней после последней обработки этим препаратом.
  - На сахарной свёкле опрыскивание проводят при появлении первых симптомов болезни; при сильной заражённости
    повторяют через 10–15 дней.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией, — например, с инсектицидом Шарпей.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Раёк → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после
    полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: банки 1 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +35 °C.'
  - 'Срок хранения: 3 года в невскрытой заводской упаковке.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - При работе соблюдают требования ГОСТ 12.3.041-86 и СанПиН 1.2.2584-10; работы без средств индивидуальной
    защиты органов дыхания, зрения и кожи запрещены.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для ручных
    — 7 дней.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.2584-10. Не допускается
    загрязнение водоёмов препаратом или использованной тарой; запрещается сливать препарат в канализацию
    и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат малостоек в почве (3 класс опасности по стойкости).
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят в утренние и вечерние часы, днём — в
    пасмурную прохладную погоду, когда пчёлы не вылетают из улья, при скорости ветра не более 4–5 м/с; погранично-защитная
    зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее 5–6 часов. Обязательно предварительное
    оповещение местных пчеловодов о препарате, сроках и зонах применения.
  - Рыбохозяйственная оценка — 3 класс опасности; не допускать попадания препарата в рыбохозяйственные
    водоёмы.
mechanism:
- key: mech
  title: Как работает дифеноконазол
  paras:
  - 'Дифеноконазол относится к триазолам — ингибиторам деметилирования (DMI): нарушает биосинтез стеролов
    у грибов, подавляя рост ростовых трубок, дифференциацию клеток и рост мицелия.'
  - Препарат обладает высокой системной активностью, профилактическим и лечебным действием. На яблоне и
    груше он защищает листья и плоды.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат проникает в растение в первые часы после обработки. Продолжительность профилактической защиты
    зависит от интенсивности развития болезни; лечебное действие проявляется, если обработка проведена вскоре
    после начала заражения.
- key: spectrum
  title: Спектр действия
  paras:
  - Парша и мучнистая роса яблони и груши, церкоспороз, мучнистая роса и альтернариоз свёклы, альтернариоз
    картофеля и томата.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - По данным производителя, случаев резистентности к препарату не выявлено. Чтобы предотвратить её появление,
    Раёк чередуют с фунгицидами других химических классов. Ориентироваться только на разные торговые названия
    недостаточно — разные препараты могут содержать действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, выпить несколько стаканов воды со взвесью активированного угля (из расчёта
    1 г сорбента на 1 кг массы тела), а затем вызвать рвоту раздражением задней стенки глотки; при необходимости
    повторить несколько раз, после чего выпить стакан воды с активированным углём и немедленно обратиться
    к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух, сменить загрязнённую одежду и вызвать врача.'
- lead: При попадании на кожу
  text: ' — снять загрязнение ватой или куском ткани, осторожно, не втирая, затем тщательно промыть кожу
    водой или слабым содовым раствором.'
- lead: При попадании в глаза
  text: ' — немедленно промывать глаза большим количеством чистой проточной воды в течение 15 минут при
    открытых веках и обратиться к врачу.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
