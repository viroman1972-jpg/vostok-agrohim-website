# Источник: инструкция АО Фирма «Август» (avgust.com/products/rf/allyur/, 27.10.2026). В справочнике
# пестицидов agroxxi препарата нет (ПАВ), поэтому таблицы регламента нет; нормы по расходу рабочей жидкости —
# в блоке применения. Не названы препараты вне ассортимента (Эгида, Крейцер, Дублон Супер, Бицепс, Деймос,
# Когорта, Морион, Пилот, Кобальт, Кредо, Рэгги); из нашего ассортимента — не более трёх на группу.
# Не перенесено: «уникальная комбинация», «превосходные результаты», сравнение с ПАВ на основе этоксилата
# изодецилового спирта (это состав Адью). ПИ12.
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Аллюр смешивают с пестицидами непосредственно в баке опрыскивателя. Норма расхода зависит от расхода
    рабочей жидкости — при расходе менее 100 л/га 0,025–0,1 л/га; 100–150 л/га — 0,1 л/га; 150–200 л/га
    — 0,15 л/га; более 200 л/га — 0,25 л/га. Способ и сроки обработки определяются компонентом баковой смеси.
  - Адъювант легко смешивается с водой при температуре от 5 до 25 °C, одинаково работает в мягкой и в жёсткой
    воде. Значение pH воды для приготовления рабочего раствора — 5,5–7.
  - Рабочий раствор готовят непосредственно перед опрыскиванием. Препарат перемешивают в заводской упаковке,
    бак опрыскивателя заполняют водой не менее чем наполовину, при включённой мешалке добавляют Аллюр на
    одну заправку, затем пестициды, доливают воду до полного объёма и продолжают перемешивание. Освободившуюся
    тару трижды ополаскивают водой и выливают её в бак опрыскивателя.
  - Аллюр слабо пенится, поэтому очерёдность его внесения не столь важна, но рекомендуется добавлять его
    перед другими компонентами. Рабочий раствор готовят и заправляют опрыскиватель на специальных площадках,
    которые затем обезвреживают.
  - Добавлять Аллюр особенно полезно при неблагоприятной погоде, воздушной засухе, росе и угрозе осадков,
    работе опрыскивателя на повышенной скорости, сильном ветре, а также на чувствительных к препаратам-партнёрам
    культурах в стрессовых условиях, например в жару.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Аллюр совместим с большинством зарегистрированных пестицидов и агрохимикатов, в том числе на основе
    сульфонилмочевин, глифосата, хлороталонила, дитиокарбаматов, триазолов, морфолинов, стробилуринов,
    пиримидиновых оснований, гидроксианилидов и хлормекватхлорида. В смеси с хлормекватхлоридом Аллюр
    усиливает его росторегулирующее действие в более широком интервале температур.
  - По данным производителя, Аллюр применяют с гербицидами для кукурузы Дублон Голд и Эскудо, гербицидами
    сплошного действия Торнадо 500 и Торнадо 540, системными фунгицидами Колосаль, Колосаль Про и Спирит
    (особенно в жаркую сухую погоду), а также с контактными и системными инсектицидами.
  - 'Порядок добавления компонентов в бак: Аллюр → СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК)
    → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР). Каждый последующий компонент добавляется после полного
    растворения (диспергирования) предыдущего. Во всех случаях необходимо проверять физическую и химическую
    совместимость компонентов баковой смеси.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −15 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения в невскрытой заводской
    упаковке.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - При применении соблюдают требования СанПиН 2.2.2.1327-03 «Гигиенические требования к организации технологических
    процессов, производственному оборудованию и рабочему инструменту».
  - При проливе участок засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    помещают в контейнеры для обезвреживания. Участок в помещении промывают водой с мылом или содой (200
    г соды на ведро воды), участок земли перекапывают.
  - Уничтожение и обезвреживание препарата — по СанПиН 2.1.7.1322-03. Отходы препарата, загрязнённая тара
    и сорбенты подлежат сбору, термическому обезвреживанию или вывозу на полигоны токсичных промышленных
    отходов или в места, согласованные с местными природоохранными органами и Роспотребнадзором.
  - Тару трижды ополаскивают водой, промывную воду выливают в бак с рабочим раствором; вторичное использование
    тары не допускается. Запрещается сливать препарат и промывные воды в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Меры охраны полезной флоры и фауны определяются свойствами компонентов баковой смеси, с которыми применяется
    Аллюр.
mechanism:
- key: mech
  title: Как работает Аллюр
  paras:
  - Аллюр — многофункциональное поверхностно-активное вещество из двух компонентов. Первый — липофильный
    пенетрант — повышает проницаемость препаратов-партнёров, снижает поверхностное натяжение капель и увеличивает
    площадь их растекания. Второй — смачиватель, который также гасит пену, смягчает воду, работает как
    антистатик и эмульгатор.
  - С гербицидами Аллюр ускоряет проникновение действующих веществ через кутикулярные воска сорняков и
    помогает каплям удерживаться на слабо смачиваемых и наклонных листьях злаковых. Это особенно важно
    для сорняков с восковым налётом (марь, полынь, щирица, горцы, молочай) и густым опушением (бодяк,
    чистец, татарник, вероника), а также для частично переросших сорняков.
  - С фунгицидами Аллюр улучшает закрепление препарата на листе, его устойчивость к смыванию и перераспределение
    системных препаратов вглубь тканей. Со всеми группами препаратов адъювант снижает снос капель и чувствительность
    раствора к ионам металлов и органическим примесям в воде. По данным производителя, Аллюр сохраняет
    защитные кутикулярные воска на листьях культуры, что снижает стресс от гербицидной обработки.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды с активированным
    углём (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки глотки вызвать
    рвоту; повторить несколько раз для более полного удаления препарата из организма.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани или ваты, не втирая, затем обмыть загрязнённый участок водой с
    мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — немедленно отстранить пострадавшего от работы и вывести из зоны воздействия препарата; осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу и в органы дыхания.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: антидота нет, лечение симптоматическое. При необходимости — консультация
    ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая Сухаревская
    площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
