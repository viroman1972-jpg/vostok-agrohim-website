# Источники: регламент — госреестр (agroxxi v176, sokol-ke-2); описание и рекомендации по применению — сайт
# ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/sokol/, 27.10.2026); срок хранения
# — госреестр (ПИ10). Не перенесены: срок выхода для ручных работ 7 дней (в госреестре ручные работы не
# предусмотрены); запрет скармливания 28 дней; сроки в днях из описания действия (ПИ12). Первой помощи, условий
# хранения и транспортировки у Гарант Оптимы нет — блоки пустые (этикетки не запрашиваем). ПИ12.
regulation:
- rate: '0,5'
  crop: 'Свёкла сахарная и кормовая, подсолнечник, соя, рапс яровой'
  object: 'Однолетние злаковые сорняки (виды щетинника, просо куриное, просо сорно-полевое)'
  method: 'Опрыскивание сорняков в период их активного роста (от фазы 2–6 листьев до кущения)'
  wait: '60 (1)'
- rate: '1'
  crop: 'Свёкла сахарная и кормовая, подсолнечник, соя, рапс яровой'
  object: 'Многолетние злаковые сорняки (пырей ползучий)'
  method: 'Опрыскивание посевов при высоте пырея ползучего 10–15 см'
  wait: '60 (1)'
regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Препарат действует только на взошедшие к моменту обработки сорняки, поэтому опрыскивают при появлении
    максимального количества их всходов. Лучший результат — при активном росте сорняков (однолетние злаковые
    — от фазы 3–5 листьев до кущения, многолетние — при высоте 10–15 см).
  - Против однолетних злаковых препарат вносят независимо от фазы развития культуры, против многолетних
    (максимальная норма) — когда у культуры не меньше 2 настоящих листьев. Обработку рекомендуется провести
    до смыкания рядков культуры, чтобы раствор полностью и равномерно покрыл сорняки; при густом травостое
    расход рабочего раствора — не менее 300 л/га.
  - Не рекомендуется вносить препарат, если сорняки в стрессе (пониженная температура воздуха, засуха, заморозки)
    или у них ещё мало листьев, а также во время тумана или обильной росы — раствор стекает с листьев,
    и эффективность снижается. За 2 недели до обработки и 2 недели после неё почву не обрабатывают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим в баковых смесях с подавляющим большинством пестицидов и агрохимикатов. В каждом
    конкретном случае необходима предварительная проверка компонентов на совместимость.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Срок хранения: 3 года.'
procedures_tail:
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Погранично-защитная зона для пчёл — 2–3 км, ограничение
    лёта пчёл — 3–4 часа.
mechanism:
- key: mech
  title: Как работает галоксифоп-П-метил
  paras:
  - Галоксифоп-П-метил относится к арилоксифеноксипропионатам. Он поступает в сорняки через надземную
    массу, быстро перемещается в точки роста и блокирует синтез липидов и жирных кислот; злаковый сорняк
    перестаёт расти и погибает. Двудольные культуры к препарату устойчивы.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Первые признаки действия — побурение сорняков — при благоприятной погоде появляются через несколько
    дней после обработки, затем сорняки полностью погибают.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние злаковые сорняки — виды щетинника, просо куриное, просо сорно-полевое; многолетние — пырей
    ползучий.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
