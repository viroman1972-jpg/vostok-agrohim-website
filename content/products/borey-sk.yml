procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Перед применением препарат тщательно взбалтывают в заводской упаковке. Бак опрыскивателя наполовину
    заполняют водой, включают мешалку, вливают расчётное количество препарата и при работающей мешалке
    доводят бак водой до полного объёма. Во время опрыскивания рабочую жидкость постоянно перемешивают.
  - Рабочую жидкость используют в течение 4 часов после приготовления. Значение pH воды для приготовления
    рабочего раствора — 5–6,5.
  - Посевы опрыскивают по всходам, против остальных вредителей — в период вегетации при достижении экономического
    порога вредоносности; против саранчовых — в период развития личинок. Регистрация на пшенице, ячмене
    и рапсе распространяется на яровые и озимые культуры.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией, — например, с фунгицидами Колосаль и Колосаль Про. В рабочий раствор рекомендуется добавлять
    адъювант, например Аллюр.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → Борей → СК (ВСК)
    → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после
    полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: флаконы 1 л, канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −10 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - При применении соблюдают требования ГОСТ 12.3.041-86 и СанПиН 1.2.1077-01. Работы с препаратом без
    средств индивидуальной защиты кожи, глаз и органов дыхания запрещены. Запрещено применение в личных
    подсобных хозяйствах и в санитарной зоне рыбохозяйственных водоёмов.
  - Рабочий раствор готовят только с использованием средств механизации, не допуская пролива; после обработки
    опрыскиватель промывают и высушивают.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для ручных
    — 7 дней.
  - Пролитый препарат засыпают сорбентом (песок или опилки) до полного впитывания, сорбент собирают в контейнеры,
    участок обезвреживают 3–5 % раствором кальцинированной соды и промывают водой.
  - Остатки препарата, загрязнённые сорбенты и тару вывозят на термическое уничтожение в места, согласованные
    с природоохранными органами и учреждениями Госсанэпиднадзора.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 1 (высокоопасный). Применение требует соблюдения «Инструкции по профилактике
    отравления пчёл пестицидами», в том числе предварительного оповещения местных пчеловодов о препарате,
    сроках и зонах обработки. Запрещается обработка цветущих энтомофильных культур в период активного лёта
    пчёл.
  - 'Ограничения: обработка в утренние и вечерние часы при скорости ветра не более 1–2 м/с, днём — в пасмурную
    прохладную погоду, когда пчёлы не вылетают из улья; погранично-защитная зона для пчёл — не менее 4–5
    км; ограничение лёта пчёл — не менее 120–140 часов.'
  - Препарат токсичен для водных организмов — применение в водоохранной зоне рыбохозяйственных водоёмов
    запрещено.
mechanism:
- key: mech
  title: Как работают имидаклоприд и лямбда-цигалотрин
  paras:
  - Борей сочетает два действующих вещества из разных химических классов. Имидаклоприд — неоникотиноид
    с системной активностью и контактно-кишечным действием; проникает в растение через листья, стебли
    и корни и передвигается по сосудистой системе. Лямбда-цигалотрин — синтетический пиретроид контактно-кишечного
    действия, остаётся на поверхности обработанных растений.
  - Оба вещества нарушают работу нервной системы насекомых. Вредители поражаются как при опрыскивании,
    так и при питании на обработанном растении и внутри него, поэтому препарат действует и на скрытоживущих
    вредителей, и на питающихся на нижней стороне листьев.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - После попадания препарата в организм вредители быстро прекращают питание и затем гибнут.
  - Препарат сочетает быстрое начальное действие с продолжительным периодом защиты; по данным производителя,
    устойчив к воздействию интенсивных солнечных лучей и жары.
- key: spectrum
  title: Спектр действия
  paras:
  - Грызущие и сосущие вредители — клопы, тли, трипсы, блошки, жуки, листовёртки, мухи, совки, саранчовые
    и другие объекты, указанные в регламенте применения для каждой культуры.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - По данным производителя, Борей эффективен и против популяций вредителей, устойчивых к пиретроидам
    и фосфорорганическим соединениям, — за счёт системного действия имидаклоприда.
  - При нескольких обработках за сезон желательно чередовать инсектициды с разными механизмами действия.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — немедленно дать пострадавшему выпить несколько стаканов тёплой воды с активированным углём
    (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки глотки вызвать рвоту.
    Повторить процедуру несколько раз для более полного удаления препарата из организма.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или материи, избегая грубого растирания кожи, а затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно промыть глаза при разомкнутых веках большим количеством чистой проточной воды.'
- lead: При первых признаках отравления
  text: ' — удалить пострадавшего из зоны воздействия токсичного вещества, осторожно снять с него загрязнённую
    одежду и респиратор, избегая попадания препарата на кожу или органы дыхания.'
- lead: ''
  text: После оказания первой помощи немедленно обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
