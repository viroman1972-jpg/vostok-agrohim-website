procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочий раствор готовят непосредственно перед применением. Препарат перемешивают в заводской упаковке,
    отмеряют количество на одну заправку, бак опрыскивателя наполовину заполняют водой и при непрерывном
    перемешивании вливают препарат, затем доводят бак водой до полного объёма. Перемешивание продолжают
    во время обработки.
  - Рабочую жидкость используют в тот же день. Значение pH воды для приготовления рабочего раствора — 6–8.
  - На картофеле Либертадор применяют в период остановки активного роста ботвы при благоприятных для фитофтороза
    условиях (обычно от цветения и роста клубней до уборки), а также при вспышке болезни — в этом случае
    его добавляют к системному или трансламинарному препарату, например Метаксилу или Ордану. На томате
    первая обработка — профилактическая, последующие — с интервалом 7–10 дней; на винограде первая — профилактическая,
    последующие — с интервалом 10–14 дней.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → Либертадор → СК
    (ВСК) → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять смешиваемые компоненты на совместимость и фитотоксичность
    по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке, с защитой от прямых солнечных лучей, увлажнения, загрязнения
    и механического повреждения.'
  - 'Температурный режим: от −5 до +35 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата в невскрытой заводской упаковке.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - Работы без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены. Запрещено применение
    в личных подсобных хозяйствах и авиационным способом. Место заправки опрыскивателя удаляют не менее
    чем на 200 м от жилья, скотных дворов, источников водоснабжения, мест хранения фуража и посевов продовольственных
    культур.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Место разлива засыпают песком или другим негорючим сорбентом, сорбент собирают в контейнеры и вывозят
    на обезвреживание в места, согласованные с природоохранными органами и Роспотребнадзором. Участок в
    помещении промывают водой с мылом или содой, участок земли перекапывают.
  - Тару обезвреживают 3–5 % раствором кальцинированной соды с последующей многократной промывкой водой;
    вторичное использование тары не допускается. Запрещается сливать препарат на землю, в канализацию и
    любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Обязательно предварительное оповещение пчеловодов за 4–5
    суток о препарате, сроках и зонах применения.
  - 'Ограничения: скорость ветра не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км;
    ограничение лёта пчёл — не менее 20–24 часов.'
  - Применение в водоохранных зонах водных объектов, включая рыбохозяйственные водоёмы, запрещено.
mechanism:
- key: mech
  title: Как работает циазофамид
  paras:
  - Циазофамид относится к цианоимидазолам. Он нарушает работу дыхательной цепи в митохондриях возбудителя
    и подавляет развитие его зооспор.
  - Действующее вещество перемещается в молодой прирост и защищает его, а также предотвращает заражение
    клубней картофеля.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Защитное и антиспорулирующее действие Либертадор проявляет сразу после обработки; затем действующее
    вещество распределяется в новый прирост, продлевая защиту.
- key: spectrum
  title: Спектр действия
  paras:
  - Фитофтороз картофеля и томата, милдью винограда.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - По данным производителя, случаев резистентности к препарату не выявлено. Чтобы предотвратить её появление,
    Либертадор чередуют с фунгицидами других химических классов.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить 1–2 стакана воды со взвесью энтеросорбента
    (активированный уголь или другой) по инструкции к нему, а затем раздражением задней стенки глотки вызвать
    рвоту; повторить несколько раз, после чего вновь дать выпить 1–2 стакана воды со взвесью сорбента.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания кожи, а затем
    обмыть загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть глаза мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять средства индивидуальной защиты и рабочую одежду, избегая попадания препарата на кожу, немедленно
    обратиться за медицинской помощью.'
