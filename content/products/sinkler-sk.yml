procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Семена протравливают заблаговременно (до 1 года) или непосредственно перед посевом; клубни картофеля
    — перед закладкой на хранение (семенной картофель) или до и во время посадки. При обработке клубней
    и борозды при посадке норму расхода рекомендуется пересчитать на гектар — это соответствует 0,6–0,9
    л/га. Рекомендуется использовать семена и клубни, очищенные от пыли и примесей.
  - Рабочую жидкость готовят непосредственно перед применением. Препарат перемешивают в заводской упаковке,
    смешивают с водой в отдельной ёмкости в соотношении 1:1. Бак протравочной машины на треть заполняют
    водой и при непрерывном перемешивании вливают маточный раствор; ёмкость из-под него ополаскивают, сливая
    смыв в бак. Затем доводят бак водой до полного объёма и перемешивают до однородной суспензии; перемешивание
    продолжают во время обработки.
  - Для приготовления рабочего раствора используют воду температурой не ниже 10 °C. Значение pH воды —
    4–6. Рабочую жидкость используют в тот же день.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Синклер можно применять в комбинации с инсектицидными протравителями Табу и Табу Нео. Препарат совместим
    с различными пестицидами для обработки семян, кроме препаратов с сильнощелочной или сильнокислой реакцией.
  - 'Порядок добавления компонентов в бак протравочной машины: СП → ВСК → Синклер → СК (КС, ВСК) → СЭ →
    МЭ → ВРК (ВР). Каждый последующий компонент добавляется после полного растворения (диспергирования)
    предыдущего.'
  - В каждом конкретном случае необходимо проверять смешиваемые компоненты на совместимость, а обработанные
    смесью семена перед посевом — на всхожесть.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке, с защитой от прямых солнечных лучей, увлажнения, загрязнения
    и механического повреждения.'
  - 'Температурный режим: от −15 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения в невскрытой заводской
    упаковке.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - Работы с препаратом проводят обязательно со средствами индивидуальной защиты органов дыхания, зрения
    и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10, СанПиН 1.2.1330-03).
  - Протравливание семян проводят на централизованных пунктах протравливания при полной механизации процесса,
    эффективной вентиляции и обезвреживании сточных вод.
  - Место разлива засыпают песком, землёй или другим негорючим сорбентом, сорбент собирают в контейнеры
    и вывозят на обезвреживание в места, согласованные с природоохранными органами и Роспотребнадзором.
    Участок в помещении промывают водой с мылом или содой, участок земли перекапывают.
  - Тару трижды ополаскивают водой, смывы выливают в бак с рабочим раствором. Вторичное использование тары
    не допускается. Запрещается сливать препарат и промывные воды на землю, в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат — протравитель семян, оценка токсичности для пчёл не требуется.
  - Применение в водоохранной зоне водных объектов, включая рыбоохранные зоны, запрещено.
mechanism:
- key: mech
  title: Как работает флудиоксонил
  paras:
  - Флудиоксонил относится к фенилпирролам и обладает неспецифическим механизмом действия. Он нарушает
    контроль осмотического давления в клетках гриба и угнетает функции клеточных мембран, подавляя
    рост мицелия.
  - Действующее вещество проявляет контактную и трансламинарную активность; препарат обладает длительным
    защитным и слабым системным действием.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - На семенную инфекцию Синклер начинает действовать с момента обработки семян. По данным производителя,
    препарат защищает посевы и посадки в течение нескольких недель после посева.
- key: spectrum
  title: Спектр действия
  paras:
  - Головнёвые заболевания зерновых, фузариозная и гельминтоспориозная корневые гнили, плесневение семян,
    снежная плесень; на зернобобовых — фузариозное увядание, аскохитоз, антракноз; на подсолнечнике и рапсе
    — фомопсис, фомоз, белая и серая гнили, альтернариоз; на картофеле — ризоктониоз, фузариоз и гнили
    при хранении; на луке — гнили донца.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - По данным производителя, из-за неспецифического механизма действия Синклер не вызывает резистентности
    у патогенов. При планировании защиты всё же желательно чередовать препараты разных групп.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки
    глотки вызвать рвоту; повторить несколько раз (рвоту вызывают только у пострадавших в сознании), после
    чего вновь дать выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат с кожи куском ткани или ваты, не втирая, а затем обмыть загрязнённый участок
    водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть глаза мягкой струёй чистой проточной воды при разомкнутых веках.'
- lead: При первых признаках недомогания
  text: ' — немедленно отстранить пострадавшего от работы и вывести из зоны воздействия пестицида; осторожно
    снять с него одежду и средства индивидуальной защиты, избегая попадания препарата на кожу или органы
    дыхания; немедленно обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
