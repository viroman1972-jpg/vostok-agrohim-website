regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Обработку проводят в благоприятную для роста растений погоду (от +10 до +25 °C); в прохладную погоду
    видимое действие замедляется. Наиболее чувствительный горох опрыскивают по возможности в пасмурную
    погоду при температуре ниже 20 °C (поздно вечером или рано утром), учитывая сортовую чувствительность.
    Не применять при угрозе ночных заморозков и по угнетённой культуре.
  - Если вода жёсткая, гидрокарбонатная или щелочная (pH выше 7), перед заправкой Корсара в воду рекомендуется
    добавить кондиционер Сойлент согласно инструкции.
  - Рабочий раствор готовят непосредственно перед применением. Препарат перемешивают в заводской упаковке,
    бак опрыскивателя на четверть заполняют водой, вливают препарат на одну заправку, тщательно перемешивают
    и доливают воду до полного объёма при непрерывном перемешивании. Значение pH воды — 6–7.
  - Раствор готовят на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с кислой реакцией. Нежелательно
    смешивать его с жидкими удобрениями и микроэлементами (медь, железо, цинк и др.).
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → Корсар → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после
    полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −12 до +40 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Работы с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены (ГОСТ
    12.3.041-86, СанПиН 1.2.2584-10).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый песок
    собирают в контейнеры для утилизации согласно местной инструкции; участок промывают водой с мылом или
    содой (200 г соды на ведро воды) и перекапывают. Обезвреживание и утилизация тары, остатков препарата
    и промывных вод — по СанПиН 1.2.2584-10. Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Действующее вещество нестойко или среднестойко в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят ранним утром или вечером после захода
    солнца при скорости ветра до 4–5 м/с; погранично-защитная зона для пчёл — 2–3 км; ограничение лёта
    пчёл — 3–6 часов.
  - Рыбохозяйственная оценка — 4 класс опасности. Разрешено применение в санитарной зоне рыбохозяйственных
    водоёмов.
mechanism:
- key: mech
  title: Как работает бентазон
  paras:
  - Бентазон относится к производным тиадиазинов. Он проникает в сорняки преимущественно через зелёные
    части и обладает контактным действием.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Видимые признаки угнетения сорняков появляются через несколько дней — в зависимости от погоды, затем
    сорняки погибают.
  - Препарат защищает посевы от момента обработки до появления новой «волны» сорняков.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Чувствительны: горец (виды), редька дикая, лютик полевой, стрелолист (виды), торица полевая, горчица
    полевая, ярутка полевая, дурнишник (виды), сушеница топяная, монохория, канатник Теофраста, щирица
    запрокинутая, частуха (виды), лебеда (виды), пупавка (виды), капуста полевая, сусак зонтичный, пастушья
    сумка, василёк синий, сыть (виды), подсолнечник, подмаренник цепкий, ромашка (виды).'
  - 'Среднечувствительны: амброзия (виды), марь белая, коммелина (виды), вьюнок полевой, дымянка лекарственная,
    галинсога мелкоцветковая, клубнекамыш (виды).'
  - 'Слабочувствительны: бодяк полевой, пикульник (виды), яснотка (виды), мак-самосейка, вероника (виды),
    горец птичий.'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать выпить несколько стаканов воды с активированным углём
    (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки глотки вызвать рвоту,
    после чего дать выпить стакан воды с активированным углём.'
- lead: При попадании на кожу
  text: ' — снять препарат ватой или куском материи, не втирая, затем обмыть водой с мылом.'
- lead: При попадании в глаза
  text: ' — тщательно и обильно промыть при разомкнутых веках большим количеством чистой проточной воды.'
- lead: ''
  text: После оказания первой помощи необходимо обратиться к врачу.
