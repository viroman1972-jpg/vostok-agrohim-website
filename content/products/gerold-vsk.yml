procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Бак опрыскивателя заполняют водой примерно на треть, включают мешалку и добавляют препарат на одну
    заправку. Затем бак дополняют водой при одновременном перемешивании до однородного раствора; перемешивание
    продолжают и во время обработки.
  - Рабочий раствор используют в день приготовления. Значение pH воды для приготовления рабочего раствора
    — 5–7. В рабочий раствор рекомендуется добавлять адъювант, например Аллюр.
  - Против саранчовых обработку начинают в период массового отрождения и развития личинок, обязательно
    до окрыления; при большом числе окрылённых особей Герольд применяют в смеси с быстродействующим инсектицидом,
    эффективным против взрослых насекомых.
  - Рапс против капустной моли, капусту против чешуекрылых, кукурузу, подсолнечник и сою против хлопковой
    совки обрабатывают однократно в период отрождения гусениц младших возрастов. Сады против плодожорки
    и листовых минёров обрабатывают в начале яйцекладки, против листогрызущих чешуекрылых — при появлении
    гусениц младших возрастов.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → Герольд → СК
    (ВСК) → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −10 до +35 °C.'
  - 'Срок хранения: 3 года при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - При работе соблюдают требования ГОСТ 12.3.041-86 и СанПиН 1.2.1077-01; работы без средств индивидуальной
    защиты органов дыхания, зрения и кожи запрещены.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.1077-01. Не допускается
    загрязнение водоёмов препаратом или использованной тарой; запрещается сливать препарат в канализацию
    и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Применение требует соблюдения «Инструкции по профилактике
    отравления пчёл пестицидами», в том числе предварительного оповещения местных пчеловодов (за 4–5 суток)
    о препарате, сроках и зонах обработки.
  - 'Ограничения: обработка утром или вечером при скорости ветра не более 4–5 м/с; погранично-защитная
    зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее 36–48 часов.'
  - Рыбохозяйственная оценка — 2 класс опасности; по данным производителя, применение в санитарной зоне
    рыбохозяйственных водоёмов разрешено.
mechanism:
- key: mech
  title: Как работает дифлубензурон
  paras:
  - Дифлубензурон относится к регуляторам роста и развития насекомых — ингибиторам синтеза хитина. По действию
    Герольд принципиально отличается от фосфорорганических и пиретроидных препаратов.
  - Препарат обладает контактным и кишечным действием и нарушает линьку вредителей — подавляет синтез хитина
    и препятствует формированию новой кутикулы. На взрослых насекомых он не действует, но нарушает развитие
    яиц и личинок; личинки гибнут при очередной линьке. Действие на яйца проявляется, когда самки откладывают
    их на обработанные растения.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат действует постепенно. Через несколько дней после обработки личинки становятся малоподвижными
    и резко сокращают питание, а гибнут при линьке из-за нарушения образования новой кутикулы.
  - По данным производителя, Герольд долго сохраняет активность после опрыскивания.
- key: spectrum
  title: Спектр действия
  paras:
  - Листогрызущие вредители — гусеницы плодожорок, молей, совок, белянок, шелкопрядов, а также личинки саранчовых
    и другие объекты, указанные в регламенте применения для каждой культуры.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - По данным производителя, прямой и перекрёстной резистентности к дифлубензурону не отмечено; препарат
    рекомендуют против популяций вредителей, устойчивых к пиретроидам и фосфорорганическим инсектицидам.
  - При нескольких обработках за сезон желательно чередовать инсектициды с разными механизмами действия.
