procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Наилучшее действие достигается при обработке однолетних двудольных сорняков в фазе 2–6 листьев (высота
    5–10 см), многолетних корнеотпрысковых — в фазе розетки до начала стеблевания. Минимальную норму применяют
    на ранних стадиях развития сорняков и при высоте подмаренника цепкого до 20 см; максимальную — при
    высокой засорённости, преобладании подмаренника цепкого высотой более 20 см, при перерастании сорняками
    уязвимой фазы и в неблагоприятную погоду.
  - Против переросших проблемных сорняков используют максимальную норму или баковые смеси — например,
    против переросшего пикульника к Балерине Супер добавляют гербициды из класса сульфонилмочевин.
  - Оптимальная температура применения — от 8 до 25 °C. Не обрабатывать, когда прогнозируются ночные заморозки,
    и сразу после них.
  - Рабочий раствор готовят непосредственно перед применением. Препарат перемешивают в заводской таре, бак
    опрыскивателя наполовину заполняют чистой водой, включают мешалку, вливают отмеренное количество препарата
    прямо в бак (миксер не используют) и доливают воду до полного объёма при перемешивании. Значение pH
    воды — 5,5–6,5.
  - Раствор готовят и заправляют опрыскиватель на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией; его можно комбинировать с мочевиной. Препарат несовместим с сульфатом аммония.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → Балерина
    Супер → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −5 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Ограничений нет — Балерина Супер не обладает последействием, её можно использовать во всех типах севооборотов.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещается применение в личных подсобных хозяйствах и авиационным методом. Чтобы препарат не смывался
    в водоёмы, не рекомендуется работать на склоновых участках и перед осадками.
  - Работы с препаратом проводят только специалисты по защите растений, под их контролем или лица, прошедшие
    специальную подготовку, со средствами индивидуальной защиты органов дыхания, глаз и кожи (ГОСТ 12.3.041-86,
    СанПиН 1.2.2584-10). Возможность скармливания животным соломы зерновых и зелёной массы кукурузы решают
    органы государственного ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом; загрязнённый сорбент,
    остатки препарата и тару собирают в промаркированные герметичные контейнеры и передают организациям,
    имеющим лицензию на обращение с отходами I–IV классов опасности. Не готовить рабочий раствор вблизи
    источников питьевой воды.
  - Пустую тару ополаскивают водой не менее трёх раз, промывную воду сливают в бак с рабочим раствором; повторное
    использование тары не допускается. Запрещается сливать препарат и промывные воды в канализацию и любые
    водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Пчеловодов оповещают за 4–5 суток о препарате, сроках
    и зонах применения; обработку проводят ранним утром или вечером после захода солнца при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    20–24 часов.
  - Запрещено применение в водоохранных зонах водных объектов, включая рыбохозяйственные водоёмы.
mechanism:
- key: mech
  title: Как работают 2,4-Д и флорасулам
  paras:
  - 2,4-Д (2-этилгексиловый эфир) — синтетический ауксин из производных арилоксиалканкарбоновых кислот.
    Он нарушает нормальный рост тканей чувствительных растений, фотосинтез и обмен веществ; перемещаясь по
    флоэме, проникает в корни, поэтому эффективен и против многолетних двудольных сорняков.
  - Флорасулам — триазолопиримидин, ингибитор ацетолактатсинтазы. Он быстро проникает в растение через
    листья и корни и передвигается по флоэме и ксилеме к точкам роста.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост чувствительных сорняков останавливается вскоре после опрыскивания. Затем появляются видимые признаки
    — обесцвечивание и скручивание листьев, сокращение междоузлий; окончательная гибель сорняков зависит
    от их вида и погоды.
  - Гербицид защищает посевы от момента обработки до появления новой «волны» сорняков.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Чувствительны: амброзия полыннолистная, бодяк (виды), василёк синий, горчица (виды), дымянка лекарственная,
    мак (виды), осот (виды), подмаренник цепкий, падалица подсолнечника и рапса, редька дикая, сурепица,
    ярутка полевая и др.'
  - 'Среднечувствительны: ромашка (виды), конопля сорная, льнянка обыкновенная, пикульник (виды), полынь
    обыкновенная и др.'
  - 'Слабочувствительны: вероника (виды), яснотка (виды), вьюнок полевой, молочай (виды), паслён чёрный,
    фиалка полевая, хвощ (виды) и др.'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Рекомендуется чередовать препарат с гербицидами других химических классов и с другим механизмом действия.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться
    за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
