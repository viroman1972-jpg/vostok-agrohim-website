procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Перед применением препарат тщательно перемешивают в заводской упаковке. Бак опрыскивателя заполняют
    водой на треть, включают мешалку, вливают расчётное количество препарата и при работающей мешалке доводят
    бак водой до полного объёма. Во время обработки рабочую жидкость постоянно перемешивают.
  - Рабочую жидкость используют в течение 4 часов после приготовления; после обработки опрыскиватель промывают
    и высушивают. Значение pH воды для приготовления рабочего раствора — 4–5.
  - Против свекловичных блошек опрыскивание проводят в период всходов, против остальных вредителей — в
    период вегетации свёклы и зерновых при их появлении. В рабочий раствор рекомендуется добавлять адъювант
    Аллюр.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Тайру нельзя смешивать или применять последовательно с гербицидами на основе карбаматов, сульфонилмочевин,
    имидазолинонов и мезотриона из-за опасности фитотоксичности.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Тайра → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −5 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата в невскрытой заводской упаковке при соблюдении
    условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами крытого транспорта в соответствии с правилами перевозки опасных грузов.
    Транспортировка и хранение совместно с пищевыми продуктами и кормами категорически запрещены.
  - В связи с выраженным раздражающим действием на слизистые оболочки глаз работы с препаратом проводят
    только специалисты по защите растений или под их контролем, или лица, прошедшие специальную подготовку,
    обязательно со средствами индивидуальной защиты органов дыхания, глаз и кожи (СанПиН 1.2.2584-10); во
    время работы нельзя есть, пить и курить. Запрещено применение в личных подсобных хозяйствах и авиационным
    способом.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим материалом до полного впитывания, сорбент собирают
    в контейнеры. Участок в помещении промывают водой с мылом или содой (200 г соды на ведро воды), участок
    земли перекапывают.
  - Остатки препарата и тару утилизируют термически или вывозят в места, согласованные с природоохранными
    органами и Роспотребнадзором.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 1 (высокоопасный). Применение требует соблюдения «Инструкции по профилактике
    отравления пчёл пестицидами», в том числе обязательного оповещения пчеловодов за 4–5 суток о препарате,
    сроках и зонах обработки.
  - 'Ограничения: обработка утром или вечером при скорости ветра не более 1–2 м/с; погранично-защитная зона
    для пчёл — не менее 4–5 км; ограничение лёта пчёл — не менее 4–6 суток.'
  - Применение в водоохранных зонах водных объектов запрещено.
mechanism:
- key: mech
  title: Как работает хлорпирифос
  paras:
  - Хлорпирифос относится к фосфорорганическим соединениям и действует тремя путями — при прямом контакте
    во время опрыскивания, при питании обработанными растениями и при поступлении паров в трахеи насекомых.
  - Действующее вещество подавляет фермент ацетилхолинэстеразу, участвующий в передаче нервного импульса.
    У вредителей возникают судороги, которые переходят в паралич и приводят к гибели.
  - По данным производителя, препарат действует также на акариформных клещей, в том числе паутинных и
    зимнего зернового клеща.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат начинает действовать на вредителей вскоре после попадания на растение и обладает длительным
    последействием.
- key: spectrum
  title: Спектр действия
  paras:
  - Вредители зерновых культур и сахарной свёклы — клопы, злаковые мухи, тли, трипсы, пьявицы, блошки,
    хлебные жуки, луговой мотылёк, свекловичные долгоносики и другие объекты, указанные в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Для предупреждения резистентности препарат чередуют с инсектицидами другого механизма действия. Ориентироваться
    только на разные торговые названия недостаточно — разные препараты могут содержать действующие вещества
    одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки
    глотки вызвать рвоту; повторить несколько раз (рвоту вызывают только у пострадавших в сознании), после
    чего вновь дать выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания кожи, а затем
    обмыть загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — немедленно промыть глаза мягкой струёй чистой проточной воды, обратиться к офтальмологу.'
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу, немедленно обратиться
    за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: препарат подавляет активность холинэстеразы, что влияет на центральную и
    парасимпатическую нервную систему и соматические двигательные нервы. Антидоты: атропин, обидоксима
    хлорид, пралидоксим. При необходимости — консультация ФГБУ «Научно-практический токсикологический центр»
    ФМБА России: 129090, Москва, Большая Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
