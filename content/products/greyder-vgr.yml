# Источники: регламент — госреестр (agroxxi v176, greyder-vgr-3; таблица для ЛПХ не переносилась); процедуры —
# инструкция АО Фирма «Август» (avgust.com/products/rf/greyder/, 27.10.2026); срок хранения — госреестр (ПИ10;
# Август пишет 4 года, госреестр — 3). Не назван Галоп (нет в ассортименте). Не перенесены: «практически не
# токсичен» (ДЗ04), центр Склифосовского (в информации для врача — ФМБА), сроки в днях и месяцах из описания
# действия (ПИ12). Фитотоксичность не заполнена — у Августа «гербицид сплошного действия». ПИ12.
regulation:
- rate: '0,075–0,12'
  crop: 'Подсолнечник, рапс яровой и озимый (сорта и гибриды, устойчивые к имидазолинонам)'
  object: 'Однолетние злаковые и двудольные сорняки'
  method: 'Опрыскивание в ранние фазы роста сорняков (2–4 листа) и в фазе 4–5 настоящих листьев культуры.
    Соблюдать ограничения по севообороту. Расход рабочей жидкости — 50–300 л/га'
  wait: '60 (1)'
- rate: '2–5'
  crop: 'Земли несельскохозяйственного назначения (охранные зоны ЛЭП, просеки, трассы трубопроводов, насыпи
    и полосы отчуждения дорог, аэродромы, промышленные территории)'
  object: 'Все виды нежелательной травянистой и древесной растительности (осина, берёза, ольха, ива, сосна,
    ель)'
  method: 'Опрыскивание вегетирующих растений и почвы в апреле — сентябре. Расход рабочей жидкости — 100–300
    л/га'
  wait: '— (1)'
regulation_notes:
  reentry: 3 дня (на землях несельскохозяйственного назначения — 15 дней, в том числе для ручных работ)
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - На землях несельскохозяйственного назначения — однократное опрыскивание в ранние фазы роста нежелательных
    растений, в том числе амброзии полыннолистной в фазе 2–4 листьев и горчака ползучего в фазе стеблевания;
    против всей травянистой и древесной растительности — обработка вегетирующих растений и почвы в апреле
    — сентябре один раз в 3–5 лет.
  - На подсолнечнике и рапсе, устойчивых к имидазолинонам, — опрыскивание в ранние фазы роста сорняков
    (2–4 листа) при 4–5 настоящих листьях у культуры. По данным производителя, на этих культурах Грейдер
    применяют только в баковой смеси с гербицидом Парадокс и адъювантом (Адью или Аллюр); в чистом виде
    и без адъюванта применять не рекомендуется.
  - Если вода жёсткая, гидрокарбонатная или щелочная (pH выше 7), перед заправкой Грейдера в воду рекомендуется
    добавить кондиционер Сойлент согласно инструкции.
  - На эффективность и фитотоксичность влияют погода, почва, сорт культуры, фазы культуры и сорняков, норма,
    устойчивые биотипы сорняков, препараты-антагонисты в смеси и настройка техники.
  - Рабочий раствор готовят непосредственно перед применением. Препарат перемешивают в заводской упаковке,
    бак опрыскивателя на треть заполняют водой, вливают препарат на одну заправку, тщательно перемешивают
    и доливают воду до полного объёма при непрерывном перемешивании. Значение pH воды — 6–7.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - 'На подсолнечнике и рапсе, устойчивых к имидазолинонам, рекомендуется смесь: Парадокс 0,33 л/га + Грейдер
    0,06 л/га + адъювант Адью 0,1–0,2 л на каждые 100 л воды. На землях несельскохозяйственного назначения
    против мелколепестника канадского, хвоща и вьюнка полевого Грейдер применяют в смеси с Торнадо 500,
    Торнадо 540, Горгоном или Магнумом.'
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Не смешивать и не применять последовательно с фосфорорганическими инсектицидами — опасность
    фитотоксичности.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → Грейдер → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л, банки 1 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке. Нельзя хранить на свету и при температуре выше +45 °C
    — имазапир может разлагаться.'
  - 'Температурный режим: от −10 до +40 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - При норме 0,075–0,12 л/га устойчивые к имидазолинонам сорта и гибриды можно высевать без ограничений
    по срокам. Через 4 месяца можно высевать пшеницу и рожь; через 9 месяцев — кукурузу, люцерну, люпин,
    ячмень, овёс, горох; через 18 месяцев — подсолнечник, сорго, просо, лён, картофель, капусту, чечевицу;
    через 26 месяцев — сахарную свёклу, рапс.
  - 'По госреестру: в год применения можно высевать озимую пшеницу и устойчивый к имидазолинонам озимый
    рапс; через год — пшеницу, ячмень, рожь, тритикале, кукурузу, горох, бобы, сорго, люцерну, люпин, устойчивые
    рапс и подсолнечник; через два года — овёс, традиционный подсолнечник; через три года — любые культуры,
    включая традиционный рапс и сахарную свёклу.'
  - При сомнениях перед посевом чувствительных культур рекомендуется провести биотестирование почвы.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Работы с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены (ГОСТ
    12.3.041-86, СП 2.2.3670-20, СанПиН 2.1.3684-21, СанПиН 1.2.3685-21).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня; на земли
    несельскохозяйственного назначения для ручных и механизированных работ — 15 дней.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый песок
    собирают в контейнеры для утилизации на полигонах токсичных отходов; участок промывают водой с мылом
    или содой (200 г соды на ведро воды). Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Действующее вещество стойкое или очень стойкое в почве, умеренно подвижно.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят ранним утром или вечером после захода
    солнца при скорости ветра не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение
    лёта пчёл — не менее 20–24 часов. Обязательно предварительное оповещение местных пчеловодов о препарате,
    сроках и зонах применения.
  - Запрещено применение в водоохранной рыбохозяйственной зоне.
mechanism:
- key: mech
  title: Как работает имазапир
  paras:
  - Имазапир относится к имидазолинонам. Он подавляет фермент синтеза алифатических аминокислот (ацетогидроксикислотсинтазу)
    и нарушает синтез ДНК. Препарат легко проникает в растение через листья и корни, перемещается по флоэме
    и ксилеме и накапливается в молодых растущих тканях.
  - Грейдер обладает высокой почвенной активностью, поэтому на землях несельскохозяйственного назначения
    долго уничтожает новые всходы сорняков; в сельском хозяйстве защищает посевы в течение сезона.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Обработанные растения прекращают рост, точки роста обесцвечиваются и буреют, появляется хлороз — в первую
    очередь молодых листьев; затем хлороз переходит в некроз, и растения гибнут. Травянистая растительность
    погибает быстрее древесно-кустарниковой.
- key: spectrum
  title: Спектр действия
  paras:
  - На землях несельскохозяйственного назначения — все однолетние и многолетние двудольные и злаковые сорняки,
    в том числе карантинные (амброзия полыннолистная, горчак ползучий), а также лиственные и хвойные древесно-кустарниковые
    породы (осина, берёза, ольха, ива, сосна, ель и др.).
  - На подсолнечнике и рапсе, устойчивых к имидазолинонам, — большинство однолетних злаковых и двудольных
    сорняков.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - При многократном применении Грейдера и других ингибиторов ацетолактатсинтазы (например, ежегодно на
    землях несельскохозяйственного назначения) их чередуют с гербицидами с другим механизмом действия.
first_aid:
- lead: При случайном проглатывании
  text: ' — немедленно дать выпить несколько стаканов тёплой воды с активированным углём (из расчёта 1 г
    сорбента на 1 кг массы тела). Рвоту вызывать нельзя — препарат раздражает слизистые оболочки.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — снять препарат ватой или куском материи, не втирая, затем обмыть водой с мылом.'
- lead: При попадании в глаза
  text: ' — тщательно и обильно промыть при разомкнутых веках большим количеством чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться
    за медицинской помощью.'
- lead: ''
  text: После оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
