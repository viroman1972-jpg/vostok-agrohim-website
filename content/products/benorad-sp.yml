regulation_notes:
  reentry: 4 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочую жидкость готовят непосредственно перед применением через маточный раствор. Препарат на одну
    заправку помещают в ёмкость, наполовину заполненную водой, и перемешивают до однородной суспензии, доливая
    воду до полного объёма. Бак опрыскивателя или протравочной машины наполовину заполняют водой и при непрерывном
    перемешивании вливают маточный раствор; ёмкость ополаскивают, сливая смыв в бак, и доводят бак водой
    до полного объёма.
  - При поставке в водорастворимых пакетах их, не вскрывая, кладут в наполовину заполненный водой бак при
    работающей мешалке; упаковку с пакетами вскрывают непосредственно перед закладкой. Готовить раствор
    через бак-смеситель не рекомендуется; для протравливания семян водорастворимые пакеты не используют.
  - Рабочую жидкость расходуют в течение суток (для протравливания — в тот же день). Значение pH воды —
    4,5–6. Заправочные площадки удаляют не менее чем на 200 м от жилья, скотных дворов, источников водоснабжения,
    мест хранения фуража и посевов продовольственных культур.
  - Посевы опрыскивают профилактически или при первых признаках болезни; лён — в фазе «ёлочки», рис — в
    фазе выметывания метёлок. При опрыскивании по вегетации рекомендуется добавлять адъювант Аллюр. Семена
    зерновых и клубни картофеля протравливают перед посевом или посадкой.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после полного
    растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: коробки 1 кг, пакеты 3 кг, коробки 12 кг с водорастворимыми пакетами по 0,5 кг.'
  - 'Условия хранения: в невскрытой заводской упаковке, в сухом хорошо вентилируемом помещении.'
  - 'Температурный режим: от −25 до +35 °C; в водорастворимых пакетах — от 0 до +35 °C, не допускать замерзания.'
  - 'Срок хранения: 2 года.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - Работы с препаратом проводят только специалисты по защите растений или под их контролем, или лица,
    прошедшие специальную подготовку, обязательно со средствами индивидуальной защиты органов дыхания, зрения
    и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.1077-01).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 4 дня.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.1077-01. Не допускается
    загрязнение водоёмов препаратом или использованной тарой; запрещается сливать препарат в канализацию
    и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл по госреестру — 3 (малоопасный). Обработку проводят в утренние и вечерние
    часы, днём — в пасмурную прохладную погоду, когда пчёлы не вылетают из улья, при скорости ветра до 5–6
    м/с; погранично-защитная зона для пчёл — не менее 1–2 км; ограничение лёта пчёл — 6–12 часов.
  - Обязательно предварительное оповещение местных пчеловодов (за 4–5 суток) о препарате, сроках и зонах
    его применения.
  - Рыбохозяйственная оценка — 2 класс опасности; применение в водоохранной зоне водных объектов запрещено.
mechanism:
- key: mech
  title: Как работает беномил
  paras:
  - Беномил относится к бензимидазолам и обладает системным лечебным и профилактическим действием.
  - Действующее вещество подавляет образование ростовых трубочек при прорастании спор, формирование органов
    прикрепления гриба и рост мицелия, нарушая деление ядра клетки.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Действующее вещество быстро, в первые часы после обработки, проникает в растение.
- key: spectrum
  title: Спектр действия
  paras:
  - Головнёвые заболевания, корневые гнили, плесневение семян, снежная плесень, церкоспореллёз, мучнистая
    роса, церкоспороз, фомоз, фомопсис, белая и серая гнили, антракноз, аскохитоз, пирикуляриоз, ризоктониоз
    и другие заболевания, указанные в регламенте применения для каждой культуры.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить резистентность, Бенорад чередуют с фунгицидами других химических классов или применяют
    в комбинациях с ними. Ориентироваться только на разные торговые названия недостаточно — разные препараты
    могут содержать действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, выпить несколько стаканов воды со взвесью активированного угля (из расчёта
    1 г сорбента на 1 кг массы тела). Рвоту не вызывать.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух, сменить загрязнённую одежду и вызвать врача.'
- lead: При попадании на кожу
  text: ' — немедленно смыть струёй воды или снять загрязнение ватой или куском ткани, осторожно, не втирая,
    затем тщательно промыть кожу водой с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно промывать глаза большим количеством проточной воды в течение 15 минут при открытых
    веках и обратиться к врачу.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
