# Источники: регламент — госреестр (agroxxi v176, balerina-forte-se-2); процедуры — инструкция АО Фирма «Август»
# (avgust.com/products/rf/balerina_forte/, 27.10.2026); срок хранения — госреестр (ПИ10; Август пишет 2 года,
# госреестр — 3). Фасовка — по Августу (10 л; в госреестре — 5 л). Не перенесены: «не вызывает резистентности»
# (Август тут же пишет об известных устойчивых популяциях), «чистота посевов в течение всего сезона»,
# «низкие уровни рисков», сроки в часах и неделях из описания действия (ПИ12). ПИ12.
regulation:
- rate: '0,5–0,75'
  crop: 'Пшеница озимая и яровая, ячмень яровой и озимый, овёс'
  object: 'Однолетние двудольные, в том числе устойчивые к 2,4-Д и МЦПА, и некоторые многолетние двудольные
    сорняки'
  method: 'Опрыскивание в период кущение — выход в трубку (1–2 междоузлия) культуры. Озимые обрабатывают весной'
  wait: '57 (1)'
- rate: '0,5–0,75'
  crop: 'Кукуруза (в том числе на силос и масло)'
  object: 'То же'
  method: 'Опрыскивание в фазе 3–5 листьев культуры и ранние фазы роста сорняков'
  wait: '60 (1)'
regulation_notes:
  liquid_flow: 50–300 л/га (в зависимости от типа распылителей)
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Препарат легко растворяется даже в холодной воде и может применяться при низкой температуре — от 5 °C.
  - Если вода для рабочего раствора жёсткая, гидрокарбонатная или щелочная (pH выше 7), перед заправкой
    Балерины Форте в воду рекомендуется добавить кондиционер Сойлент согласно инструкции.
  - Рабочий раствор готовят непосредственно перед применением. Препарат перемешивают в заводской таре, бак
    опрыскивателя наполовину заполняют чистой водой, включают мешалку, добавляют отмеренное количество препарата
    и доливают воду до полного объёма при перемешивании. Значение pH воды — 5–6,5.
  - Раствор готовят и заправляют опрыскиватель на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией; его можно комбинировать с мочевиной. Препарат несовместим с сульфатом аммония.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → Балерина
    Форте → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −10 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Через 3 месяца после применения можно высевать зерновые, рапс, рыжик, горчицу; через 10 месяцев — кукурузу,
    сорго, капусту, сафлор, мяту; через 12 месяцев — сою, люцерну, бобы, подсолнечник, чечевицу, горох,
    сахарную свёклу, морковь, лук; через 18 месяцев — картофель; через 24 месяца — любые культуры.
  - При сомнениях перед посевом чувствительных культур рекомендуется провести биотестирование почвы.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещается применение в личных подсобных хозяйствах и авиационным методом.
  - Работы с препаратом проводят только специалисты по защите растений, под их контролем или лица, прошедшие
    специальную подготовку, со средствами индивидуальной защиты органов дыхания, глаз и кожи (ГОСТ 12.3.041-86,
    СанПиН 1.2.2584-10). Возможность скармливания животным соломы зерновых и зелёной массы кукурузы решают
    органы государственного ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    собирают в контейнеры для обезвреживания. Участок в помещении промывают водой с мылом или содой (200
    г соды на ведро воды), участок земли перекапывают.
  - Остатки препарата, сорбент и загрязнённая тара подлежат сбору, термическому обезвреживанию или вывозу
    на полигоны токсичных промышленных отходов или в места, согласованные с природоохранными органами и
    Роспотребнадзором (СанПиН 1.2.2584-10). Пустую тару ополаскивают водой не менее трёх раз, промывную
    воду сливают в бак с рабочим раствором; повторное использование тары не допускается. Запрещается сливать
    препарат и промывные воды в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат стоек в почве (1 класс опасности по стойкости).
  - Класс опасности для пчёл — 3 (малоопасный). Пчеловодов оповещают за 4–5 суток о препарате, сроках
    и зонах применения; обработку проводят ранним утром или вечером после захода солнца при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    20–24 часов.
  - Запрещено применение в водоохранных зонах водных объектов, включая рыбохозяйственные водоёмы.
mechanism:
- key: mech
  title: Как работают 2,4-Д, пиклорам и флорасулам
  paras:
  - Балерина Форте сочетает три действующих вещества из разных химических классов. 2,4-Д (2-этилгексиловый
    эфир) и пиклорам — синтетические ауксины, нарушающие рост тканей сорняков; пиклорам легко перемещается
    в новые растущие ткани. Флорасулам — триазолопиримидин, ингибитор ацетолактатсинтазы.
  - Гербицид быстро проникает через листья, распространяется по всем частям сорняков, включая корни, и
    блокирует рост клеток в молодых тканях. Благодаря пиклораму препарат проявляет почвенное действие на
    новые «волны» падалицы подсолнечника.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост сорняков подавляется вскоре после обработки, первые видимые симптомы появляются в тот же день.
    Затем листья чувствительных растений становятся хлоротичными, точка роста отмирает, и сорняки погибают.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Чувствительны: осот (виды), бодяк (виды), амброзия полыннолистная, падалица подсолнечника (в том числе
    гибридов, устойчивых к трибенурон-метилу и имидазолинонам), подмаренник цепкий, ромашка непахучая,
    горец вьюнковый, паслён чёрный.'
  - 'Среднечувствительны: вьюнок полевой, чистец болотный, фиалка полевая, полынь (виды).'
  - 'Слабочувствительны: молочай лозный, вероника (виды), яснотка (виды).'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Известны случаи формирования популяций сорняков, устойчивых к 2,4-Д, флорасуламу и пиклораму при их
    длительном применении. Поэтому препарат рекомендуется чередовать с гербицидами других химических классов
    и с другим механизмом действия.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить 1–2 стакана воды со взвесью энтеросорбента
    (активированный уголь и др.) в соответствии с рекомендациями по его применению, затем раздражением задней
    стенки глотки вызвать рвоту; повторить несколько раз, после чего снова выпить 1–2 стакана воды со взвесью
    сорбента и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть глаза мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять средства индивидуальной защиты и рабочую одежду, избегая попадания препарата на кожу, и немедленно
    обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России (круглосуточно): 129090,
    Москва, Большая Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
