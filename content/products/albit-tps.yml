  reentry: 1 день (по регистрации регулятора роста)
procedures:
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: флаконы 100 мл и 1 л.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Применение в водоохранной зоне водных объектов запрещено.
mechanism:
- key: mech
  title: Как работает Альбит
  paras:
  - Действующее вещество Альбита — поли-бета-гидроксимасляная кислота, полимер, который получают из почвенных
    бактерий. В состав препарата также входят магний сернокислый, калий фосфорнокислый, калий азотнокислый
    и карбамид. Живых микроорганизмов препарат не содержит.
  - По данным производителя, действие Альбита основано на активизации собственных защитных реакций растения
    и регуляции поступления элементов питания. В отличие от химических фунгицидов, он не подавляет возбудителей
    напрямую, а повышает устойчивость растения к болезням и неблагоприятным условиям.
- key: timing
  title: Сроки и особенности применения
  paras:
  - Как фунгицид Альбит применяют профилактически — до появления первых признаков болезни или при слабом
    её развитии, как указано в регламенте. При сильном развитии болезни препарат сочетают в баковых смесях
    с химическими фунгицидами.
  - Как правило, Альбит вносят не отдельно, а в ходе запланированных обработок — вместе с протравителями,
    фунгицидами, гербицидами и инсектицидами.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Альбит действует через защитные реакции растения, а не на возбудителя напрямую. Чередование механизмов
    действия планируют по химическим фунгицидам, которые применяют вместе с ним.
