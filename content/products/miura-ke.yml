regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня (для ручных работ — 3 дня)
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Наилучшие результаты даёт опрыскивание активно растущих сорняков, на которых достаточно листьев для
    быстрого поглощения препарата. Однолетние злаковые обрабатывают в фазе от 2–4 листьев до начала кущения,
    многолетние — при 4–6 листьях и высоте 10–15 см.
  - Не рекомендуется обрабатывать культуры в состоянии стресса — после заморозков, при повреждении насекомыми,
    недостатке питания и т. п. Эффективность может снижаться, если в течение двух часов после обработки
    пройдёт дождь.
  - Препарат перемешивают в заводской таре. Бак опрыскивателя наполовину заполняют водой, включают мешалку,
    добавляют отмеренное на одну заправку количество препарата и доливают воду при перемешивании; перемешивание
    продолжают и во время обработки. Значение pH воды — 5,5–6,5.
  - Для баковых смесей сначала готовят маточные растворы препаратов в отдельных ёмкостях, затем по очереди
    смешивают их в баке опрыскивателя.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - По данным производителя, Миуру применяют в баковых смесях с противодвудольными гербицидами — на свёкле
    с Хакером; на льне с Гербитоксом, Магнумом и Алсионом; на сое с Корсаром и Алсионом; на рапсе с Хакером
    и Галионом.
  - Смеси с фунгицидами в форме концентрата микроэмульсии на сое и подсолнечнике в некоторых случаях могут
    быть фитотоксичны. На горохе Миуру и Гербитокс применяют раздельно.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Миура → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после
    полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −20 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Работы с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены (ГОСТ
    12.3.041-86, СанПиН 1.2.1077-01).
  - Срок безопасного выхода людей на обработанные площади для механизированных и ручных работ — 3 дня.
  - При попадании препарата на почву не допускать утечки в канализацию и водоёмы; участок присыпают песком
    или другим негорючим адсорбирующим материалом, загрязнённую почву помещают в опечатанные контейнеры
    для утилизации. Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.1077-01.
    Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат малостоек в почве (3 класс).
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят при скорости ветра до 4–5 м/с; погранично-защитная
    зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — 8–9 часов. Обязательно предварительное оповещение
    местных пчеловодов о препарате, сроках и зонах применения.
  - Рыбохозяйственная оценка — 3 класс опасности. Разрешено применение в санитарной зоне рыбохозяйственных
    водоёмов.
mechanism:
- key: mech
  title: Как работает хизалофоп-П-этил
  paras:
  - Хизалофоп-П-этил относится к производным арилоксифеноксипропионовых кислот. Миура очень быстро поглощается
    листьями и другими надземными частями сорняков, переносится к точкам роста побегов и корневищ и нарушает
    синтез липидов, что приводит к гибели растения.
  - Гербицид действует только на сорняки, которые есть в посевах в момент обработки; через почву он не проникает
    и на сорняки, появившиеся после опрыскивания, не влияет.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Первые симптомы — остановка роста и пожелтение верхушек побегов — появляются через несколько дней, позже
    листья приобретают антоциановую окраску; затем сорняки полностью погибают — скорость зависит от вида
    и погоды.
  - При соблюдении технологии возделывания препарат защищает посевы от однолетних злаковых сорняков с момента
    обработки до конца вегетации.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Однолетние злаковые сорняки: лисохвост, метлица, овсюг обыкновенный, просо куриное, щетинник сизый
    и зелёный, росичка кроваво-красная, плевел, костёр, мятлик однолетний, падалица зерновых.'
  - 'Многолетние злаковые сорняки: пырей ползучий, свинорой пальчатый, гумай, канареечник, полевица белая,
    мятлик обыкновенный, ветвянка, тростник обыкновенный.'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, Миуру чередуют с гербицидами других химических классов.
first_aid:
- lead: При случайном проглатывании
  text: ' — не вызывать рвоту, прополоскать рот водой, дать выпить активированный уголь в нескольких стаканах
    воды (из расчёта 1 г сорбента на 1 кг массы тела).'
- lead: При попадании на кожу
  text: ' — промыть загрязнённые участки водой с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно промывать большим количеством проточной воды в течение 15 минут при открытых веках.'
- lead: При первых признаках отравления
  text: ' — обеспечить пострадавшему доступ свежего воздуха, при необходимости сделать искусственное дыхание,
    освободить от загрязнённой одежды.'
