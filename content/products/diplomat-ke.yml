regulation_notes:
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Бак опрыскивателя на треть заполняют водой, включают перемешивание и добавляют необходимое количество
    препарата, затем доливают воду до полного объёма при включённой мешалке. Во время внесения перемешивание
    не выключают, чтобы раствор оставался однородным.
  - Препарат вносят наземным опрыскиванием; растения должны быть покрыты рабочим раствором полностью и
    равномерно. Обработку рекомендуется проводить рано утром или вечером; не рекомендуется обрабатывать
    в жаркое время дня и по влажным листьям.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с большинством пестицидов, применяемых в те же сроки, за исключением сильнощелочных
    и сильнокислых препаратов. В каждом конкретном случае перед применением необходимо проверять компоненты
    на совместимость, а баковую смесь — на фитотоксичность.
  - По данным производителя, при резистентности вредителей (например, колорадского жука) возможна баковая
    смесь с инсектицидом Контадор.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Температурный режим: от 0 до +30 °C.'
  - 'Срок хранения: 2 года.'
mechanism:
- key: mech
  title: Как работает лямбда-цигалотрин
  paras:
  - Лямбда-цигалотрин относится к пиретроидам и обладает контактно-кишечным действием; по данным производителя,
    также фумигантным и акарицидным. Он вызывает паралич нервной системы насекомых, что приводит к их гибели.
  - Препарат действует как на взрослых насекомых, так и на личинок разных возрастов.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Продолжительность защитного действия зависит от погоды, сроков внесения и биологии вредителей. По данным
    производителя, действующее вещество устойчиво к осадкам и солнечному свету.
- key: spectrum
  title: Спектр действия
  paras:
  - Грызущие и сосущие вредители — хлебные блошки и жуки, клоп вредная черепашка, тли, пьявицы, рапсовый
    цветоед, колорадский жук — на культурах, указанных в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - При нескольких обработках за сезон желательно чередовать инсектициды с разными механизмами действия.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
