# Источники: регламент — госреестр (agroxxi v176, diplomat-ke-2; регистрант ООО «Ярило»); описание и приготовление
# раствора — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/diplomat/, 25.10.2026);
# срок хранения — госреестр (ПИ10; Гарант Оптима пишет 3 года). Первой помощи, транспортировки и охраны среды
# у регистранта и Гарант Оптимы нет — ждут этикетки. ПИ12.
