# Источники: регламент — госреестр (agroxxi v176, rimanol-vdg-3); описание и рекомендации — сайт ООО «Гарант
# Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/rimanol/, 27.10.2026); срок хранения — госреестр
# (ПИ10). По госреестру, а не по Гарант Оптиме: в регистрации только норма 0,05 кг/га с однократной обработкой
# (у Гарант Оптимы — также 40 г/га и дробное внесение 30 + 20 г/га). ПАВ в регламенте назван по действующему
# веществу (торгового названия нет в ассортименте). Не перенесены: сроки в днях из описания действия (ПИ12).
# Первой помощи, условий хранения и транспортировки у Гарант Оптимы нет — блоки пустые (этикетки не запрашиваем).
# ПИ12.
regulation:
- rate: '0,05'
  crop: 'Кукуруза'
  object: 'Многолетние и однолетние злаковые и двудольные сорняки'
  method: 'Опрыскивание посевов в фазе 2–6 листьев культуры при высоте злаковых сорняков 10–15 см и в фазе
    розетки осотов с добавлением ПАВ на основе этоксилата изодецилового спирта (200 мл/га)'
  wait: '60 (1)'
- rate: '0,05'
  crop: 'Картофель'
  object: 'Многолетние (пырей ползучий), однолетние злаковые и некоторые двудольные сорняки'
  method: 'Опрыскивание посадок после окучивания в ранние фазы развития однолетних сорняков (1–4 листа)
    и при высоте пырея 10–15 см с добавлением ПАВ на основе этоксилата изодецилового спирта (200 мл/га)'
  wait: '60 (1)'
regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Препарат вносят наземным опрыскиванием, обязательно с добавлением ПАВ. Лучший результат — при активном
    росте сорняков (многолетние злаковые — пырей ползучий, гумай — при высоте 10–15 см; однолетние злаковые
    — в фазе 1–3 листьев; однолетние двудольные — в фазе 2–4 листьев).
  - В засуху расход рабочего раствора — не менее 300 л/га. Для стимуляции роста сорняков в раствор можно
    добавить аммонийные удобрения (3–4 кг/га по действующему веществу) — сначала растворяют Риманол, затем
    удобрения, после них ПАВ. pH рабочего раствора, в том числе с компонентами смеси, — не ниже 4.
  - Не рекомендуется применять препарат на сахарной кукурузе и на семенных посевах кукурузы (размножение
    линий), а также на переросшей кукурузе (более 7 листьев). Культивация или боронование за 7 дней до
    обработки и в течение 7 дней после неё могут заметно снизить эффективность.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Баковая смесь с гербицидами на основе 2,4-Д (в половине рекомендованной нормы) повышает эффективность
    против амброзии полыннолистной, дурмана обыкновенного, вьюнка полевого, мари белой, паслёна чёрного.
  - Не применяют препарат в течение 7 дней до или после обработки кукурузы фосфорорганическими инсектицидами
    — возможно угнетение культуры.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: ёмкости 0,5 кг.'
  - 'Срок хранения: 2 года.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Препарат быстро разлагается в почве и не ограничивает посев последующих культур. При пересеве обработанных
    площадей можно сеять только кукурузу, картофель или томаты.
mechanism:
- key: mech
  title: Как работает римсульфурон
  paras:
  - Римсульфурон относится к сульфонилмочевинам и обладает системным действием. Он поглощается надземной
    частью сорняков, перемещается к точкам роста и блокирует деление клеток.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Через несколько дней после обработки появляются обесцвечивание, угнетение роста и отмирание верхушек
    побегов сорняков, затем они погибают.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние и многолетние злаковые и двудольные сорняки — пырей ползучий, гумай, виды щетинника, просо
    куриное, виды щирицы, горчица полевая, чертополох щетинистый, осоты и др.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
