regulation_notes:
  reentry: 3 дня (для ручных работ — 4 дня)
procedures:
- key: prep
  title: Применение
  paras:
  - Препарат вносят наземным опрыскиванием; растения должны быть покрыты рабочим раствором полностью и
    равномерно. Обработку рекомендуется проводить рано утром или вечером, при достижении экономического
    порога вредоносности.
  - По данным производителя, наибольшая эффективность — в период активной вегетации; когда растения в
    стрессе (похолодание, заморозки, засуха, жара), действие инсектицида заметно снижается.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Срок хранения: 2 года.'
mechanism:
- key: mech
  title: Как работает альфа-циперметрин
  paras:
  - Альфа-циперметрин относится к пиретроидам и обладает контактно-кишечным действием с высокой начальной
    активностью — поражает вредителей при прямом контакте с препаратом и при питании обработанными растениями.
  - Действующее вещество нарушает обмен ионов натрия и калия в нервных мембранах насекомых, что приводит
    к параличу нервной системы и гибели вредителей.
- key: spectrum
  title: Спектр действия
  paras:
  - Клопы, блошки, тли, цикадки, трипсы, пьявица, рапсовый цветоед, луговой мотылёк, хлопковая совка, долгоносики,
    вредители гороха и свёклы — на культурах, указанных в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - При нескольких обработках за сезон желательно чередовать инсектициды с разными механизмами действия.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
