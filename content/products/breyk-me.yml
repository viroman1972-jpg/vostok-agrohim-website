  reentry: 3 дня (для ручных работ — 7 дней)
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Бак опрыскивателя заполняют водой примерно на треть, включают мешалку и добавляют препарат на одну
    заправку. Затем бак дополняют водой при одновременном перемешивании до однородного раствора; перемешивание
    продолжают и во время обработки.
  - Рабочий раствор используют в день приготовления. Значение pH воды для приготовления рабочего раствора
    — 5–7.
  - Растения опрыскивают в период вегетации при появлении вредителей, против вредителей всходов — по всходам
    культуры, против саранчовых — в период развития личинок. В рабочий раствор рекомендуется добавлять
    адъювант, например Аллюр.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Брейк → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после
    полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −10 до +40 °C. Не допускать замерзания препарата при хранении.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - В связи с высокой острой пероральной токсичностью работы с препаратом проводят только специалисты по
    защите растений или под их контролем, или лица, прошедшие специальную подготовку, обязательно со средствами
    индивидуальной защиты органов дыхания, глаз и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.1077-01).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для ручных
    — 7 дней.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.1077-01. Не допускается
    загрязнение водоёмов препаратом или использованной тарой; запрещается сливать препарат в канализацию
    и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 1 (высокоопасный). Применение требует соблюдения «Инструкции по профилактике
    отравления пчёл пестицидами», в том числе предварительного оповещения местных пчеловодов (за 4–5 суток)
    о препарате, сроках и зонах обработки. Не допускается обработка цветущих энтомофильных культур в период
    активного лёта пчёл.
  - 'Ограничения: обработка в утренние и вечерние часы, днём — в пасмурную прохладную погоду, при скорости
    ветра не более 0–1 м/с; погранично-защитная зона для пчёл — не менее 4–5 км; ограничение лёта пчёл
    — не менее 4–5 суток.'
  - По воздействию на водные организмы лямбда-цигалотрин относится к 1 классу опасности; применение в водоохранной
    рыбохозяйственной зоне запрещено.
mechanism:
- key: mech
  title: Как работает лямбда-цигалотрин
  paras:
  - Лямбда-цигалотрин — синтетический пиретроид контактно-кишечного действия против многих грызущих и сосущих
    насекомых. В отличие от большинства пиретроидов, он обладает и акарицидными свойствами, что позволяет
    сократить число обработок против растительноядных клещей.
  - Действующее вещество быстро проникает в организм насекомого через кутикулу и действует на его нервную
    систему. Препарат некоторое время сохраняется на поверхности обработанных растений, проявляет остаточную
    активность и отпугивающее действие.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Вскоре после обработки вредители теряют ориентацию и прекращают питаться, затем гибнут от общего паралича.
  - Препаративная форма — микроэмульсия; по данным производителя, она повышает устойчивость препарата к
    внешним условиям.
- key: spectrum
  title: Спектр действия
  paras:
  - Клопы, тли, пьявицы, жуки, цикадки, злаковые мухи, пилильщики, блошки, цветоеды, долгоносики, мотыльки,
    колорадский жук, луковая муха, трипсы, капустные вредители, плодожорки, листовёртки, саранчовые и другие
    объекты, указанные в регламенте применения для каждой культуры.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Для предупреждения резистентности препарат чередуют с инсектицидами другого механизма действия. Ориентироваться
    только на разные торговые названия недостаточно — разные препараты могут содержать действующие вещества
    одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — немедленно дать пострадавшему выпить несколько стаканов воды с активированным углём (из расчёта
    1 г сорбента на 1 кг массы тела). Рвоту не вызывать: препарат раздражает слизистые оболочки.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания кожи, а затем
    обмыть загрязнённый участок водой с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно промыть глаза при разомкнутых веках большим количеством чистой проточной воды.'
- lead: При первых признаках отравления
  text: ' — удалить пострадавшего из зоны воздействия токсичного вещества, осторожно снять с него загрязнённую
    одежду и респиратор, избегая попадания препарата на кожу или органы дыхания.'
- lead: ''
  text: После оказания первой помощи немедленно обратиться к врачу.
- lead: ''
  text: 'Информация для врача: специфические антидоты отсутствуют, лечение симптоматическое. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
