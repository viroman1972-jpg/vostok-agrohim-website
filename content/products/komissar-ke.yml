procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Маточный раствор не требуется. Рабочий раствор готовят непосредственно перед применением. Бак опрыскивателя
    наполовину заполняют водой и при непрерывном перемешивании вливают препарат в количестве, нужном на одну
    заправку, затем доливают воду до полного объёма, продолжая перемешивание. Перемешивание не выключают
    и во время обработки.
  - Весь рабочий раствор используют в день приготовления. Расход рабочего раствора на зерновых — 200–300 л/га,
    он должен обеспечивать полное и равномерное покрытие растений; при густом травостое — не менее 300 л/га.
  - Наилучший результат даёт опрыскивание на ранней стадии развития болезней — в период вегетации при появлении
    первых признаков заболеваний.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - В баковой смеси Комиссар вводят в бак опрыскивателя в последнюю очередь. Препарат нельзя смешивать
    с препаратами сильнощелочной или сильнокислой реакции.
  - Перед применением баковую смесь необходимо проверить на совместимость компонентов и на фитотоксичность
    по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Температурный режим: от −15 до +35 °C.'
  - 'Срок хранения: 2 года со дня изготовления.'
mechanism:
- key: mech
  title: Как работают пропиконазол и тебуконазол
  paras:
  - Оба действующих вещества относятся к триазолам и подавляют биосинтез эргостерола в мембранах клеток
    возбудителей болезней. Клеточные стенки патогенов разрушаются, рост мицелия прекращается, и он погибает.
  - Действующие вещества быстро поглощаются листьями и стеблями и передвигаются по растению снизу вверх
    — по стеблю к колосу и от основания листа к его верхушке. По данным производителя, пропиконазол
    обладает профилактическим и лечащим действием, подавляет спорообразование патогенов и проявляет
    росторегулирующее действие.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат проникает в растение в первые часы после обработки, равномерно распределяется по тканям, препятствует
    проникновению возбудителей и останавливает уже начавшееся заражение. По данным производителя, Комиссар
    устойчив к смыванию дождём и обеспечивает длительный период защитного действия.
- key: spectrum
  title: Спектр действия
  paras:
  - Ржавчины (бурая, стеблевая, жёлтая, карликовая), мучнистая роса, септориоз, пиренофороз, фузариоз колоса,
    ринхоспориоз, сетчатая и тёмно-бурая пятнистости — на пшенице и ячмене.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - По данным производителя, при соблюдении норм и технологии применения резистентность маловероятна. Чтобы
    предотвратить её появление, фунгициды с разными механизмами действия чередуют. Ориентироваться только
    на разные торговые названия недостаточно — разные препараты могут содержать действующие вещества
    одной и той же группы.
