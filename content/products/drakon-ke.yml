# Источники: регламент — госреестр (agroxxi v176, drakon-ke); описание, приготовление раствора, ограничения
# и первая помощь — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/drakon/,
# 27.10.2026); срок хранения — госреестр (ПИ10, совпадает с Гарант Оптимой). Не перенесены: «низкий риск»
# для птиц, водных организмов и пчёл; ограничение лёта пчёл 6–12 часов из «Предостережений» (в экологическом
# регламенте — 20–24 часа); запрет скармливания 25 дней (по госреестру решает ветнадзор); фитотоксичность
# (у Гарант Оптимы вместо неё — данные о прибавке урожая); названия сорбентов; сроки в днях и неделях из
# описания действия (ПИ12); центр в информации для врача — ФГБУ. ПИ12.
regulation:
- rate: '0,3–0,4'
  crop: 'Пшеница яровая и озимая'
  object: 'Однолетние злаковые сорняки (виды щетинника, просо куриное, просо сорное, овсюг)'
  method: 'Опрыскивание по вегетирующим злаковым сорнякам с фазы 2 листьев до конца кущения (независимо
    от фазы развития культуры). Озимую пшеницу обрабатывают весной'
  wait: '60 (1)'
regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Препарат действует только на взошедшие к моменту обработки сорняки, поэтому опрыскивание проводят,
    когда появится основная масса однолетних злаковых сорняков. Лучший результат — при обработке в фазе
    2–3 листьев сорняков; от середины до конца их кущения применяют максимальную норму. Оптимально обрабатывать
    посевы до конца кущения культуры — позже густой травостой мешает равномерно покрыть сорняки раствором.
  - Не следует вносить препарат, когда культура в состоянии стресса (пониженная или повышенная температура
    воздуха, засуха, заморозки).
  - Рабочий раствор готовят непосредственно перед опрыскиванием. Препарат перемешивают в заводской упаковке,
    отмеряют количество на одну заправку, бак наполовину заполняют водой, вливают препарат, доливают воду
    до полного объёма и перемешивают гидравлическими мешалками. Ёмкость из-под препарата несколько раз
    ополаскивают, сливая смыв в бак. Раствор готовят и заправляют опрыскиватель на специальных площадках,
    которые затем обезвреживают. Опрыскивают наземными штанговыми опрыскивателями с щелевыми распылителями.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Допускается совместное применение с гербицидами на основе клопиралида, феноксикислот и сульфонилмочевин,
    а также с инсектицидами и фунгицидами. Нельзя смешивать препарат с пестицидами щелочной реакции (pH
    выше 8).
  - В каждом случае необходима предварительная проверка смешиваемых компонентов на совместимость. Препараты
    не смешивают напрямую, без предварительного разведения водой.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: на складах, специально предназначенных для пестицидов, в герметично закрытой, без
    повреждений заводской упаковке, отдельно от пищевых продуктов, кормов, лекарств и товаров бытовой химии.'
  - 'Температурный режим: от 0 до +35 °C.'
  - 'Срок хранения: 3 года.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка совместно с продуктами питания и кормами запрещена. Препарат хранят и перевозят в закрытой
    оригинальной упаковке.
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в водоохранной зоне водных
    объектов. Все работы проводят только в средствах индивидуальной защиты органов дыхания, зрения и кожи.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Разлитый препарат засыпают сорбентом, песком, опилками или землёй. Загрязнённый сорбент и почву обезвреживают
    10 % раствором кальцинированной соды или 7 % кашицей свежегашёной хлорной извести и собирают в промаркированные
    контейнеры для удаления в места, согласованные с природоохранными органами и Роспотребнадзором; загрязнённую
    землю перекапывают на штык лопаты. Засыпать место пролива сухой хлорной известью нельзя — возможно самовоспламенение.
    Не допускать попадания препарата в водоёмы и канализацию.
  - Отходы, остатки препарата и тару передают на утилизацию специализированным организациям, имеющим лицензию.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят ранним утром или вечером после захода
    солнца при скорости ветра не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение
    лёта пчёл — не менее 20–24 часов. Пчеловодов оповещают о предстоящей обработке за 4–5 суток.
  - Запрещено применение в водоохранной зоне водных объектов.
mechanism:
- key: mech
  title: Как работают феноксапроп-П-этил и клодинафоп-пропаргил
  paras:
  - Оба действующих вещества относятся к арилоксифеноксипропионатам. Они поглощаются листьями сорняков,
    передвигаются по растению и накапливаются в точках роста, где подавляют синтез жирных кислот. Без них
    не образуются клеточные мембраны, рост злакового сорняка прекращается, и он погибает.
  - Антидот мефенпир-диэтил ускоряет распад действующих веществ в растениях пшеницы до безопасных соединений
    и ослабляет действие гербицида на культуру.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Гербицид быстро проникает в листья, и конкуренция сорняков с культурой в значительной мере устраняется
    уже вскоре после обработки. Первые признаки — угнетение, побурение, у некоторых сорняков антоциановая
    окраска; полная гибель наступает позже и зависит от погоды. Быстрее всего препарат действует на молодые
    сорняки при оптимальных влажности и температуре.
  - На сорняки, взошедшие после опрыскивания, препарат не действует, но для раскустившейся культуры они
    уже не представляют существенной опасности.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние злаковые сорняки — овсюг, виды щетинника, просо куриное, просо сорное.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При первых признаках недомогания
  text: ' — немедленно отстранить пострадавшего от работы и вывести из зоны воздействия препарата, осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу и в органы дыхания,
    и немедленно обратиться за медицинской помощью.'
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    энтеросорбента (например, активированного угля) в соответствии с рекомендациями по его применению,
    затем раздражением корня языка вызвать рвоту, после чего вновь выпить 1–2 стакана воды со взвесью сорбента
    и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух, при необходимости обратиться за медицинской помощью.'
- lead: При попадании на кожу
  text: ' — промыть большим количеством проточной воды.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — немедленно промыть глаза мягкой струёй чистой проточной воды при разомкнутых веках.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, антидота нет. При необходимости — консультация
    ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая Сухаревская
    площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
