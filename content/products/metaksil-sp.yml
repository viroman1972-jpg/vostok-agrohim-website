procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочий раствор готовят непосредственно перед применением. Бак опрыскивателя на четверть заполняют
    водой и при непрерывном перемешивании вносят препарат на одну заправку, затем дополняют бак водой до
    однородного раствора; перемешивание продолжают во время обработки.
  - Рабочий раствор используют в день приготовления. Значение pH воды — 5–6,5. Заправочные площадки должны
    быть цементированы (или утрамбованы и затем перекопаны) и удалены не менее чем на 200 м от жилья, скотных
    дворов, источников водоснабжения, мест хранения фуража и посевов продовольственных культур.
  - Первую обработку проводят профилактически, последующие — с интервалом 10–14 дней, не более 3 за сезон.
    Опрыскивают молодые активно растущие растения — по ним препарат передвигается быстрее. В рабочий раствор
    рекомендуется добавлять адъювант.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с пестицидами нейтральной или кислой реакции; смешивать его с препаратами сильнощелочной
    или сильнокислой реакции не рекомендуется.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → Метаксил → СП → ВДГ (СТС) → СК
    (ВСК) → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: коробки 1 кг, пакеты 2 кг, мешки 12 кг.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −15 до +30 °C; в водорастворимых пакетах — от 0 до +30 °C.'
  - 'Срок хранения: 3 года в невскрытой заводской упаковке; в водорастворимых пакетах — 1 год.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - Работы с препаратом проводят только специалисты по защите растений или под их контролем, или лица,
    прошедшие специальную подготовку, обязательно со средствами индивидуальной защиты органов дыхания, зрения
    и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для ручных
    — 7 дней.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.2584-10. Не допускается
    загрязнение водоёмов препаратом или использованной тарой; запрещается сливать препарат в канализацию
    и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат среднестоек в почве (3 класс опасности по стойкости).
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят в утренние и вечерние часы, днём — в
    пасмурную прохладную погоду, когда пчёлы не вылетают из улья, при скорости ветра не более 4–5 м/с; погранично-защитная
    зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее 6–9 часов. Обязательно предварительное
    оповещение местных пчеловодов о препарате, сроках и зонах применения.
  - Рыбохозяйственная оценка — 2 класс опасности; не допускать попадания препарата в рыбохозяйственные
    водоёмы. Применение в водоохранной зоне водных объектов запрещено.
mechanism:
- key: mech
  title: Как работают металаксил и манкоцеб
  paras:
  - Метаксил сочетает два действующих вещества с разным механизмом действия. Металаксил относится к фениламидам
    (группа ацилаланинов) и действует системно; манкоцеб — производное дитиокарбаминовой кислоты контактного
    действия.
  - Препарат обладает профилактическим, лечебным и искореняющим действием. Металаксил проникает в растение
    через листья и стебли, передвигается снизу вверх и способен подавить раннюю инфекцию; манкоцеб остаётся
    на поверхности листа и создаёт защитный слой.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Металаксил поглощается листьями вскоре после обработки, манкоцеб остаётся на листовой поверхности.
    Препарат применяют профилактически.
- key: spectrum
  title: Спектр действия
  paras:
  - Фитофтороз и альтернариоз картофеля и томата, пероноспороз огурца и лука, милдью винограда.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Сочетание веществ с разными механизмами действия снижает риск резистентности. Тем не менее Метаксил
    целесообразно чередовать с фунгицидами других химических классов, например с Орданом.
first_aid:
- lead: При случайном проглатывании
  text: ' — выпить несколько стаканов воды со взвесью активированного угля (из расчёта 1 г на 1 кг массы
    тела), вызвать рвоту раздражением задней стенки глотки; при необходимости повторить 2–3 раза, затем
    выпить стакан воды с активированным углём и обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух, сменить загрязнённую одежду и вызвать врача.'
- lead: При попадании на кожу
  text: ' — немедленно смыть струёй воды или снять загрязнение ватой или куском ткани, осторожно, не втирая,
    затем тщательно промыть кожу водой или слабым раствором питьевой соды.'
- lead: При попадании в глаза
  text: ' — немедленно промывать глаза большим количеством проточной воды в течение 15 минут и обратиться
    к врачу.'
