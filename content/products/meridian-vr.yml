# Источники: регламент — госреестр (agroxxi v176, meridian-vr-3); описание, приготовление раствора, ограничения
# и первая помощь — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/meridian/,
# 27.10.2026); срок хранения — госреестр (ПИ10; Гарант Оптима пишет 3 года, госреестр — 2). Не перенесены:
# «наилучший гербицид»; совместимость с препаратами для зерновых и сахарной свёклы (культуры вне регистрации
# Меридиана); фитотоксичность для культур вне регистрации; осеннее внесение (по госреестру — только весной);
# марки опрыскивателей и агрегатов; сроки в часах и неделях из описания действия (ПИ12); центр в информации
# для врача — ФГБУ. ПИ12.
regulation:
- rate: '0,3–0,35'
  crop: 'Рапс яровой и озимый'
  object: 'Однолетние и многолетние двудольные сорняки, в том числе подмаренник цепкий, виды ромашки, горца,
    щирицы, мари, гречишка вьюнковая, виды бодяка и осота'
  method: 'Опрыскивание вегетирующих растений весной с фазы 3–6 настоящих листьев до появления цветочных
    бутонов у рапса'
  wait: '60 (1)'
regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Не рекомендуется вносить препарат с расходом рабочего раствора менее 200 л/га. На сорняки, взошедшие
    после обработки, препарат не действует. Нельзя допускать сноса раствора на чувствительные культуры
    — бобовые, паслёновые, зонтичные и астровые. Растительную массу с обработанных полей не используют
    для приготовления компоста.
  - Рабочий раствор готовят на стационарных пунктах или передвижными агрегатами, позволяющими тщательно
    перемешать препарат с водой и отфильтровать раствор. В бак заливают расчётное количество воды и при
    включённой мешалке добавляют препарат. Без средств механизации готовить раствор не допускается; проливать
    раствор нельзя. Приготовленный раствор используют в тот же день, после обработки опрыскиватель промывают
    и высушивают.
  - Раствор готовят на заправочных площадках с асфальтовым или бетонным покрытием и санитарно-защитной
    зоной не менее 200 м, которую после работ обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Перед приготовлением баковой смеси совместимость компонентов проверяют в каждом конкретном случае.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в исправной заводской таре с этикеткой, на складах, специально предназначенных для
    пестицидов, отдельно от пищевых продуктов и фуража, с защитой от прямых солнечных лучей, влаги, загрязнения
    и механических повреждений.'
  - 'Температурный режим: от 0 до +30 °C.'
  - 'Срок хранения: 2 года.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в водоохранной зоне водных
    объектов. Работа с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещена.
    К работе допускаются после инструктажа и обучения оказанию первой помощи; не допускаются лица моложе
    18 лет, беременные и кормящие женщины, а также лица с медицинскими противопоказаниями.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Разлитый препарат не допускают в канализацию и водоёмы — его поглощают древесными опилками, песком
    или землёй и вместе с загрязнённой почвой собирают в контейнер для утилизации; участок обрабатывают
    раствором хлорной извести и перекапывают.
  - Остатки препарата и тару утилизируют в соответствии с законодательством и санитарно-эпидемиологическими
    нормами.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат — 1 класс опасности по стойкости в почве (по пиклораму); клопиралид долго сохраняется в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    20–24 часов. Пчеловодов оповещают о предстоящей обработке за 4–5 суток.
  - Запрещено применение в водоохранной зоне водных объектов.
mechanism:
- key: mech
  title: Как работают клопиралид и пиклорам
  paras:
  - Оба действующих вещества относятся к синтетическим ауксинам и обладают системным действием. Они поглощаются
    надземной массой сорняков и быстро распространяются по всему растению — по ксилеме и флоэме, нарушая
    процессы роста и развития, после чего сорняк погибает.
  - Рапс и горчица к препарату устойчивы.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост сорняков подавляется вскоре после обработки, первые видимые симптомы появляются в течение первых
    суток. Затем листья чувствительных растений становятся хлоротичными, точка роста отмирает. По данным
    производителя, препарат быстро становится устойчивым к смыванию дождём.
  - Благодаря длительной сохранности клопиралида в почве гербицидное действие на чувствительные сорняки
    продолжается долго.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние и многолетние двудольные сорняки — виды ромашки и осота, подмаренник цепкий, виды горца,
    щирицы, мари, гречишка вьюнковая, виды бодяка.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Препарат рекомендуется чередовать с гербицидами других химических классов. Ориентироваться только на
    разные торговые названия недостаточно — разные препараты могут содержать действующие вещества одной
    и той же группы.
first_aid:
- lead: При признаках недомогания
  text: ' (тошнота, слабость, головокружение, головная боль) — вывести пострадавшего из опасной зоны на
    свежий воздух, осторожно снять одежду и респиратор, избегая попадания препарата на кожу и в органы дыхания.'
- lead: При попадании на кожу
  text: ' — немедленно снять загрязнённую одежду, удалить препарат бумажной салфеткой, куском ткани или
    ватой, избегая грубого растирания, затем тщательно промыть кожу водой с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно обильно промыть большим количеством чистой проточной воды.'
- lead: При случайном проглатывании
  text: ' — немедленно дать выпить тёплой воды с активированным углём (из расчёта 1 г сорбента на 1 кг
    массы тела), затем раздражением задней стенки глотки вызвать рвоту, после чего дать выпить стакан воды
    с активированным углём.'
- lead: ''
  text: В местах работы с препаратом должна быть аптечка первой помощи. Во всех случаях отравления после
    оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфического антидота нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
