# Источники: регламент — госреестр (agroxxi v176, galion-vr-4); процедуры — инструкция АО Фирма «Август»
# (avgust.com/products/rf/galion/, 27.10.2026); срок хранения — госреестр (ПИ10; Август пишет 4 года, госреестр
# — 3). Не назван Полифем (нет в ассортименте). Не перенесены: «практически не токсичны» (ДЗ04), «синтетические
# формы ростовых гормонов» (заменено на «синтетические ауксины»), сроки в часах и неделях из описания действия
# (ПИ12). ПИ12.
