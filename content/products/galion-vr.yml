procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Наилучшее действие достигается при опрыскивании молодых, активно вегетирующих сорняков. Однолетние наиболее
    уязвимы в фазе 2–6 листьев, многолетние корнеотпрысковые — в фазе розетки. Против подмаренника цепкого
    наиболее эффективна обработка при его высоте до 8 см; при высоте 9–15 см гербицид тормозит его рост,
    и подмаренник в нижнем ярусе рапса не обсеменяется.
  - Галион применяют после того, как среднесуточная температура воздуха превысит 8 °C. Не рекомендуется
    обрабатывать при угрозе заморозков и сразу после них.
  - Если вода жёсткая, гидрокарбонатная или щелочная (pH выше 7), перед заправкой Галиона в воду рекомендуется
    добавить кондиционер Сойлент согласно инструкции.
  - Рабочий раствор готовят непосредственно перед опрыскиванием. Бак опрыскивателя наполовину заполняют
    водой, добавляют отмеренное на одну заправку количество препарата и доливают воду до полного объёма
    при постоянном перемешивании гидравлическими мешалками. Значение pH воды — 6–7.
  - Раствор готовят и заправляют опрыскиватель на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Нежелательно смешивать его с микроэлементами (медь, железо, цинк и др.).
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → Галион → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −15 до +30 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Через 3 месяца после применения можно высевать зерновые, рапс, рыжик, горчицу; через 10 месяцев — кукурузу,
    сорго, капусту, сафлор, мяту; через 12 месяцев — сою, люцерну, бобы, подсолнечник, чечевицу, горох,
    сахарную свёклу, морковь, лук; через 18 месяцев — картофель; через 24 месяца — любые культуры.
  - При сомнениях перед посевом чувствительных культур рекомендуется провести биотестирование почвы.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в водоохранной зоне водоёмов.
    Работы с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены (ГОСТ
    12.3.041-86, СанПиН 1.2.2584-10).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    помещают в контейнеры для обезвреживания или вывоза на полигоны токсичных промышленных отходов или в
    места, согласованные с природоохранными органами. Загрязнённый участок промывают водой с мылом или
    содой (200 г соды на ведро воды) или перекапывают.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.2584-10 и СанПиН
    1.2.1330-03. Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Гербицид стоек в почве (1 класс опасности по стойкости — по пиклораму). Клопиралид токсичен для водорослей.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят при скорости ветра до 4–5 м/с; погранично-защитная
    зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — 20–24 часа. Обязательно предварительное оповещение
    местных пчеловодов о препарате, сроках и зонах применения.
  - Запрещено применение в водоохранной зоне водоёмов.
mechanism:
- key: mech
  title: Как работают клопиралид и пиклорам
  paras:
  - Оба действующих вещества — синтетические ауксины из производных пиридинкарбоновой кислоты. Они проникают
    через листья и передвигаются по всему растению, включая корневую систему, к точкам роста, замещают
    и блокируют функции природных гормонов роста — чувствительные сорняки погибают из-за нарушения процессов
    роста.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост чувствительных сорняков останавливается вскоре после опрыскивания; первые видимые симптомы — остановка
    роста, скручивание, деформации стеблей и листьев — появляются в первые сутки. Затем листья становятся
    хлоротичными, точка роста отмирает, и сорняки полностью погибают.
  - Галион контролирует чувствительные сорняки до появления их новой «волны».
- key: spectrum
  title: Спектр действия
  paras:
  - 'Чувствительны: амброзия полыннолистная, бодяк (виды), василёк синий, горец (виды), дурнишник (виды),
    дымянка аптечная, молокан татарский, осот (виды), паслён чёрный, подмаренник цепкий, ромашка (виды)
    и др.'
  - 'Среднечувствительны: звездчатка средняя, мак-самосейка, марь белая (в ранних фазах), пикульник обыкновенный,
    фиалка полевая, яснотка (виды).'
  - 'Слабочувствительны: вьюнок полевой, молочай (виды), канатник Теофраста, чистец (виды).'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, Галион чередуют с гербицидами других химических
    классов.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При острых признаках отравления
  text: ' — прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду
    и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться за медицинской
    помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
