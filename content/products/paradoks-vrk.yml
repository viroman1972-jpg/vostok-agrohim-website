# Источники: регламент — госреестр (agroxxi v176, paradoks-vrk-3; ограничения по севообороту в ячейках госреестра
# обрезаны — даны по Августу); процедуры — инструкция АО Фирма «Август» (avgust.com/products/rf/paradoks/,
# 27.10.2026); срок хранения — госреестр (ПИ10; Август пишет 4 года, госреестр — 3). Не назван Галоп (нет в
# ассортименте); в смеси с Грейдером адъювант — Адью, как в инструкции Грейдера. Фитотоксичность не заполнена
# — Август пишет о «толерантности» и возможном кратковременном подавлении роста. Не перенесены: «низкие уровни
# рисков», сроки в часах, днях и неделях из описания действия (ПИ12). ПИ12.
