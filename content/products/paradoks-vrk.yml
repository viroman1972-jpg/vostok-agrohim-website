regulation_notes:
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Препарат содержит встроенный адъювант, повышающий дождестойкость. Если вода жёсткая, гидрокарбонатная
    или щелочная (pH выше 7), перед заправкой Парадокса в воду рекомендуется добавить кондиционер Сойлент
    согласно инструкции.
  - Рабочий раствор готовят непосредственно перед применением. Бак наполовину заполняют водой, включают
    мешалку, добавляют отмеренное количество гербицида и доливают воду при перемешивании; канистры из-под
    препарата несколько раз ополаскивают, сливая смыв в бак. Адъювант добавляют в последнюю очередь — иначе
    из-за обильной пены часть раствора может вылиться.
  - Значение pH воды — 6–7.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - 'На рапсе и подсолнечнике, устойчивых к имидазолинонам, эффективна смесь: Парадокс 0,33 л/га + Грейдер
    0,06 л/га + адъювант 0,1–0,2 л на каждые 100 л воды.'
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Не смешивать и не применять последовательно с фосфорорганическими инсектицидами — опасность
    фитотоксичности; нежелательно смешивать с микроэлементами (медь, железо, цинк и др.).
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → Парадокс → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Сорта и гибриды, устойчивые к имидазолинонам, а также сою можно высевать без ограничений по срокам.
    Через 4 месяца после обработки можно высевать пшеницу, рожь; через 9 месяцев — кукурузу, люцерну, люпин,
    ячмень, овёс, горох, тритикале; через 18 месяцев — подсолнечник, сорго, просо, лён, картофель, капусту,
    чечевицу, сахарную свёклу, рапс.
  - При сомнениях перед посевом чувствительных культур рекомендуется провести биотестирование почвы.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в санитарной зоне рыбохозяйственных
    водоёмов. Работы проводят со средствами индивидуальной защиты кожи, глаз и органов дыхания (ГОСТ 12.3.041-86,
    СанПиН 1.2.2584-10). Возможность скармливания животным зелёной массы сои, гороха и подсолнечника решают
    органы государственного ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    собирают в контейнеры для обезвреживания; участок в помещении промывают водой с мылом или содой (200
    г соды на ведро воды), участок земли перекапывают. Обезвреживание и утилизация тары, остатков препарата
    и промывных вод — по СанПиН 1.2.2584-10 и СанПиН 1.2.1330-03.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    3–4 часов.
  - Запрещено применение в санитарной зоне рыбохозяйственных водоёмов.
mechanism:
- key: mech
  title: Как работает имазамокс
  paras:
  - Имазамокс относится к имидазолинонам. Он поглощается надземной частью и корнями сорняков и подавляет
    синтез нескольких незаменимых аминокислот — рост чувствительных растений останавливается.
  - Соя, горох и люцерна быстро разрушают действующее вещество, поэтому хорошо переносят препарат; возможно
    кратковременное незначительное подавление роста культуры, не сказывающееся на урожае.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат начинает действовать вскоре после обработки. Видимые признаки — обесцвечивание и побурение
    точек роста — появляются через несколько дней, затем наступают хлороз и полная гибель сорняков.
  - При достаточной влажности почвы остаточная почвенная активность сдерживает следующие «волны» сорняков;
    на почвах с высоким содержанием гумуса и в жару препарат разлагается быстрее.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Чувствительны: амброзия полыннолистная, марь белая, горчица полевая, овсюг полевой, дурнишник (виды),
    дымянка лекарственная, просо куриное, канатник Теофраста, щетинник (виды), щирица (виды) и др.'
  - 'Умеренно чувствительны: акалифа южная, полынь (виды), осот жёлтый, осот розовый, пырей ползучий и др.'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Имазамокс — ингибитор ацетолактатсинтазы, и постоянное применение препаратов на его основе может привести
    к появлению устойчивых сорняков. Парадокс необходимо чередовать с гербицидами других химических классов.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду
    и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться за медицинской
    помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
