procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочую жидкость готовят непосредственно перед применением на стационарных заправочных станциях или
    с помощью передвижных агрегатов с механическими мешалками; в резервуар заливают расчётное количество
    воды и при включённой мешалке добавляют препарат. Без средств механизации готовить рабочий раствор
    не допускается; пролив рабочей жидкости при приготовлении и заправке недопустим.
  - Заправочные площадки должны быть асфальтированы или забетонированы и удалены не менее чем на 200 м от
    источников водоснабжения, жилья, скотных дворов, мест хранения фуража и посевов продовольственных культур;
    после работ их обезвреживают.
  - Рабочий раствор используют в день приготовления, опрыскиватель после обработки промывают и высушивают.
    Значение pH воды для приготовления рабочего раствора — 4–5. При жёсткой, гидрокарбонатной или щелочной
    воде перед заправкой Сирокко в воду рекомендуется добавлять кондиционер Сойлент.
  - Опрыскивание проводят в период вегетации при достижении экономического порога вредоносности; яблоню
    обрабатывают до или после цветения. В рабочий раствор рекомендуется добавлять адъювант Аллюр.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Сирокко нельзя смешивать или применять последовательно с гербицидами на основе карбаматов,
    сульфонилмочевин, имидазолинонов и мезотриона из-за опасности фитотоксичности.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Сирокко → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −15 до +35 °C.'
  - 'Срок хранения: 3 года в невскрытой заводской упаковке при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов (СанПиН
    1.2.1330-03, СанПиН 1.2.2584-10). Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - При применении соблюдают требования СанПиН 1.2.2584-10 и ГОСТ 12.3.041-86; работы без средств индивидуальной
    защиты кожи, глаз и органов дыхания запрещены. Запрещено применение в личных подсобных хозяйствах, авиационным
    способом и в водоохранной зоне рыбохозяйственных водоёмов.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 4 дня, для ручных
    — 10 дней.
  - Пролитый препарат засыпают песком или другим негорючим сорбентом; сорбент и почву обезвреживают кашицей
    свежегашёной хлорной извести (сухую или негашёную известь не применяют — опасность воспламенения), собирают
    в промаркированные контейнеры и вывозят в места, согласованные с природоохранными органами и Роспотребнадзором.
    Участок перекапывают на глубину штыка лопаты, зону утечки промывают водой с мылом или содой.
  - Остатки препарата, загрязнённые сорбенты и тару вывозят на термическое уничтожение в места, согласованные
    с природоохранными органами и Роспотребнадзором.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат токсичен для птиц, среднетоксичен для млекопитающих и дождевых червей.
  - Класс опасности для пчёл — 1 (высокоопасный). Применение требует соблюдения «Инструкции по профилактике
    отравления пчёл пестицидами», в том числе предварительного оповещения местных пчеловодов о препарате,
    сроках и зонах обработки. Обработка цветущих энтомофильных культур в период активного лёта пчёл недопустима.
  - 'Ограничения: обработка в утренние и вечерние часы при скорости ветра не более 1–2 м/с, днём — в пасмурную
    прохладную погоду, когда пчёлы не вылетают из улья; погранично-защитная зона для пчёл — не менее 4–5
    км; ограничение лёта пчёл — не менее 4–6 суток или удаление пчелиных семей из зоны обработки на срок
    более 6 суток.'
mechanism:
- key: mech
  title: Как работает диметоат
  paras:
  - Диметоат относится к фосфорорганическим соединениям. Он быстро поглощается листьями, стеблями и корнями
    и передвигается по растению снизу вверх.
  - Препарат обладает системным и контактным действием. В организме вредителей диметоат подавляет фермент
    холинэстеразу, нарушая работу нервной системы.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Скорость действия — на уровне большинства фосфорорганических инсектицидов; гибель вредителей и их личинок
    наступает в первые дни после обработки.
- key: spectrum
  title: Спектр действия
  paras:
  - Сосущие и грызущие вредители — клопы, тли, трипсы, цикадки, медяница, щитовки, пьявицы, злаковые мухи,
    долгоносики, минирующие вредители, плодожорки, листовёртки, а также растительноядные клещи и другие
    объекты, указанные в регламенте применения для каждой культуры.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Для предупреждения резистентности препарат чередуют с инсектицидами другого механизма действия. Ориентироваться
    только на разные торговые названия недостаточно — разные препараты могут содержать действующие вещества
    одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой и немедленно дать выпить несколько стаканов тёплой воды с активированным
    углём (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки глотки вызвать
    рвоту (если пострадавший в сознании). Повторить несколько раз, затем вновь дать выпить стакан воды с
    активированным углём.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или материи, избегая грубого растирания кожи, а затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно промыть глаза при разомкнутых веках большим количеством чистой проточной воды.'
- lead: При первых признаках отравления
  text: ' (тошнота, рвота, головная боль, головокружение, слюно- и слезотечение, затруднение дыхания) — прекратить
    работу, удалить пострадавшего из зоны воздействия препарата, осторожно снять с него загрязнённую одежду
    и средства индивидуальной защиты, избегая попадания препарата на кожу, немедленно обратиться за медицинской
    помощью.'
- lead: ''
  text: После оказания первой помощи немедленно обратиться к врачу.
- lead: ''
  text: 'Информация для врача: в качестве антидотной терапии применяется внутривенно атропин; категорически
    запрещается применять препараты морфия и транквилизаторы. При необходимости — консультация ФГБУ «Научно-практический
    токсикологический центр» ФМБА России: 129090, Москва, Большая Сухаревская площадь, д. 3, к. 7, тел.
    (495) 628-16-87.'
  tel: '+74956281687'
