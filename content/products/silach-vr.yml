procedures:
- key: prep
  title: Применение
  paras:
  - Лучший результат — при внесении в период активного роста сорняков, когда питательные вещества активно
    оттекают в корневую систему (однолетние злаковые — с фазы 2–3 листьев до выхода в трубку; многолетние
    злаковые — пырей, гумай — при высоте 10–20 см; однолетние двудольные — с фазы 2–4 листьев до цветения;
    осоты и бодяк — в фазе розетки диаметром 10–15 см — начала стеблевания; вьюнок полевой — при длине
    побегов 10–15 см до бутонизации).
  - Сорняки должны быть покрыты раствором полностью и равномерно, но раствор не должен стекать с растений.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Для усиления действия на многолетние двудольные сорняки (осоты, бодяк, вьюнок полевой) и снижения нормы
    расхода применяют баковые смеси с гербицидами на основе 2,4-Д и дикамбы. Компоненты смеси предварительно
    проверяют на совместимость.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 20 л.'
mechanism:
- key: mech
  title: Как работает глифосат
  paras:
  - Глифосат (калиевая соль) — системный гербицид сплошного действия из группы производных глицина. Он
    быстро поглощается надземной частью сорняков и проникает во все органы, включая корни; блокирует синтез
    ароматических аминокислот, нарушает фотосинтез и дыхание. Погибают и надземные органы, и корневая система.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Первые признаки — антоциановая окраска, обесцвечивание и пожелтение — у однолетних сорняков появляются
    раньше, чем у многолетних. Затем сорняки полностью погибают; древесно-кустарниковая растительность
    отмирает дольше.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние и многолетние злаковые и двудольные сорняки, нежелательная травянистая растительность, включая
    вейник и тростник при повышенных нормах, а также лиственные древесно-кустарниковые породы.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
