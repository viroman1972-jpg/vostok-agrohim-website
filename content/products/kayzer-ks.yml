# Источники: регламент — госреестр (agroxxi v176, kayzer-ks-2; регистрант ООО «ТОТУС»); описание и применение — сайт
# ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/kayzer/, 26.10.2026); срок хранения —
# госреестр (ПИ10). В госреестре строки регламента повторяются — объединены; опечатки «жужулица», «внутрестеблевые»
# исправлены. Не перенесено: сахарная свёкла и горчица (нет в регламенте), «исключает развитие перекрёстной
# устойчивости», блок преимуществ. Первой помощи, транспортировки и охраны среды у регистранта и Гарант Оптимы
# нет — ждут этикетки. ПИ12.
