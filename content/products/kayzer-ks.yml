procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Перед применением препарат тщательно перемешивают в канистре. Необходимое количество препарата растворяют
    в 8–10 л воды и перемешивают до однородного состояния; полученным раствором обрабатывают 1 т семян. При
    остановке протравочной машины рабочий раствор не оставляют надолго без перемешивания.
  - Обрабатывают только кондиционные семена, откалиброванные и очищенные от примесей (пыль, битое зерно,
    растительные остатки, семена сорняков). Семена с повышенной влажностью и проросшие не протравливают.
  - Обработку проводят заблаговременно или непосредственно перед посевом. При заблаговременном протравливании
    влажность семян должна быть на 1–2 % ниже стандартной для кондиционных семян, чтобы избежать самосогревания
    при хранении и снижения всхожести.
  - Эффективность зависит от равномерности покрытия семян, поэтому в процессе протравливания контролируют
    количество семян, проходящих через машину, и количество рабочего раствора, подаваемого в протравочную
    камеру.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с большинством фунгицидных протравителей, микроудобрений и стимуляторов роста, не
    имеющих сильнощелочной или сильнокислой реакции.
  - В каждом конкретном случае необходимо проверять смешиваемые компоненты на совместимость.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Температурный режим: от +5 до +35 °C.'
  - 'Срок хранения: 3 года.'
mechanism:
- key: mech
  title: Как работает тиаметоксам
  paras:
  - Тиаметоксам относится к неоникотиноидам и действует на никотиновые ацетилхолиновые рецепторы нервной
    системы насекомых. Обладает системным, контактным и кишечным действием.
  - После прорастания семени препарат поглощается корнями и с восходящим током передвигается к вновь образующимся
    частям растения. Поэтому он действует и на скрытно живущих вредителей, и на тех, что питаются на нижней
    стороне листа.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Действие проявляется при контакте вредителя с семенами, а также когда он питается проростками или подземными
    частями растений. Насекомые быстро прекращают питаться и гибнут; скорость зависит от нормы расхода, вида
    вредителя и фазы развития растений.
- key: spectrum
  title: Спектр действия
  paras:
  - Почвообитающие и наземные вредители всходов — проволочники и ложнопроволочники, хлебная жужелица, внутристеблевые
    мухи, блошки, в том числе крестоцветные, цикадки, тли — на культурах, указанных в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы снизить риск резистентности, инсектициды с разными механизмами действия желательно чередовать.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать действующие
    вещества одной и той же группы.
