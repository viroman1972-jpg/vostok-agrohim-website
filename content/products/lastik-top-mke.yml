# Источники: регламент — госреестр (agroxxi v176, lastik-top-mke-3; строки наземной и авиаобработки объединены);
# процедуры — инструкция АО Фирма «Август» (avgust.com/products/rf/lastik_top/, 27.10.2026); срок хранения —
# госреестр (ПИ10; Август пишет 4 года, госреестр — 2). Запрет авиаприменения (Август) не перенесён — в госреестре
# авиаобработка есть. Не назван Галоп (нет в ассортименте). Не перенесены: «низкий уровень рисков», сроки в
# сутках и неделях из описания действия (ПИ12). ПИ12.
regulation:
- rate: '0,4–0,5'
  crop: 'Пшеница яровая и озимая'
  object: 'Однолетние злаковые сорняки (щетинник, просо куриное, просо сорно-полевое, овсюг, метлица полевая)'
  method: 'Опрыскивание в ранние фазы развития сорняков (от 2–3 листьев до конца кущения) независимо от
    фазы культуры; наземное или авиационное. Озимую пшеницу обрабатывают весной'
  wait: '60 (1)'
regulation_notes:
  liquid_flow: наземное опрыскивание — 50–200 л/га, авиационное — 25–50 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рекомендована однократная обработка в ранние фазы развития сорняков (2–3 листа) независимо от фазы
    культуры, с учётом чувствительности сортов; Ластик Топ можно применять с фазы 2 листьев до конца кущения
    сорняков. На озимой пшенице препарат применяют весной.
  - Важно выбрать срок — массовое появление однолетних злаковых сорняков — и чтобы растения культуры не
    закрывали («экранировали») сорняки.
  - Рабочий раствор готовят непосредственно перед опрыскиванием. Препарат тщательно перемешивают в заводской
    упаковке, бак опрыскивателя наполовину заполняют водой, вливают отмеренное на одну заправку количество
    гербицида и доливают воду до полного объёма при постоянном перемешивании гидравлическими мешалками.
    Освободившуюся тару трижды ополаскивают водой и выливают её в бак.
  - Значение pH воды — 4,5–6.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов со щелочной реакцией (pH выше
    8). Его можно комбинировать в баковой смеси с фунгицидом Колосаль Про.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Ластик Топ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −20 до +35 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Ограничений нет.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах и в санитарной зоне рыбохозяйственных водоёмов.
    Работы проводят со средствами индивидуальной защиты кожи, глаз и органов дыхания (ГОСТ 12.3.041-86,
    СанПиН 1.2.2584-10). Возможность скармливания скоту соломы зерновых решают органы государственного
    ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    собирают в контейнеры для обезвреживания. Участок в помещении промывают водой с мылом или содой (200
    г соды на ведро воды), участок земли перекапывают. Обезвреживание препарата и промывных вод — по СанПиН
    1.2.2584-10. Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Феноксапроп-П-этил и клодинафоп-пропаргил нестойки, клоквинтосет-мексил малостоек в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    3–4 часов. Обязательно предварительное оповещение местных пчеловодов о препарате, сроках и зонах применения.
  - Запрещено применение в санитарной зоне рыбохозяйственных водоёмов.
mechanism:
- key: mech
  title: Как работают феноксапроп-П-этил и клодинафоп-пропаргил
  paras:
  - Оба действующих вещества относятся к производным арилоксифеноксипропионовых кислот. Гербицид проникает
    в сорняки через листья и накапливается в точках роста; действующие вещества превращаются в свободные
    кислоты, которые тормозят биосинтез жирных кислот в меристемах, — образование клеточных мембран в точках
    роста прекращается.
  - Антидот клоквинтосет-мексил ускоряет обезвреживание действующих веществ в растениях пшеницы, превращая
    их в нейтральные для культуры вещества.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Вскоре после обработки сорняки перестают конкурировать с культурой; симптомы проявляются в первые дни,
    затем сорняки погибают — скорость зависит от вида, фазы и погоды. Быстрее всего гербицид действует
    при обработке в ранние фазы сорняков и в условиях, благоприятных для их роста.
  - На сорняки второй «волны», появившиеся после опрыскивания, препарат не действует, но для раскустившихся
    зерновых они уже не представляют существенной опасности.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние злаковые сорняки — овсюг (виды), плевел (виды), просо (виды), метлица (виды), лисохвост
    мышехвостниковидный, мятлик (виды), щетинник (виды), росичка кроваво-красная и др.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, препарат желательно чередовать с гербицидами других
    химических классов.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани или ваты, не втирая, затем обмыть загрязнённый участок водой с
    мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды при разомкнутых веках.'
- lead: При первых признаках недомогания
  text: ' — немедленно отстранить пострадавшего от работы и вывести из зоны воздействия пестицида; осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу и в органы дыхания;
    немедленно обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: антидота нет, лечение симптоматическое. При необходимости — консультация
    ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая Сухаревская
    площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
