# Источники: регламент — госреестр (agroxxi v176, hator-vr-2); описание, приготовление раствора, ограничения
# и первая помощь — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/khator/,
# 27.10.2026); срок хранения — госреестр (ПИ10, совпадает с Гарант Оптимой). Упаковка — по Гарант Оптиме (5 л;
# решение Оли 28.10.2026, ПИ13). Не перенесены: класс опасности «3» (в карточке — по госреестру, 2); «риск устойчивых
# популяций минимальный»; марки опрыскивателей и агрегатов; сроки в часах и днях из описания действия (ПИ12);
# центр в информации для врача — ФГБУ. ПИ12.
regulation:
- rate: '0,3–0,5'
  crop: 'Рапс яровой и озимый'
  object: 'Виды осота, ромашки, горца'
  method: 'Опрыскивание в фазе 3–4 настоящих листьев рапса ярового и до появления цветочных бутонов рапса'
  wait: '60 (1)'
- rate: '0,1–0,3'
  crop: 'Лён масличный'
  object: 'Виды осота, бодяка, ромашки, горца'
  method: 'Опрыскивание посевов в фазе «ёлочки» культуры и в фазе розетки у сорняков'
  wait: '60 (1)'
regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Препарат вносят наземным опрыскиванием вегетирующих растений согласно регламенту применения. Лучший
    результат — на начальных этапах роста сорняков, в фазе 2–6 листьев. При повышенной температуре (выше
    +20 °C) расход рабочего раствора увеличивают до 400 л/га.
  - Рабочий раствор готовят на стационарных пунктах или передвижными агрегатами, позволяющими тщательно
    перемешать препарат с водой и отфильтровать раствор. В бак заливают расчётное количество воды и при
    включённой мешалке добавляют препарат. Без средств механизации готовить раствор не допускается; проливать
    раствор нельзя. Приготовленный раствор используют в тот же день, после обработки опрыскиватель промывают
    и высушивают.
  - Раствор готовят на заправочных площадках с асфальтовым или бетонным покрытием и санитарно-защитной
    зоной не менее 200 м, которую после работ обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с противозлаковыми гербицидами на основе галоксифоп-П-метила и других арилоксифеноксипропионатов,
    с инсектицидами на основе гамма-цигалотрина, хлорпирифоса, циперметрина, со многими фунгицидами, регуляторами
    роста и жидкими удобрениями. На яровом рапсе в баковой смеси можно использовать противозлаковый гербицид Сокол.
  - В каждом случае рекомендуется предварительная проверка смешиваемых компонентов на совместимость. Препараты
    не смешивают напрямую, без предварительного разведения водой.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в исправной заводской таре с этикеткой, в помещениях, специально предназначенных
    для пестицидов, отдельно от пищевых продуктов и фуража, с защитой от прямых солнечных лучей, влаги,
    загрязнения и механических повреждений.'
  - 'Температурный режим: от 0 до +30 °C.'
  - 'Срок хранения: 3 года со дня изготовления.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - При пересеве полей, на которых вносили препарат, подсолнечник, зернобобовые культуры, картофель, люцерну
    и клевер можно сеять через 4 месяца после обработки.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в водоохранной зоне водных
    объектов. Работа с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещена.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    20–24 часов. Пчеловодов оповещают о предстоящей обработке за 4–5 суток.
  - Запрещено применение в водоохранной зоне водных объектов.
mechanism:
- key: mech
  title: Как работает клопиралид
  paras:
  - Клопиралид относится к синтетическим ауксинам. Он легко проникает в сорняки через листья и корни, быстро
    распространяется по растению, концентрируется в точках роста и блокирует обмен веществ в молодых клетках.
    Погибает и надземная часть, и корневая система, включая почки возобновления и корневые отпрыски осотов.
  - Препарат особенно активен против сорняков из семейств сложноцветных, зонтичных, бобовых и гречишных.
    Культуры семейства капустных и масличный лён к нему устойчивы.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - У чувствительных растений появляется типичная для синтетических ауксинов реакция — искривление побегов
    и черешков, затем хлороз верхушек побегов; после этого сорняки погибают. Скорость действия зависит
    от погоды и видового состава сорняков.
  - Защитное действие сохраняется до появления новой волны всходов однолетних двудольных сорняков.
- key: spectrum
  title: Спектр действия
  paras:
  - Виды осота, бодяка, ромашки, горца и другие двудольные сорняки из семейств сложноцветных, зонтичных,
    бобовых и гречишных.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять средства индивидуальной защиты и рабочую одежду, избегая попадания препарата на кожу, и немедленно
    обратиться за медицинской помощью.'
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить 1–2 стакана воды со взвесью энтеросорбента
    (например, активированного угля) в соответствии с рекомендациями по его применению, затем раздражением
    задней стенки глотки вызвать рвоту; повторить несколько раз, после чего вновь выпить 1–2 стакана воды
    со взвесью сорбента и немедленно обратиться к врачу.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
