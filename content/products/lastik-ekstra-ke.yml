  wait: '60 (1)'
regulation_notes:
  liquid_flow: наземное опрыскивание — 50–300 л/га, авиационное — 25–50 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рекомендована однократная обработка в ранние фазы развития сорняков (2–3 листа — конец кущения) независимо
    от фазы культуры, с учётом чувствительности сортов. Важно выбрать срок — массовое появление однолетних
    злаковых сорняков.
  - 'При наземном опрыскивании сначала готовят маточный раствор концентрацией не более 20 % (на каждый литр
    препарата — 5 л воды). Бак опрыскивателя наполовину заполняют водой, вливают маточный раствор, доливают
    воду до полного объёма и перемешивают гидравлическими мешалками; ёмкость из-под маточного раствора несколько
    раз ополаскивают, сливая смыв в бак. Используют штанговые опрыскиватели со щелевыми распылителями для
    гербицидов.'
  - При авиаобработке рабочий раствор готовят механизированным способом на заправочных станциях или агрегатах
    (бак наполовину заполняют водой, при работающей мешалке добавляют препарат и доливают воду) и используют
    в день приготовления. Заправку самолёта проводят при выключенном двигателе через наземные фильтры.
  - Значение pH воды — 4,5–6. Раствор готовят и заправляют опрыскиватель на специальных площадках, которые
    затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией; несовместим с пестицидами с pH выше 8,5. Его можно комбинировать в баковой смеси с фунгицидом
    Колосаль Про.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Ластик Экстра → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −5 до +35 °C.'
  - 'Срок хранения: 4 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Ограничений нет.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах и в санитарной зоне рыбохозяйственных водоёмов.
    Работы с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены (ГОСТ
    12.3.041-86, СанПиН 1.2.1077-01). Возможность скармливания соломы животным решают органы государственного
    ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают сорбентом (песок, опилки) до полного впитывания; загрязнённые сорбенты в
    контейнерах, отходы препарата и загрязнённую тару обезвреживают в местах, согласованных с природоохранными
    органами. Места пролива обрабатывают 3–5 % раствором кальцинированной соды и промывают водой. Запрещается
    сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Феноксапроп-П-этил и клоквинтосет-мексил нестойки в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят при скорости ветра до 4–5 м/с; погранично-защитная
    зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — 3–4 часа. Обязательно предварительное оповещение
    местных пчеловодов о препарате, сроках и зонах применения.
  - Запрещено применение в санитарной зоне рыбохозяйственных водоёмов.
mechanism:
- key: mech
  title: Как работает феноксапроп-П-этил
  paras:
  - Феноксапроп-П-этил относится к производным арилоксифеноксипропионовых кислот. Препарат проникает в
    сорняк через листья и накапливается в точках роста; действующее вещество превращается в свободную кислоту
    феноксапропа, которая тормозит биосинтез жирных кислот в меристемах, — образование клеточных мембран
    в точках роста прекращается.
  - Антидот клоквинтосет-мексил ускоряет обезвреживание действующего вещества в растениях пшеницы и ячменя,
    превращая его в нейтральные для культуры вещества.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Гербицид быстро проникает в листья, и вскоре сорняки перестают конкурировать с культурой; затем сорные
    злаки полностью отмирают — скорость зависит от погоды. Быстрее всего препарат действует при обработке
    в фазе 2–3 листьев сорняков при благоприятных влажности и температуре.
  - 'Симптомы: хлороз молодых листьев, угнетение точек роста, у некоторых видов — антоциановая окраска листьев.'
  - На сорняки второй «волны», появившиеся после опрыскивания, препарат не действует, но для раскустившихся
    зерновых они уже не представляют существенной опасности.
  - При обработке в холодную погоду возможно временное посветление листьев культуры, особенно по краям листовой
    пластины; обычно окраска восстанавливается.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние злаковые сорняки — овсюг (виды), мятлик (виды), лисохвост полевой, просо куриное, просо волосовидное,
    просо сорно-полевое, щетинник (виды), метлица полевая, канареечник (виды), росичка кровяная, плевел
    многоцветковый, падалица кукурузы и др.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
