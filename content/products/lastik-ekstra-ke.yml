- rate: '0,8–1'
  crop: 'Ячмень яровой и озимый'
  object: 'Однолетние злаковые сорняки (щетинник, просо куриное, просо сорно-полевое, овсюг, метлица полевая)'
  method: 'Опрыскивание весной в ранние фазы развития сорняков (2–3 листа) независимо от фазы культуры; наземное
