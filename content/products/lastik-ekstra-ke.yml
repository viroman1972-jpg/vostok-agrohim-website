# Источники: регламент — госреестр (agroxxi v176, lastik-ekstra-ke-5; строки наземной и авиаобработки объединены);
# процедуры — инструкция АО Фирма «Август» (avgust.com/products/rf/lastik_ekstra/, 27.10.2026); срок хранения —
# госреестр (ПИ10, совпадает с Августом). Запрет авиаприменения (Август) не перенесён — в госреестре авиаобработка
# есть, у Августа же дана инструкция по заправке самолёта и вертолёта. Не назван Галоп (нет в ассортименте).
# Не перенесены: «малотоксичны или практически нетоксичны» (ДЗ04), «случаев резистентности не выявлено»,
# центр Склифосовского (в информации для врача — ФМБА), сроки в сутках и днях из описания действия (ПИ12). ПИ12.
