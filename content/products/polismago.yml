# Источник: сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/polismago/, 27.10.2026).
# В справочнике пестицидов agroxxi препарата нет (смачиватель), поэтому таблицы регламента нет. Срока хранения,
# условий хранения, первой помощи, транспортировки и охраны среды у Гарант Оптимы нет — блоки пустые
# (этикетки не запрашиваем). Не перенесено: «уникальная кремнийорганическая основа». ПИ12.
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - ПолисмаГО добавляют в баковые смеси со средствами защиты растений, удобрениями, регуляторами роста
    и другими агрохимикатами, а также применяют при протравливании семян. Норма расхода — 50–100 мл на
    100 л рабочего раствора. Повышенную норму не допускают — рабочая жидкость начнёт стекать с поверхности
    листа.
  - 'Порядок приготовления: в бак опрыскивателя наливают треть объёма воды, включают мешалку и добавляют
    нужное количество пестицидов или агрохимикатов. Бак доливают водой до полного объёма, выключают мешалку,
    добавляют ПолисмаГО и снова включают мешалку. Мешалку не выключают в течение всей обработки.'
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - По данным производителя, ПолисмаГО совместим с большинством пестицидов. Не смешивать с препаратами
    меди и серы — возможна фитотоксичность.
  - Перед применением рекомендуется провести пробное смешивание компонентов.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 1 л.'
mechanism:
- key: mech
  title: Как работает ПолисмаГО
  paras:
  - ПолисмаГО — кремнийорганический (органосиликоновый) смачиватель. Он снижает поверхностное натяжение
    рабочего раствора, капли растекаются по листу и закрепляются на растении, а препарат попадает и в труднодоступные
    его части.
  - По данным производителя, смачиватель повышает эффективность препаратов на растениях, покрытых пылью,
    восковым налётом и густым опушением, ускоряет проникновение системных препаратов внутрь растения и
    повышает их устойчивость к смыванию осадками.
  - Добавление ПолисмаГО особенно полезно при низком расходе воды, опрыскивании в засуху и приготовлении
    раствора на жёсткой воде.
