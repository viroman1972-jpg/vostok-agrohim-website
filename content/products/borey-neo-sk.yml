procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Перед применением препарат тщательно взбалтывают в заводской упаковке. Бак опрыскивателя наполовину
    заполняют водой, включают мешалку, вливают расчётное количество препарата и при работающей мешалке
    доводят бак водой до полного объёма. Во время опрыскивания рабочую жидкость постоянно перемешивают.
  - Рабочую жидкость используют в день приготовления. Значение pH воды для приготовления рабочего раствора
    — 5–7.
  - Против вредителей всходов посевы опрыскивают по всходам, против остальных — в период вегетации при
    появлении вредителей, против саранчовых — в период развития личинок. Яблоню против яблонного цветоеда
    обрабатывают в период обособления бутонов. В рабочий раствор рекомендуется добавлять адъювант, например
    Аллюр.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → Борей Нео → СК
    (ВСК) → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: флаконы 1 л, канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата в невскрытой заводской упаковке при соблюдении
    условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами крытого транспорта в соответствии с правилами перевозки опасных грузов.
    Транспортировка и хранение совместно с пищевыми продуктами и кормами категорически запрещены.
  - На всех этапах обращения препарата соблюдают СанПиН 1.2.2584-10 и СанПиН 1.2.1330-03. Работы без средств
    индивидуальной защиты органов дыхания, зрения и кожи запрещены; во время работы нельзя есть, пить и
    курить. Запрещено применение в личных подсобных хозяйствах.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для ручных
    — 7 дней.
  - Пролитый препарат засыпают песком или другим негорючим материалом до полного впитывания, сорбент собирают
    в контейнеры. Участок в помещении промывают водой с мылом или содой (200 г соды на ведро воды), участок
    земли перекапывают.
  - Остатки препарата, загрязнённые сорбенты и тару утилизируют термически или вывозят в места, согласованные
    с природоохранными органами и Роспотребнадзором.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 1 (высокоопасный). Применение требует соблюдения «Инструкции по профилактике
    отравления пчёл пестицидами».
  - 'Ограничения: обработка при скорости ветра не более 1–2 м/с; погранично-защитная зона для пчёл — не
    менее 4–5 км; ограничение лёта пчёл — не менее 4–6 суток.'
  - Применение в водоохранных зонах водных объектов, в том числе рыбохозяйственных водоёмов, запрещено.
mechanism:
- key: mech
  title: Как работают альфа-циперметрин, имидаклоприд и клотианидин
  paras:
  - Альфа-циперметрин — синтетический пиретроид с быстрым контактным и кишечным действием. В растение он
    не проникает, а остаётся на поверхности и в кутикуле, действует на натриевые каналы нервных клеток
    насекомых; проявляет остаточное и отпугивающее действие.
  - Имидаклоприд и клотианидин — неоникотиноиды с контактным, кишечным и системным действием; они блокируют
    рецепторы нервной системы насекомых. Клотианидин менее подвижен и лучше закрепляется в тех частях растения,
    куда попал. Имидаклоприд растворяется лучше, быстрее поглощается и перемещается по тканям, поддерживая
    действующую концентрацию в листьях и колосе.
  - Вещества воздействуют на разные этапы передачи нервного импульса и, по данным производителя, усиливают
    действие друг друга.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат начинает действовать сразу после попадания на растение. Вредители быстро прекращают питание
    и затем гибнут.
  - Мелкодисперсная препаративная форма, по данным производителя, сохраняет стабильность, в том числе при
    замораживании.
- key: spectrum
  title: Спектр действия
  paras:
  - Клопы, тли, трипсы, блошки, долгоносики, жуки, пьявицы, злаковые мухи, совки, огнёвки, плодожорки,
    листовёртки, щитовки, саранчовые, хвое- и листогрызущие вредители лесных пород и другие объекты, указанные
    в регламенте применения для каждой культуры.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Препарат сочетает действующие вещества двух химических групп — пиретроидов и неоникотиноидов. При нескольких
    обработках за сезон желательно чередовать его с инсектицидами других механизмов действия.
  - Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, дать пострадавшему выпить несколько стаканов тёплой воды с активированным
    углём (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки глотки вызвать
    рвоту (если пострадавший в сознании). Повторить несколько раз, затем вновь дать выпить стакан воды с
    активированным углём.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания кожи, а затем
    обмыть загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — немедленно промыть глаза мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду и средства индивидуальной
    защиты, избегая попадания препарата на кожу.'
- lead: ''
  text: После оказания первой помощи при необходимости обратиться за медицинской помощью.
- lead: ''
  text: 'Информация для врача: специфические антидоты отсутствуют, лечение симптоматическое. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
