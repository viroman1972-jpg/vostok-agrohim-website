regulation_notes:
  liquid_flow: 100–400 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - На сахарной свёкле, подсолнечнике, кукурузе, сое, рапсе, гречихе, арбузе, тыкве, кабачках и сафлоре
    опрыскивают почву до посева или до всходов; на рассадной капусте — через 3–10 дней после высадки, на
    посевной — после посева до всходов. В засуху для сохранения эффективности рекомендуется неглубокая
    заделка препарата (на 2–3 см).
  - Рабочий раствор готовят непосредственно перед применением. Препарат перемешивают в заводской таре, бак
    наполовину заполняют чистой водой, включают мешалку, добавляют отмеренное количество препарата и доливают
    воду до полного объёма при перемешивании; ёмкость ополаскивают, сливая смыв в бак. Перемешивание продолжают
    во время обработки. Значение pH воды — 5,5–7.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - При высокой засорённости подсолнечника препарат рекомендуется комбинировать с гербицидом Гаур.
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. В каждом конкретном случае необходимо проверять совместимость компонентов, а готовую смесь
    — на фитотоксичность по отношению к культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Симба → КЭ (КМЭ, МЭ, КНЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в водоохранных зонах водных
    объектов; у водоёмов с водоохранной зоной менее 100 м соблюдают 100-метровую погранично-защитную полосу.
    Работы проводят со средствами индивидуальной защиты органов дыхания, зрения и кожи (ГОСТ 12.3.041-86,
    СанПиН 1.2.2584-10). Возможность скармливания животным зелёной массы кукурузы и подсолнечника, ботвы
    сахарной свёклы решают органы государственного ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    собирают в контейнеры для обезвреживания; участок в помещении промывают водой с мылом или содой (200
    г соды на ведро воды), участок земли перекапывают. Утилизация остатков — по СанПиН 1.2.2584-10 и СанПиН
    1.2.1330-03. Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат — 2 класс опасности по стойкости в почве. С-метолахлор среднетоксичен для рыб и чрезвычайно
    токсичен для водной растительности.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    20–24 часов.
  - Запрещено применение в водоохранной зоне водных объектов, включая рыбохозяйственные водоёмы.
mechanism:
- key: mech
  title: Как работает С-метолахлор
  paras:
  - С-метолахлор относится к хлорацетамидам. Он проникает в сорняк в основном через стебелёк проростка
    — у злаковых через колеоптиль, у двудольных через семядоли; появление семядолей задерживается, росток
    скручивается и гибнет.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Гербицид действует на самых ранних фазах роста чувствительных сорняков и вызывает их гибель ещё до появления
    всходов. Благодаря гербицидному «экрану» на поверхности почвы защитное действие длительное.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние злаковые и некоторые двудольные сорняки — галинсога (виды), горцы (виды), горчица полевая,
    гумай (проростки), звездчатка средняя, марь белая, паслён чёрный, пастушья сумка, портулак огородный,
    просо (виды), просо куриное, ромашка (виды), росичка (виды), сорго алеппское, щетинник (виды), щирица
    (виды), яснотка пурпурная и др. Многолетние сорняки к препарату устойчивы.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют
    и строго соблюдают регламенты применения.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При первых признаках отравления
  text: ' (снижение двигательной активности и реакции на раздражители, нарушение дыхания, сужение глазной
    щели) — прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду
    и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться за медицинской
    помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, антидот неизвестен. При необходимости — консультация
