procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочий раствор готовят непосредственно перед применением. Препарат тщательно перемешивают в заводской
    упаковке (встряхивают канистру), отмеряют количество на одну заправку и вводят прямо в бак, заполненный
    водой не менее чем наполовину, при хорошо работающей гидравлической мешалке; затем при непрерывном перемешивании
    доводят бак водой до нужного объёма. Тару трижды ополаскивают, сливая смыв в бак. Перемешивание продолжают
    во время обработки.
  - Рабочий раствор используют в день приготовления. Значение pH воды для приготовления рабочего раствора
    — 6–7.
  - Опрыскивание проводят профилактически или при первых симптомах болезни; против фузариоза колоса — в
    фазе конец колошения — начало цветения. Минимальную норму (0,2 л/га) используют только для первой профилактической
    обработки. При тёплой влажной погоде и риске обильных дождей рекомендуется добавлять адъювант Аллюр.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → Ракурс → СЭ →
    КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после полного
    растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке, с защитой от прямых солнечных лучей, увлажнения, загрязнения
    и механического повреждения.'
  - 'Температурный режим: от −30 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - При применении соблюдают требования ГОСТ 12.3.041-86 и СанПиН 1.2.2584-10; работы без средств индивидуальной
    защиты органов дыхания, зрения и кожи запрещены. Место заправки опрыскивателя удаляют не менее чем на
    200 м от жилья, скотных дворов, источников водоснабжения, мест хранения фуража и посевов продовольственных
    культур.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Место разлива засыпают песком или другим негорючим сорбентом, сорбент собирают в контейнеры и вывозят
    на обезвреживание в места, согласованные с природоохранными органами и Роспотребнадзором. Участок в
    помещении промывают водой с мылом или содой, участок земли обезвреживают 10 % раствором кальцинированной
    соды и перекапывают.
  - Тару трижды ополаскивают, смыв выливают в бак с рабочим раствором; вторичное использование тары не
    допускается. Запрещается сливать препарат на землю, в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат относится ко 2 классу опасности по стойкости в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером после захода солнца
    при скорости ветра не более 4–5 м/с (при авиаприменении — не более 2–3 м/с); погранично-защитная зона
    для пчёл — не менее 2–3 км (при авиаприменении — 3–4 км); ограничение лёта пчёл — не менее 20–24 часов.
    Обязательно предварительное оповещение пчеловодов за 4–5 суток о препарате, сроках и зонах применения.
  - Применение в водоохранных зонах водных объектов, включая рыбоохранные зоны, запрещено.
mechanism:
- key: mech
  title: Как работают эпоксиконазол и ципроконазол
  paras:
  - 'Оба действующих вещества относятся к триазолам — ингибиторам деметилирования (DMI): подавляют биосинтез
    стеролов в клетках грибов и нарушают образование клеточных мембран.'
  - Ципроконазол обладает защитным, лечебным и искореняющим действием, хорошо растворим в воде и быстро
    поглощается листьями, распространяясь во все вегетирующие части растения; особенно эффективен против
    ржавчин. Эпоксиконазол обладает профилактическим, искореняющим и длительным остаточным действием, долго
    сохраняется в растении и активен в холодную и влажную погоду; он подавляет развитие гриба на листе
    и образование спор.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат проникает в растение в первые часы после обработки. Быстрое поглощение ципроконазола снижает
    риск смыва дождём. По данным производителя, Ракурс обеспечивает длительный период защитного действия.
- key: spectrum
  title: Спектр действия
  paras:
  - Мучнистая роса, ржавчины, пиренофороз, септориоз листьев и колоса, фузариоз колоса, сетчатая и тёмно-бурая
    пятнистости, ринхоспориоз зерновых; болезни сои, гороха и сахарной свёклы, указанные в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Оба действующих вещества относятся к одной группе — ингибиторам деметилирования (DMI). При нескольких
    обработках за сезон желательно чередовать препарат с фунгицидами других групп. Ориентироваться только
    на разные торговые названия недостаточно — разные препараты могут содержать действующие вещества одной
    и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить 1–2 стакана воды со взвесью энтеросорбента
    (активированный уголь или другой) по инструкции к нему, а затем раздражением задней стенки глотки вызвать
    рвоту; повторить несколько раз, после чего вновь дать выпить 1–2 стакана воды со взвесью сорбента и
    немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания кожи, а затем
    обмыть загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть глаза мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду
    и средства индивидуальной защиты, избегая попадания препарата на кожу, немедленно обратиться за медицинской
    помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
