procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочий раствор готовят непосредственно перед применением; предварительно препарат перемешивают в
    заводской упаковке. Бак опрыскивателя заполняют водой примерно на треть, включают мешалку и добавляют
    препарат на одну заправку, затем дополняют бак водой при одновременном перемешивании; перемешивание
    продолжают и во время обработки.
  - Рабочий раствор используют в день приготовления. Значение pH воды для приготовления рабочего раствора
    — 5–7.
  - Растения опрыскивают в период вегетации при появлении вредителей; сахарную и кормовую свёклу и лён-долгунец
    против вредителей всходов — по всходам. Пастбища, луга и многолетние травы против саранчовых обрабатывают
    в период развития личинок младших возрастов. В рабочий раствор рекомендуется добавлять адъювант, например
    Аллюр.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией, — например, с фунгицидом Раёк.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Шарпей → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после
    полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −12 до +40 °C.'
  - 'Срок хранения: 3 года при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - В связи с аллергенным и раздражающим действием на кожу работы с препаратом проводят только лица, прошедшие
    специальную подготовку, обязательно со средствами индивидуальной защиты органов дыхания, зрения и кожи
    (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для ручных
    — 7 дней.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.2584-10. Не допускается
    загрязнение водоёмов препаратом или использованной тарой; запрещается сливать препарат в канализацию
    и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 1 (высокоопасный). Применение требует соблюдения «Инструкции по профилактике
    отравления пчёл пестицидами», в том числе предварительного оповещения местных пчеловодов о препарате,
    сроках и зонах обработки. Не допускается обработка цветущих энтомофильных культур в период активного
    лёта пчёл.
  - 'Ограничения: обработка ранним утром или вечером после захода солнца при скорости ветра не более 1–2
    м/с; погранично-защитная зона для пчёл — не менее 4–5 км; ограничение лёта пчёл — не менее 96–120 часов.'
  - Рыбохозяйственная оценка — 1 класс опасности; применение в санитарной зоне рыбохозяйственных водоёмов
    запрещено.
mechanism:
- key: mech
  title: Как работает циперметрин
  paras:
  - Циперметрин — синтетический пиретроид с быстрым контактно-кишечным действием, поражает нервную систему
    вредных насекомых.
  - Помимо прямого действия, препарат нарушает откладку яиц у взрослых насекомых и питание у личинок.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Вскоре после обработки вредители перестают передвигаться, а затем гибнут от общего паралича.
  - Продолжительность защитного действия зависит от вида вредителя, стадии его развития и погодных условий.
    Препаративная форма — микроэмульсия; по данным производителя, она повышает устойчивость препарата к
    высоким температурам.
- key: spectrum
  title: Спектр действия
  paras:
  - Клопы, тли, пьявицы, трипсы, хлебные жуки и жужелица, злаковые мухи и галлицы, блошки, совки, мотыльки,
    огнёвки, колорадский жук, картофельная и капустная моли, белянки, долгоносики, листовёртки, саранчовые
    и другие объекты, указанные в регламенте применения для каждой культуры.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Для предупреждения резистентности препарат чередуют с инсектицидами другого механизма действия. Ориентироваться
    только на разные торговые названия недостаточно — разные препараты могут содержать действующие вещества
    одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — выпить 1–2 стакана воды с активированным углём (из расчёта 1 г сорбента на 1 кг массы тела),
    вызвать рвоту.'
- lead: При попадании на кожу
  text: ' — обильно смыть водой с мылом.'
- lead: При попадании в глаза
  text: ' — тщательно промыть глаза проточной водой.'
