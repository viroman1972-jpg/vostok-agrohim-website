# Источники: регламент и ограничения по севообороту — госреестр (agroxxi v176, serp-vrk-2); описание и рекомендации
# — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/serp/, 27.10.2026); срок
# хранения — госреестр (ПИ10). По госреестру, а не по Гарант Оптиме: нута в регистрации нет; сроки посева
# последующих культур (у Гарант Оптимы — по месяцам, кукуруза и ячмень через 11 месяцев); запрет применения
# в водоохранной зоне. Не перенесены: «мировой опыт» (люцерна вне регистрации), скармливание зелёной массы
# через 45 дней, сроки в днях и неделях из описания действия (ПИ12). Первой помощи, условий хранения и транспортировки
# у Гарант Оптимы нет — блоки пустые (этикетки не запрашиваем). ПИ12.
regulation:
- rate: '0,5–0,8'
  crop: 'Соя'
  object: 'Однолетние и многолетние злаковые и однолетние двудольные сорняки'
  method: 'Опрыскивание почвы до посева (с заделкой), до всходов или опрыскивание посевов в фазе всходов
    — 2 тройчатых листьев культуры'
  wait: '78 (1)'
- rate: '0,5–0,75'
  crop: 'Горох на зерно'
  object: 'Однолетние и многолетние злаковые и однолетние двудольные сорняки'
  method: 'Опрыскивание почвы в течение 2–3 дней после посева или опрыскивание посевов в фазе 3–6 листьев
    культуры'
  wait: '40 (1)'
regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Препарат можно вносить под предпосевную культивацию (заделка не глубже 6 см) или после посева до всходов
    — в засуху его заделывают в почву боронами. По всходам лучший результат — на ранних этапах развития
    культуры, когда у двудольных сорняков не больше 4 листьев, у злаковых — 2–3 листа.
  - Не рекомендуется применять препарат на одном поле чаще одного раза в 3 года. В течение сезона после
    обработки на этом поле не применяют гербициды из групп сульфонилмочевин и имидазолинонов.
  - Рабочий раствор готовят в день внесения. Препарат взбалтывают, бак опрыскивателя заполняют водой на
    треть, включают перемешивание, добавляют препарат и доливают воду до полного объёма. Перемешивание
    не выключают и во время обработки.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат не применяют в баковых смесях с противозлаковыми гербицидами.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Срок хранения: 3 года.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - При пересеве в год применения рекомендуется сеять озимую пшеницу, на следующий год — кукурузу, яровые
    и озимые зерновые, через 2 года — все культуры без ограничений.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Запрещено применение в водоохранной зоне водных объектов.
mechanism:
- key: mech
  title: Как работает имазетапир
  paras:
  - Имазетапир относится к имидазолинонам. Он проникает в сорняки через корни и листья и блокирует синтез
    белка — клетки перестают расти, и сорняк погибает. При довсходовом внесении двудольные сорняки прекращают
    рост в фазе двух листьев, злаковые — в фазе колеоптиля.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - При внесении по всходам рост сорняков останавливается вскоре после обработки, хотя в первые дни это
    может быть незаметно. Затем у двудольных теряется тургор, листья желтеют и буреют; у злаковых появляются
    побурение и антоциановая окраска; после этого сорняки погибают.
- key: spectrum
  title: Спектр действия
  paras:
  - Большинство однолетних злаковых и двудольных сорняков, в том числе виды амброзии, а также многолетние
    злаковые — на сое и горохе.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
