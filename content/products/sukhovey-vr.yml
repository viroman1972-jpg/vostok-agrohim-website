# Источники: регламент — госреестр (agroxxi v176, suhovey-vr-7: гербицид и десикант; строки наземной и
# авиаобработки объединены; у рапса в госреестре только строка с пометкой авиаобработки — перенесена как есть);
# процедуры — инструкции АО Фирма «Август» (avgust.com/products/rf/sukhovey_d/ — десикант,
# avgust.com/products/rf/sukhovey/ — гербицид, 27.10.2026); срок хранения — госреестр (ПИ10, 3 года; Август
# для гербицида пишет 4). Не названы препараты вне ассортимента (Гайтан, Питон, Сахара, Эгида, Трейсер,
# Лазурит, Плектор, Камелот). Не перенесены: «низкий уровень рисков», «очень быстрое действие», сроки в
# днях и минутах из описания действия (ПИ12). Десиканты — ПИ08. ПИ12.
