  reentry: 3 дня (после авиаобработки — 5 дней)
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - 'Как гербицид Суховей применяют по вегетирующим сорнякам до посева или до всходов культуры. Сроки десикации:
    подсолнечник — начало побурения корзинок; картофель — окончание формирования клубней и огрубление кожуры;
    зерновые на семена — созревание при влажности зерна не выше 30 %; соя — побурение 50–70 % бобов за
    10 дней до уборки; горох, нут, чечевица, гречиха, люпин, клещевина — полная биологическая спелость
    за 7–10 дней до уборки; рапс — побурение семян в стручках среднего яруса; масличный лён — ранняя жёлтая
    спелость за 7–10 дней до уборки; люцерна — побурение 85–90 % бобов.'
  - Оптимальная температура при опрыскивании — от 15 до 25 °C; в солнечную погоду препарат действует быстрее,
    в прохладную (ниже 10 °C) — немного медленнее. Вскоре после обработки препарат не смывается дождём.
  - Для раствора используют только чистую воду. При наземном применении бак опрыскивателя наполовину заполняют
    водой, включают гидравлическую мешалку, вливают препарат на одну заправку и доливают воду до полного
    объёма при перемешивании; ёмкость из-под препарата несколько раз ополаскивают, сливая смыв в бак. Перемешивание
    продолжают во время обработки.
  - При авиаобработке раствор готовят механизированным способом на заправочных станциях или агрегатах и
    используют в день приготовления; заправку самолёта проводят при выключенном двигателе через наземные
    фильтры. Авиаобработка подсолнечника сверхлёгкими летательными аппаратами не рекомендуется.
  - Значение pH воды — 6–7; при электропроводности воды выше 500 мкСм/см нужен анализ на соли жёсткости
    и умягчение воды.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Суховей совместим в баковой смеси с гербицидом Лазурит Супер; с Гауром его не применяют. Как десикант
    его можно смешивать с препаратами на основе карфентразон-этила.
  - Препарат совместим с другими пестицидами, за исключением препаратов со щелочной или сильнокислой реакцией.
    Перед применением смесь проверяют на совместимость компонентов и фитотоксичность по отношению к культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → Суховей → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах. Работы проводят со средствами индивидуальной защиты
    кожи, глаз и органов дыхания (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10). Возможность скармливания животным
    зелёной массы подсолнечника решают органы государственного ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для механизированной
    уборки после десикации — 5 дней.
  - Пролитый препарат засыпают песком, землёй, сухой глиной или другим негорючим сорбентом, загрязнённый
    сорбент собирают в контейнеры для обезвреживания; участки земли обрабатывают 10 % раствором кальцинированной
    соды и перекапывают, участок в помещении промывают 10 % раствором соды. Не допускать попадания препарата
    в водоёмы, подвалы и канализацию. Утилизация остатков — по СанПиН 1.2.2584-10 и СанПиН 1.2.1330-03.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с (при авиаприменении — 2–3 м/с); погранично-защитная зона для пчёл — не менее 2–3 км
    (при авиаприменении — 3–4 км); ограничение лёта пчёл — не менее 3–4 часов. Пчеловодов оповещают за
    4–5 суток о препарате, сроках и зонах применения.
  - Разрешено применение в санитарной зоне рыбохозяйственных водоёмов.
mechanism:
- key: mech
  title: Как работает дикват
  paras:
  - Дикват относится к производным бипиридилия. Он нарушает физиологические и биохимические процессы в растениях,
    ослабляет способность тканей удерживать воду и ведёт к гибели клеток — растения высыхают.
  - Как гербицид Суховей действует контактно на однолетние двудольные и злаковые сорняки до посева или
    до всходов культуры; как десикант — подсушивает посевы перед уборкой.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат высушивает растения в течение нескольких дней — в зависимости от погоды и состояния растений.
    В солнечную погоду действие ускоряется, при прохладе немного замедляется.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние двудольные и злаковые сорняки; десикация зерновых, подсолнечника, сои, гороха, нута, рапса,
    масличного льна, картофеля, люцерны, гречихи, чечевицы, люпина и клещевины.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды и обратиться к офтальмологу.'
- lead: При первых признаках недомогания
  text: ' — прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду
    и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться за медицинской
    помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
