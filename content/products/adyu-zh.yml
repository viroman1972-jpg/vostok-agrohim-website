# Источник: инструкция АО Фирма «Август» (avgust.com/products/rf/adyu/, 25.10.2026). В справочнике
# пестицидов agroxxi препарата нет (ПАВ), поэтому таблицы регламента нет. ПИ12.
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Адью применяют совместно с гербицидами (или другими пестицидами) в формах ВДГ, ВРК и ВРГ — сульфонилмочевинами,
    имидазолинонами, пиридинкарбоновыми кислотами и другими. Норма расхода — 0,2 л/га при расходе рабочего
    раствора гербицида 200 л/га.
  - Адъювант вливают в бак опрыскивателя в последнюю очередь — иначе из-за пенообразования часть раствора
    может вылиться из бака. Значение pH воды для приготовления рабочего раствора — 5,5–7.
  - С Адью образуются маловязкие растворы и мелкие капли, поэтому снос капель рабочей жидкости предотвращают
    настройками техники. Совместное применение с некоторыми граминицидами не рекомендуется из-за возможного
    снижения их эффективности.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Адью применяют в смеси с гербицидами против двудольных сорняков в форме ВДГ, в том числе с Кентавром,
    Магнумом и Хакером, а также с гербицидами Галион и Суховей.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после полного
    растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −10 до +35 °C.'
  - 'Срок хранения: 4 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — любым видом транспорта крытого типа в условиях, обеспечивающих сохранность тары.
    Транспортировка и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - При работе соблюдают требования ГОСТ 12.3.041-86 и СанПиН 1.2.2584-10; работы без средств индивидуальной
    защиты органов дыхания, зрения и кожи запрещены. Рабочий раствор готовят и заправляют опрыскиватель
    на специальных площадках, которые затем обезвреживают.
  - При проливе не прикасаться к препарату, устранить течь, перекачать содержимое в исправную сухую ёмкость.
    Участок оградить земляным валом и засыпать песком; загрязнённый песок собрать в плотно закрываемый
    контейнер и сдать на утилизацию в соответствии с местными требованиями.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.1077-01. Запрещается
    сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Меры охраны полезной флоры и фауны определяются свойствами гербицида, с которым применяется Адью.
mechanism:
- key: mech
  title: Как работает Адью
  paras:
  - Адью — неионогенное поверхностно-активное вещество из группы активаторов, то есть усиливает действие
    гербицида, с которым применяется.
  - Адью снижает поверхностное натяжение рабочего раствора. Капли не отскакивают от листа, лучше смачивают
    его и растекаются по поверхности; по мере испарения воды растворяющая способность ПАВ растёт, и гербицид
    легче проникает через кутикулу.
  - Это особенно важно для сорняков с восковым налётом на листьях (марь, полынь, щирица, горцы, молочай)
    и с густым опушением (бодяк, чистец, татарник, вероника), а также для частично переросших сорняков.
    По данным производителя, Адью повышает дождестойкость гербицида и снижает испарение препарата с листьев.
first_aid:
- lead: При случайном проглатывании
  text: ' — дать пострадавшему выпить с водой взвесь активированного угля (из расчёта 1 г сорбента на 1 кг
    массы тела) и вызвать рвоту раздражением задней стенки глотки; повторить несколько раз до полного удаления
    препарата из организма.'
- lead: При вдыхании
  text: ' — обеспечить доступ свежего воздуха, при необходимости сделать искусственное дыхание.'
- lead: При попадании на кожу
  text: ' — аккуратно, не втирая, удалить препарат куском ткани или ваты, тщательно вымыть кожу большим
    количеством воды с мылом.'
- lead: При попадании в глаза
  text: ' — тщательно промыть глаза чистой проточной водой при разомкнутых веках.'
- lead: При первых признаках недомогания
  text: ' — немедленно удалить пострадавшего из зоны действия препарата, освободить от загрязнённой одежды.'
- lead: ''
  text: Если пострадавший без сознания, не пытаться вызвать рвоту и не вводить ничего через рот.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
