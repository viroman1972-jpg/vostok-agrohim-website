regulation_notes:
  liquid_flow: 50–300 л/га (в зависимости от типа распылителей)
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Озимую пшеницу обрабатывают весной в фазе кущения, яровые зерновые — в фазе 2–3 листьев — кущения,
    сою — в фазе 1–2 настоящих листьев, лён — в фазе «ёлочки»; во всех случаях — в ранние фазы роста сорняков.
  - На зерновых (в минимальной норме) и на сое в раствор обязательно добавляют адъювант Адью — в конце
    заполнения бака. На льне препарат применяют строго без адъювантов, иначе возможна фитотоксичность.
  - Рабочий раствор готовят непосредственно перед опрыскиванием. Бак наполовину заполняют чистой водой,
    включают мешалку, добавляют отмеренное количество препарата и доливают воду при перемешивании. Рекомендуется
    маточный раствор — в миксере (баке-смесителе), заполненном на треть водой, или в ведре на 8–10 л, заполненном
    наполовину (не более 300 г препарата на ведро, долить до трёх четвертей объёма); тару и мерную ёмкость
    ополаскивают, сливая смыв в бак.
  - Значение pH воды — 5–7. Раствор готовят на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Не рекомендуется смешивать его с фосфорорганическими инсектицидами и применять их в течение
    14 дней до или после обработки Алсионом.
  - На льне Алсион не смешивают с адъювантами и граминицидами; интервал между обработкой Алсионом и граминицидом
    — 5–7 дней.
  - В каждом конкретном случае необходимо проверять совместимость компонентов, а готовую смесь — на фитотоксичность
    по отношению к культуре. На сое баковые смеси могут вызывать отставание в росте, пожелтение листьев
    или небольшие некрозы, особенно если культура в стрессе.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → Алсион → ВДГ (СТС) → СК (ВСК)
    → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: банки по 300 г препарата.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +45 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Ограничений нет.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах и авиационным методом. Работы с препаратом без средств
    индивидуальной защиты органов дыхания, зрения и кожи запрещены (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10).
    Возможность скармливания скоту соломы пшеницы и ячменя решают органы государственного ветеринарного
    надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Рассыпанный препарат собирают в сухие ёмкости для обезвреживания и герметично закрывают; участок в
    помещении промывают водой с мылом, участок земли перекапывают. Утилизация остатков — по СанПиН 1.2.2584-10
    и СанПиН 1.2.1330-03.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Пчеловодов оповещают за 4–5 суток о препарате, сроках
    и зонах применения; обработку проводят утром или вечером при скорости ветра не более 4–5 м/с; погранично-защитная
    зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее 20–24 часов.
  - Запрещено применение в водоохранных зонах водных объектов, включая рыбохозяйственные водоёмы.
mechanism:
- key: mech
  title: Как работает тифенсульфурон-метил
  paras:
  - Тифенсульфурон-метил относится к сульфонилмочевинам. Он проникает в сорняки через листья и корни, легко
    перемещается по ксилеме и флоэме и угнетает фермент ацетолактатсинтазу — деление клеток нарушается,
    рост останавливается, и сорняки погибают.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост сорняков резко останавливается вскоре после обработки; затем появляются покраснение жилок, хлороз
    листьев, отмирание точек роста и некроз тканей, и сорняки погибают. Переросшие и менее чувствительные
    сорняки обычно не погибают, но прекращают рост и больше не конкурируют с культурой.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Чувствительны: амброзия полыннолистная, бодяк (виды), горец (виды), горчица (виды), гулявник (виды),
    канатник Теофраста, марь белая, осот (виды), ромашка (виды).'
  - 'Среднечувствительны: яснотка стеблеобъемлющая, латук компасный, редька дикая.'
  - 'Слабочувствительны: вьюнок (всходы), подмаренник (всходы).'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Действующее вещество — ингибитор ацетолактатсинтазы, к таким гербицидам резистентность возникает с
    высокой вероятностью. Их чередуют с препаратами других химических групп и с другим механизмом действия.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить 1–2 стакана воды со взвесью энтеросорбента
    (активированный уголь и др.) в соответствии с рекомендациями по его применению, затем раздражением задней
    стенки глотки вызвать рвоту; повторить несколько раз, после чего снова выпить 1–2 стакана воды со взвесью
    сорбента и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — промыть большим количеством проточной воды.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — немедленно промыть мягкой струёй чистой проточной воды при разомкнутых веках.'
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять средства индивидуальной защиты и рабочую одежду, избегая попадания препарата на кожу, и немедленно
    обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
