procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочий раствор готовят непосредственно перед применением. Бак опрыскивателя на четверть заполняют
    водой и при непрерывном перемешивании вносят препарат на одну заправку, затем дополняют бак водой до
    однородного раствора; перемешивание продолжают во время обработки.
  - При поставке в водорастворимых пакетах их, не вскрывая, кладут в наполовину заполненный водой бак при
    работающей мешалке; упаковку вскрывают непосредственно перед закладкой, влага на пакеты попадать не
    должна. Готовить раствор через бак-смеситель не рекомендуется.
  - Рабочий раствор используют в день приготовления. Значение pH воды — 5–7. Заправочные площадки удаляют
    не менее чем на 200 м от жилья, скотных дворов, источников водоснабжения, мест хранения фуража и посевов
    продовольственных культур.
  - Ордан наиболее эффективен профилактически или на ранних стадиях заболевания, до появления симптомов.
    Картофель первый раз обрабатывают до смыкания ботвы в рядках или не позднее 2 дней после инфицирования,
    далее — с интервалом 7–14 дней; огурец и томат — в стадии 4–6 настоящих листьев или не позднее 2 дней
    после заражения, далее — с интервалом 7–10 дней. В рабочий раствор рекомендуется добавлять адъювант.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после полного
    растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: коробки 1 кг, пакеты 3 кг, мешки 15 кг; водорастворимые пакеты по 0,5 кг.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −20 до +35 °C. Не допускать замерзания препарата в водорастворимых пакетах.'
  - 'Срок хранения: 3 года со дня изготовления; в водорастворимых пакетах — 2 года.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - При работе соблюдают требования ГОСТ 12.3.041-86 и СанПиН 1.2.1077-01; работы без средств индивидуальной
    защиты органов дыхания, зрения и кожи запрещены.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для ручных
    — 7 дней, для ручных работ в защищённом грунте — 3 дня.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.1077-01. Не допускается
    загрязнение водоёмов препаратом или использованной тарой; запрещается сливать препарат в канализацию
    и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат среднестоек в почве (3 класс опасности по стойкости).
  - Класс опасности для пчёл по госреестру — 3 (малоопасный). Обработку проводят при скорости ветра до
    2–3 м/с; погранично-защитная полоса для пчёл — не менее 3–4 км; ограничение лёта пчёл — 48–72 часа.
    Обязательно предварительное оповещение пчеловодов за 4–5 суток о препарате, сроках и зонах применения.
  - Рыбохозяйственная оценка — 2 класс опасности; не допускать попадания препарата в рыбохозяйственные
    водоёмы.
mechanism:
- key: mech
  title: Как работают хлорокись меди и цимоксанил
  paras:
  - Ордан сочетает два действующих вещества с разным механизмом действия и обладает профилактическим, лечебным
    и искореняющим действием.
  - Хлорокись меди — неорганическое соединение меди контактного действия; она остаётся на поверхности листа
    и угнетает ферменты и жизненно важные компоненты клеток грибов. Цимоксанил — алкилпроизводное мочевины
    локально-системного действия; он быстро проникает в листья и подавляет синтез РНК в клетках возбудителя.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Цимоксанил быстро поглощается и глубоко проникает в листья, хлорокись меди остаётся на поверхности.
    Продолжительность защиты зависит от степени поражения; лечебное действие проявляется, если обработка
    проведена вскоре после заражения.
- key: spectrum
  title: Спектр действия
  paras:
  - Фитофтороз и альтернариоз картофеля и томата, пероноспороз огурца и лука, милдью винограда.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - По данным производителя, Ордан эффективен против возбудителей, устойчивых к фениламидам, не вызывает
    перекрёстной устойчивости и применяется в антирезистентных программах; вероятность резистентности
    к самому препарату мала благодаря сочетанию контактного и локально-системного компонентов.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, выпить несколько стаканов воды со взвесью активированного угля (из расчёта
    1 г сорбента на 1 кг массы тела), а затем вызвать рвоту раздражением задней стенки глотки; при необходимости
    повторить несколько раз, после чего выпить стакан воды с активированным углём и немедленно обратиться
    к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух, сменить загрязнённую одежду и вызвать врача.'
- lead: При попадании на кожу
  text: ' — снять загрязнение ватой или куском ткани, осторожно, не втирая, затем тщательно промыть кожу
    водой или слабым содовым раствором.'
- lead: При попадании в глаза
  text: ' — немедленно промывать глаза большим количеством чистой проточной воды в течение 15 минут при
    открытых веках и обратиться к врачу.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое; антидот для хлорокиси меди — унитиол, для цимоксанила
    антидота нет. При необходимости — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА
