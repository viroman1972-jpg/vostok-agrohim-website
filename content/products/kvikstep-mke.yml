# Источники: регламент — госреестр (agroxxi v176, kvikstep-mke-3; в госреестре каждая строка дана дважды —
# с расходом жидкости 100–300 и 200–300 л/га, объединены); процедуры — инструкция АО Фирма «Август»
# (avgust.com/products/rf/kvikstep/, 27.10.2026); срок хранения — госреестр (ПИ10; Август пишет 3 года,
# госреестр — 2). Не назван Галоп (нет в ассортименте). Не перенесены: «низкий уровень рисков», «случаев
# резистентности не выявлено», сроки в днях и неделях из описания действия (ПИ12). ПИ12.
