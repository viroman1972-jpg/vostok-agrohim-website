procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - 'Фаза сорняков при обработке: однолетние злаковые — период активного роста (2–6 листьев — начало кущения),
    многолетние — 4–6 листьев, высота 10–20 см. На сорняках должно быть достаточно листьев для быстрого
    поглощения действующих веществ, а растения культуры не должны их закрывать («экранировать»).'
  - Если вода жёсткая, гидрокарбонатная или щелочная (pH выше 7), перед заправкой Квикстепа в воду рекомендуется
    добавить кондиционер Сойлент согласно инструкции.
  - Препарат тщательно перемешивают в заводской упаковке. Бак опрыскивателя наполовину заполняют водой,
    вливают отмеренное на одну заправку количество гербицида и доливают воду до полного объёма при постоянном
    перемешивании гидравлическими мешалками; ёмкость из-под гербицида несколько раз ополаскивают, сливая
    смыв в бак. Значение pH воды — 4,5–6.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией; несовместим с пестицидами с pH выше 8,5. Не рекомендуется смешивать Квикстеп с гербицидами
    на основе бентазона, имазаквина и с удобрениями. На горохе Квикстеп и Гербитокс применяют раздельно.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Квикстеп → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +30 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Ограничений нет.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в санитарной зоне рыбохозяйственных
    водоёмов. Работы с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены
    (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10). Возможность скармливания скоту зелёной массы решают органы
    государственного ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - При аварии прекратить утечку и перелить препарат в плотно закрывающиеся промаркированные контейнеры.
    Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    собирают в контейнеры для обезвреживания; участок в помещении промывают водой с мылом или содой (200
    г соды на ведро воды), участок земли перекапывают. Обезвреживание и утилизация остатков — по СанПиН
    1.2.2584-10. Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Действующие вещества нестойки в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    3–4 часов. Обязательно предварительное оповещение местных пчеловодов о препарате, сроках и зонах применения.
  - Запрещено применение в санитарной зоне рыбохозяйственных водоёмов.
mechanism:
- key: mech
  title: Как работают клетодим и галоксифоп-П-метил
  paras:
  - Клетодим относится к циклогександионоксимам, галоксифоп-П-метил — к производным арилоксифеноксипропионовых
    кислот. Оба системных вещества подавляют биосинтез жирных кислот, ингибируя ацетил-КоА-карбоксилазу.
  - Галоксифоп-П-метил поступает в растение через листья и корни, превращается в галоксифоп-П, перемещается
    в меристемы и подавляет их рост. Клетодим быстро поглощается и перемещается из обработанных листьев
    в корневую систему и точки роста сорняков.
  - Препарат действует на сорняки, которые есть в посеве в момент обработки; через почву он не проникает
    и на сорняки, появившиеся после опрыскивания, не влияет.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Симптомы появляются в первые дни после обработки, затем сорняки погибают — скорость зависит от вида,
    фазы и погоды.
  - 'Симптомы: остановка роста и развития, хлороз, покраснение центральных жилок листьев, некрозы; затем
    листья приобретают антоциановый оттенок, сорняки увядают и засыхают.'
  - Если нет второй «волны» сорняков, эффект, как правило, сохраняется весь вегетационный период.
- key: spectrum
  title: Спектр действия
  paras:
  - Лисохвост полевой (мышехвостниковидный), метлица обыкновенная, мятлик однолетний, овсюг (овёс пустой),
    овсюг волосистолистный (южный), просо куриное (ежовник обыкновенный), виды проса, пырей ползучий, росичка
    кроваво-красная, щетинник сизый, щетинник зелёный.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых злаковых сорняков, препарат желательно чередовать с гербицидами
    других химических групп.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При первых признаках отравления
  text: ' — прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду
    и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться за медицинской
    помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, антидот неизвестен. При необходимости — консультация
    ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая Сухаревская
    площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
