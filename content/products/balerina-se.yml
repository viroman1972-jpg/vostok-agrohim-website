resistant_weeds_note: подмаренник цепкий, ромашка, осот, бодяк, молочай лозный.
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочий раствор готовят непосредственно перед опрыскиванием. Отмеряют требуемое количество препарата
    на одну заправку опрыскивателя и вводят его прямо в бак при работающей гидравлической мешалке; бак
    при этом должен быть заполнен водой не менее чем наполовину.
  - 'Если требуется маточный раствор, его концентрация не должна превышать 15 % — например, 1,5 л препарата
    на 7,5 л воды в десятилитровой ёмкости. Готовый маточный раствор нельзя держать дольше 5–10 минут:
    сразу после перемешивания его добавляют в заполненный водой бак опрыскивателя и перемешивают до однородной
    суспоэмульсии. Ёмкость из-под гербицида несколько раз ополаскивают водой, сливая смыв в бак.'
  - 'Значение pH воды для приготовления раствора: 5,5–6,5. Температурный режим при обработке — от 5 до
    25 °С, оптимально 8–25 °С. Не рекомендуется обрабатывать в дни, когда прогнозируются ночные заморозки
    и сразу после них.'
  - Приготовление раствора и заправку опрыскивателя проводят на специальных площадках с последующим обеззараживанием.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Можно комбинировать с гербицидами Бомба, Кантата и Магнум, фунгицидом Бенорад, инсектицидом
    Брейк, а также с мочевиной. Препарат несовместим с сульфатом аммония.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением
    баковой смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → Балерина
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после полного
    растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −10 до +35 °C. Не допускать замерзания препарата при хранении.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Балерина не обладает последействием — её можно применять во всех типах севооборотов без ограничений.
  - Запрещается применять гербицид на зерновых с подсевом бобовых культур. В случае пересева использовать
    только злаки. Не допускать сноса препарата на поля, занятые широколистными культурами.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и
    комбикормами категорически запрещены.
  - Работы с препаратом проводят только специалисты по защите растений или лица, прошедшие специальную
    подготовку, обязательно со средствами индивидуальной защиты органов дыхания, зрения и кожи. Запрещено
    применение в личных подсобных хозяйствах, авиационным способом и в санитарной зоне рыбохозяйственных
    водоёмов.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 4 дня.
  - Разлитый препарат засыпают сорбентом (песок, опилки, земля), загрязнённый сорбент и почву обезвреживают
    10 % раствором кальцинированной соды или 7 % кашицей хлорной извести, собирают в промаркированные
    контейнеры и удаляют в места, согласованные с природоохранными органами. Загрязнённую землю перекапывают
    на глубину штыка лопаты. Запрещается сливать препарат в канализацию и любые водоёмы.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.1077-01.
- key: eco
  title: Охрана окружающей среды
  paras:
  - 2,4-Д кислота нестойка или среднестойка, флорасулам нестойк в почве. Оба вещества слаботоксичны или
    практически нетоксичны для млекопитающих, птиц, дождевых червей и почвенных микроорганизмов.
  - 'Класс опасности для пчёл — 3 (малоопасный). Меры безопасности при обработке: проводить обработку
    в утреннее или вечернее время при скорости ветра до 4–5 м/с; погранично-защитная зона для пчёл — не
    менее 2–3 км; ограничение лёта пчёл — 3–4 часа; обязательное предварительное оповещение местных пчеловодов
    за 4–5 суток о сроках и зонах применения.'
  - Запрещается применение препарата в санитарной зоне рыбохозяйственных водоёмов.
mechanism:
- key: mech
  title: Как работает 2,4-Д + флорасулам
  paras:
  - Балерина сочетает два действующих вещества из разных химических классов с разным механизмом действия.
    2,4-Д (2-этилгексиловый эфир) — синтетический ауксин из группы феноксикарбоновых кислот; проникает через
    листья, распространяется по растению и вызывает нарушение роста двудольных сорняков. Флорасулам —
    представитель пиримидинов, ингибитор фермента ALS; блокирует синтез аминокислот в тканях сорных растений.
  - 'Сочетание двух ДВ из разных классов повышает эффективность против устойчивых к 2,4-Д и МЦПА сорняков
    и снижает риск возникновения резистентности. Симптомы поражения: скручивание и хлороз листьев, эпинастия,
    замедление роста, гибель через 2–3 недели после обработки.'
  - Балерина не имеет последействия — применима во всех типах севооборотов; на культурных злаках проявляет
    высокую избирательность при соблюдении регламентов применения.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост обработанных препаратом сорняков прекращается через сутки после опрыскивания.
  - Видимые признаки действия — обесцвечивание и скручивание листьев, сокращение междоузлий — проявляются
    через 3–4 дня. Окончательная гибель сорняков происходит через 2–3 недели после обработки.
  - 'Период защитного действия: гербицид обеспечивает защиту посевов от момента обработки до появления
    новой «волны» сорняков.'
- key: spectrum
  title: Спектр действия
  paras:
  - 'Чувствительны: амброзия полыннолистная, василёк синий, горчица (виды), дымянка лекарственная, мак
    (виды), осот (виды), подмаренник цепкий (до 5 мутовок или до 0,2 м), подсолнечник (падалица), рапс
    (падалица), редька дикая, сурепица, ярутка полевая и др.'
  - 'Среднечувствительны: бодяк (виды), ромашка (виды), конопля сорная, льнянка обыкновенная, пикульник
    (виды), полынь обыкновенная и др.'
  - 'Слабочувствительны: вероника (виды), яснотка (виды), вьюнок полевой, молочай (виды), паслён чёрный,
    фиалка полевая, хвощ (виды) и др.'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Рекомендуется чередовать использование препарата с гербицидами из других химических классов и с различным
    механизмом действия.
  - Комбинация 2,4-Д и флорасулама в составе Балерины сама по себе снижает риск резистентности — два разных
    химических класса ДВ воздействуют на сорняки параллельно.
first_aid:
- lead: При случайном проглатывании
  text: ' — немедленно дать пострадавшему выпить несколько стаканов тёплой воды с активированным углём
    (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки глотки вызвать рвоту.
    Повторить несколько раз для более полного удаления препарата из организма.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания кожи, затем
    обмыть загрязнённый участок большим количеством воды с мылом.'
- lead: При попадании в глаза
  text: ' — тотчас промыть глаза при разомкнутых веках мягкой струёй чистой проточной воды.'
- lead: ''
  text: Лиц, подвергшихся воздействию токсического агента, нужно немедленно отстранить от работы, вывести
    из зоны загрязнения и обратиться за медицинской помощью. После оказания первой помощи необходимо обратиться
    к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
