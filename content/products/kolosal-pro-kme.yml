  reentry: 3 дня (для ручных работ — 7 дней)
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Маточный раствор не требуется. Рабочий раствор готовят непосредственно перед применением. Бак опрыскивателя
    наполовину заполняют водой и при непрерывном перемешивании вливают препарат на одну заправку, затем
    доводят бак водой до полного объёма, продолжая перемешивание. Перемешивание продолжают и во время
    обработки.
  - Весь рабочий раствор используют в день приготовления. Значение pH воды для приготовления рабочего
    раствора — 5–7.
  - Опрыскивание рекомендуется проводить на ранней стадии развития болезней, при появлении первых признаков.
    В рабочий раствор рекомендуется добавлять адъювант Аллюр.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией, — в частности, с инсектицидами Борей и Борей Нео и с ПАВ Адью.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Колосаль Про → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре, особенно при смешивании
    с микроэлементами.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −15 до +35 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - В связи с тератогенной активностью тебуконазола и стойкостью в почве работы с препаратом проводят только
    специалисты по защите растений или лица, прошедшие специальную подготовку, обязательно со средствами
    индивидуальной защиты органов дыхания, зрения и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.1077-01). Запрещено
    применение в личных подсобных хозяйствах, авиационным способом и в санитарной зоне рыбохозяйственных
    водоёмов.
  - Рабочий раствор готовят и заправляют опрыскиватель на специальных площадках, удалённых от жилья, скотных
    дворов, источников водоснабжения, мест хранения фуража и посевов продовольственных культур не менее
    чем на 200 м.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для ручных
    — 7 дней.
  - Пролитый препарат засыпают негорючим сорбентом (песок, земля, опилки) до полного впитывания, сорбент
    собирают в контейнеры и вывозят на обезвреживание в места, согласованные с природоохранными органами.
    Участок промывают водой с мылом или содой и перекапывают.
  - Тару трижды ополаскивают, смывы выливают в бак с рабочим раствором; тару обезвреживают 3–5 % раствором
    кальцинированной соды. Вторичное использование тары не допускается. Запрещается сливать препарат на
    землю, в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят в утренние и вечерние часы, днём —
    в пасмурную прохладную погоду, когда пчёлы не вылетают из улья, при скорости ветра не более 4–5 м/с;
    погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее 5–6 часов.
  - Обязательно предварительное оповещение местных пчеловодов (за 4–5 суток) о препарате, сроках и зонах
    его применения.
  - Применение в санитарной зоне рыбохозяйственных водоёмов запрещено.
mechanism:
- key: mech
  title: Как работают пропиконазол и тебуконазол
  paras:
  - 'Оба действующих вещества относятся к триазолам — ингибиторам деметилирования (DMI): подавляют фермент
    деметилазу, участвующий в биосинтезе стеролов у чувствительных грибов. В результате нарушается
    строение клеточных мембран возбудителя, рост мицелия прекращается.'
  - Вещества дополняют друг друга по спектру. Тебуконазол обладает профилактическим и лечащим системным
    действием, особенно против ржавчин, альтернариоза и фузариоза. Пропиконазол оказывает профилактическое,
    лечащее и искореняющее действие, подавляет спорообразование и сдерживает развитие мучнистой росы.
  - Действующие вещества быстро поглощаются вегетативными частями растений и передвигаются по ксилеме
    снизу вверх — по стеблю к колосу и от основания листа к верхушке.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат проникает в растение через листья и стебли в первые часы после обработки, равномерно распределяется
    по тканям, препятствует проникновению возбудителей и останавливает уже начавшееся заражение.
  - По данным производителя, Колосаль Про обеспечивает длительный период защитного действия и устойчив
    к смыванию дождём. Препаративная форма — концентрат микроэмульсии, мелкие частицы рабочего раствора
    облегчают проникновение действующих веществ в растение.
- key: spectrum
  title: Спектр действия
  paras:
  - Мучнистая роса, ржавчины, септориоз, пиренофороз, пятнистости листьев, ринхоспориоз, церкоспороз,
    фомоз, альтернариоз, аскохитоз, антракноз, белая и серая гнили, оидиум винограда и другие заболевания,
    указанные в регламенте применения для каждой культуры.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Оба действующих вещества относятся к одной группе — ингибиторам деметилирования (DMI). При нескольких
    обработках за сезон желательно чередовать препарат с фунгицидами других групп.
  - Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды с активированным
    углём (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки глотки вызвать
    рвоту. Повторить несколько раз до полного удаления препарата из организма.'
- lead: При попадании на кожу
  text: ' — удалить препарат с кожи куском ткани или ваты, не втирая, а затем обмыть загрязнённый участок
    проточной водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — немедленно промыть глаза чистой проточной водой при разомкнутых веках.'
- lead: При первых признаках отравления
  text: ' — немедленно отстранить пострадавшего от работы и вывести из зоны воздействия пестицида; осторожно
    снять с него одежду и средства индивидуальной защиты, избегая попадания препарата на кожу или органы
    дыхания.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
