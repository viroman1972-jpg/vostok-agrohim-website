procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Протравливание проводят заблаговременно или непосредственно перед посевом. Перед применением препарат
    тщательно перемешивают в канистре. Посевной материал должен быть очищен и откалиброван — примеси (пыль,
    растительные остатки, повреждённые семена) снижают действие препарата.
  - 'Для обработки 1 т семян готовят рабочий раствор: 0,2–0,25 л препарата и 9,8–9,75 л воды. Бак заполняют
    водой на треть, требуемое количество препарата размешивают в отдельной ёмкости с небольшим количеством
    воды, выливают маточный раствор в бак и доливают воду до нужного объёма.'
  - Мешалку включают до начала работы протравителя, в процессе обработки раствор продолжают перемешивать;
    при остановках машины не оставляют его надолго без перемешивания. Рабочий раствор используют не позднее
    суток.
  - Для равномерного покрытия семян контролируют количество посевного материала, проходящего через протравочную
    камеру, и количество подаваемого рабочего раствора.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с большинством фунгицидов и инсектицидов, используемых для предпосевной обработки
    семян. В каждом случае рекомендуется предварительно проверить смешиваемые компоненты на химическую совместимость.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в неповреждённой заводской таре с тарной этикеткой, в специально предназначенных складах
    отдельно от других пестицидов, с защитой от прямых солнечных лучей, влаги, загрязнения и механических
    повреждений. Хранение совместно с пищевыми продуктами и фуражом не допускается.'
  - 'Температурный режим: от −10 до +30 °C.'
  - 'Срок хранения: 2 года от даты изготовления.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — по ГОСТ 14189-81 всеми видами транспорта в соответствии с правилами перевозки на каждом
    виде транспорта. Совместная перевозка и хранение с кормами и пищевыми продуктами, а также перевозка людей
    вместе с препаратом не допускаются.
  - В связи с тератогенным действием и стойкостью в почве с препаратом работают только специалисты по защите
    растений или лица, прошедшие специальную профессиональную подготовку, обязательно в средствах индивидуальной
    защиты органов дыхания, глаз и кожи (СП 2.2.3670-20, СанПиН 1.2.3685-21). Семена протравливают только
    на централизованных пунктах при полной механизации процесса, эффективной вентиляции и обезвреживании сточных
    вод.
  - Пролитый препарат засыпают сорбентом, песком, опилками или землёй; загрязнённый сорбент и почву обезвреживают
    10 % раствором кальцинированной соды или 7 % кашицей хлорной извести и собирают в промаркированные контейнеры.
  - Тару 3–4 раза промывают водой (промывную воду используют для приготовления рабочего раствора), обрабатывают
    раствором хлорной извести, приводят в непригодное для повторного использования состояние и направляют
    на сжигание или захоронение в местах, согласованных с органами санитарно-эпидемиологического контроля.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Применение в водоохранной зоне водных объектов запрещено.
  - Применение в личном подсобном хозяйстве и авиаобработки запрещены.
mechanism:
- key: mech
  title: Как работает тебуконазол
  paras:
  - Тебуконазол относится к триазолам и действует системно. Он нарушает синтез эргостерола в мембранах клеток
    гриба — клеточные стенки возбудителя теряют свои свойства, и он погибает.
  - Препарат проникает в растение при прорастании зерна и распространяется по нему по мере роста, обладая
    защитным и лечащим действием.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Фунгицидное действие начинается вскоре после попадания семени во влажную почву. До фазы кущения препарат
    защищает растения и от болезней листьев. Продолжительность защиты зависит от интенсивности развития болезней
    и погодных условий.
- key: spectrum
  title: Спектр действия
  paras:
  - Головнёвые заболевания, фузариозная и гельминтоспориозная корневые гнили, снежная плесень, плесневение
    семян, а также септориоз и пятнистости листьев на ранних этапах развития — на культурах, указанных в регламенте
    применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Известны случаи формирования устойчивых популяций возбудителей; при соблюдении регламентов риск оценивается
    производителем как средний. Протравители желательно чередовать по химическим классам. Ориентироваться
    только на разные торговые названия недостаточно — разные препараты могут содержать действующие вещества
    одной и той же группы.
first_aid:
- lead: При попадании на кожу
  text: ' — аккуратно, не втирая, удалить препарат куском ткани или ватой, тщательно вымыть кожу большим количеством
    чистой проточной воды с мылом.'
- lead: При попадании в глаза
  text: ' — тщательно промыть большим количеством чистой проточной воды при разомкнутых веках.'
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить 1–2 стакана воды со взвесью энтеросорбента
    (активированный уголь, «Энтерумин», «Полисорб» и др.) в соответствии с рекомендациями по их применению,
    а затем раздражением корня языка вызвать рвоту; повторить несколько раз для более полного удаления препарата,
    после чего вновь выпить 1–2 стакана воды со взвесью сорбента и немедленно обратиться к врачу.'
- lead: При вдыхании препарата
  text: ' — вывести пострадавшего на свежий воздух, при необходимости сделать искусственное дыхание, обратиться
    к врачу.'
- lead: ''
  text: В местах работы с препаратом должна быть аптечка первой помощи. Во всех случаях отравления после
    оказания первой помощи следует обратиться к врачу.
- lead: ''
  text: 'Информация для врача: специфический антидот отсутствует, лечение симптоматическое. При необходимости
