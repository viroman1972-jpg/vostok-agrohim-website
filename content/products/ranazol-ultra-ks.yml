# Источники: регламент — госреестр (agroxxi v176, ranazol-ultra-ks-2; регистрант ООО «Ярило», производитель АФД
# Кемикалс); описание, применение, первая помощь, транспортировка, охрана среды — сайт ООО «Гарант Оптима»
# (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/ranazol_ultra/, 26.10.2026); срок хранения — госреестр
# (ПИ10; у Гарант Оптимы — 3 года). Сроки протравливания у Гарант Оптимы противоречат друг другу («за 2–3 дня»
# и «за 7–14 дней до посева») — оставлено «заблаговременно или непосредственно перед посевом». В регламенте у овса
# дважды «плесневение семян» — повтор убран. Не перенесено: «безопасен для наземных организмов», «практически
# безопасен для водных организмов» (ДЗ04), период защитного действия в днях, перечень марок протравочных машин. ПИ12.
