# Источник: инструкция АО Фирма «Август» (avgust.com/products/rf/soylent/, 27.10.2026). В справочнике
# пестицидов agroxxi препарата нет (кондиционер воды), поэтому таблицы регламента нет. Первой помощи,
# транспортировки и охраны среды на avgust.com нет — блоки пустые (этикетки не запрашиваем).
# Из списка препаратов-партнёров Августа названы только препараты нашего ассортимента, не более трёх на группу;
# Кумир (вне ассортимента) не назван. ПИ12.
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Соли кальция, магния, железа и некоторых других металлов, растворённые в воде, могут заметно снижать
    эффективность ряда пестицидов. Если для рабочего раствора используется жёсткая, гидрокарбонатная или
    щелочная (pH выше 7) вода, перед заправкой препаратов в воду добавляют Сойлент.
  - В первую очередь это касается препаратов на основе слабых органических кислот и их солей — 2,4-Д,
    аминопиралида, бентазона, глифосата, глюфосината, дикамбы, имазамокса, имазетапира, квинмерака, клетодима,
    клопиралида, МЦПА, пиклорама и других. Сойлент также предотвращает быстрый щелочной гидролиз препаратов
    на основе десмедифама, фенмедифама, диметоата, индоксакарба и малатиона в воде с pH выше 7.
  - 'Подбор дозировки: налить ровно 1 л свежей воды в прозрачную ёмкость; набрать несколько миллилитров
    Сойлента в мерную пипетку (входит в комплект) или шприц; добавлять порциями по 5–10 капель, перемешивая
    после каждой порции; когда окраска раствора перейдёт от цвета чайной розы к характерному красному,
    прекратить. Для пересчёта: 1 мл Сойлента на 1 л воды соответствует 1 л кондиционера на 1 т рабочего
    раствора.'
  - Сойлент добавляют в рабочий раствор в первую очередь. Интенсивность окраски может меняться в зависимости
    от свойств воды, количества препарата, освещённости и формы ёмкости.
  - Кондиционер рекомендуется также при низкой влажности воздуха, ветреной погоде, обработке запылённых
    растений, долгом отсутствии осадков, низких нормах расхода гербицидов и высоких — рабочего раствора.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - По данным производителя, Сойлент рекомендуется при приготовлении растворов гербицидов сплошного действия
    Торнадо 500 и Торнадо 540, гербицидов против двудольных сорняков Галион, Хакер 300 и Балерина Форте,
    противозлакового гербицида Квикстеп, а также инсектицидов Алиот и Сирокко. С другими пестицидами его
    можно применять как увлажнитель, но это не обязательно.
  - При использовании Сойлента с конкретным препаратом или баковой смесью следует убедиться в их совместимости.
    С агрохимикатами и удобрениями учитывают возможное взаимодействие — некоторые микроудобрения (с железом,
    кальцием, кобальтом, магнием, марганцем, медью, молибденом, цинком), а также препараты со щелочной
    реакцией могут быть антагонистами Сойлента и перечисленных гербицидов.
  - Не применять Сойлент совместно с фунгицидами на основе солей меди.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л, в комплекте 2 мерные пипетки.'
  - 'Условия хранения: в крытых сухих вентилируемых складских помещениях, специально предназначенных для
    этой цели, в герметично закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −5 до +30 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения в невскрытой заводской
    упаковке.'
mechanism:
- key: mech
  title: Как работает Сойлент
  paras:
  - Сойлент — кондиционер воды на основе ортофосфорной кислоты с поверхностно-активным веществом и индикаторным
    красителем.
  - Ортофосфорная кислота связывает растворённые в воде соли кальция, магния, железа и других металлов и
    не даёт им образовать малорастворимые соединения с действующими веществами препаратов. Кондиционер
    также снижает pH щелочной воды, что повышает эффективность ряда препаратов, а поверхностно-активное
    вещество усиливает их проникающую способность.
  - Краситель-индикатор меняет цвет раствора, поэтому дозировку легко подобрать под конкретную воду.
