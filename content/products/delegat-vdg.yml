# Источники: регламент — госреестр (agroxxi v176, delegat-vdg-2); описание и рекомендации — сайт ООО «Гарант
# Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/delegat/, 27.10.2026); срок хранения — госреестр
# (ПИ10). По госреестру: запрет применения в водоохранной зоне; выход для ручных работ не указан (у Гарант
# Оптимы — 3 дня). Не перенесены: «преимущества» (дождь через 3 часа, работа от +5 °C, «низкая химическая
# нагрузка», «удобная формуляция»), сроки в часах и днях из описания действия (ПИ12). Первой помощи, условий
# хранения и транспортировки у Гарант Оптимы нет — блоки пустые (этикетки не запрашиваем). ПИ12.
regulation:
- rate: '0,008–0,01'
  crop: 'Пшеница яровая, ячмень яровой'
  object: 'Однолетние, в том числе устойчивые к 2,4-Д, и некоторые многолетние двудольные сорняки'
  method: 'Опрыскивание посевов в ранние фазы роста однолетних сорняков (2–4 листа) и в фазе розетки многолетних
    двудольных (с фазы 2 листьев до конца кущения культуры)'
  wait: '57 (1)'
- rate: '0,008–0,01'
  crop: 'Лён-долгунец'
  object: 'Однолетние, в том числе устойчивые к МЦПА, и некоторые многолетние двудольные сорняки'
  method: 'Опрыскивание посевов в фазе «ёлочки» при высоте культуры 3–10 см'
  wait: '— (1)'
regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Применение
  paras:
  - Препарат вносят наземным опрыскиванием. Лучший результат — на ранних стадиях роста сорняков (однолетние
    двудольные — в фазе 2–4 настоящих листьев, многолетние — в фазе розетки). Максимальная доза за год —
    не более 10 г/га. Неблагоприятная погода замедляет действие препарата.
  - Не рекомендуется применять препарат на посевах, находящихся в стрессе (засуха, холод и т. п.).
  - Опрыскиватель после работы тщательно очищают — даже небольшое количество препарата может повредить
    чувствительные культуры. Бак, штанги и шланги промывают чистой водой и 1 % раствором бытового аммиака.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с большинством пестицидов и агрохимикатов; в каждом отдельном случае компоненты
    проверяют на совместимость.
  - На полях, обработанных препаратом, не применяют фосфорорганические инсектициды и инсектициды группы
    малатиона.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: банки 0,5 кг.'
  - 'Срок хранения: 2 года.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - При пересеве обработанных площадей можно сеять только яровые зерновые. На следующий год после уборки
    зерновых нельзя сеять свёклу и овощи; подсолнечник и гречиху — только после глубокой вспашки.
  - Подсолнечник и гречиху нельзя сеять на следующий год, если pH почвы выше 7,5 или если в период от
    применения препарата до посева была продолжительная засуха.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Запрещено применение в водоохранной зоне водных объектов.
mechanism:
- key: mech
  title: Как работает метсульфурон-метил
  paras:
  - Метсульфурон-метил относится к сульфонилмочевинам. Он проникает в сорняки через листья и корни и блокирует
    деление клеток — рост сорняков останавливается вскоре после обработки.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Видимые симптомы появляются через несколько дней, затем сорняки полностью погибают. Неблагоприятная
    для роста растений погода замедляет действие препарата.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние двудольные сорняки, в том числе устойчивые к 2,4-Д и МЦПА, и некоторые многолетние двудольные
    — на яровой пшенице, яровом ячмене и льне-долгунце.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
