# Кемикалс); описание и применение — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/
# kontador_maksi/, 26.10.2026); срок хранения — госреестр (ПИ10). Не перенесено: «полностью защитить всходы»
# (ДЗ04), долгоносики на подсолнечнике и блошки на кукурузе (нет в регламенте), «мировой опыт» (незарегистрированные
# культуры), «погибает в течение суток». Первой помощи, транспортировки и охраны среды у регистранта и Гарант Оптимы
# нет — ждут этикетки. ПИ12.
