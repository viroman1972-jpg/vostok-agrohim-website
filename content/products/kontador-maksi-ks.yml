procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Перед применением препарат тщательно перемешивают в канистре. Обрабатывают только кондиционные семена,
    откалиброванные и очищенные от примесей (пыль, битое зерно, растительные остатки, семена сорняков).
  - Обработку проводят заблаговременно или непосредственно перед посевом. При заблаговременном протравливании
    влажность семян должна быть на 1–2 % ниже стандартной для кондиционных семян, чтобы избежать самосогревания
    при хранении и снижения всхожести. Хранение протравленных семян дольше 6 месяцев повышает риск снижения
    их посевных качеств.
  - В процессе протравливания контролируют количество семян, проходящих через машину, и количество рабочего
    раствора, подаваемого в протравочную камеру, — семена должны быть покрыты равномерно. При высокой численности
    вредителей применяют максимальные нормы расхода.
  - Вегетативную массу растений, выращенных из обработанных семян, не скармливают сельскохозяйственным животным
    в течение 45 дней после посева.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с большинством фунгицидных протравителей, микроудобрений и стимуляторов роста, не
    имеющих сильнощелочной или сильнокислой реакции.
  - В каждом конкретном случае необходимо проверять смешиваемые компоненты на совместимость.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Срок хранения: 2 года.'
mechanism:
- key: mech
  title: Как работает имидаклоприд
  paras:
  - Имидаклоприд относится к неоникотиноидам, обладает системным, контактным и кишечным действием. Он блокирует
    рецепторы нервных клеток насекомых и прекращает передачу нервных импульсов.
  - Действующее вещество поглощается проростками во время прорастания семян и равномерно распространяется
    по органам растения, поэтому всходы защищены от сосущих и грызущих вредителей.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Вредитель теряет способность двигаться, перестаёт питаться и погибает. Продолжительность защиты зависит
    от погоды, скорости роста растений, численности и видового состава вредителей.
- key: spectrum
  title: Спектр действия
  paras:
  - Почвообитающие и наземные вредители всходов — проволочники и ложнопроволочники, хлебная жужелица, внутристеблевые
    мухи, хлебные и крестоцветные блошки — на культурах, указанных в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы снизить риск резистентности, инсектициды с разными механизмами действия желательно чередовать.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать действующие
    вещества одной и той же группы.
