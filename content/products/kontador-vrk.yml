# Источники: регламент — госреестр (agroxxi v176, kontador-vrk-2; регистрант ООО «Ярило»); описание — сайт
# ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/kontador/, 25.10.2026); срок хранения
# — госреестр (ПИ10). Первой помощи, условий хранения, транспортировки и охраны среды у регистранта и Гарант
# Оптимы нет — ждут этикетки. ПИ12.
regulation:
- rate: '0,1–0,15'
  crop: 'Пшеница яровая и озимая'
  object: 'Клоп вредная черепашка'
  method: 'Опрыскивание посевов в период вегетации. Расход рабочей жидкости — 200–400 л/га'
  wait: '20 (1)'
- rate: '0,2–0,25'
  crop: 'Пшеница озимая'
  object: 'Хлебная жужелица'
  method: 'Обработка всходов. Расход рабочей жидкости — 100–200 л/га'
  wait: '60 (1)'
- rate: '0,1'
  crop: 'Картофель'
  object: 'Колорадский жук'
  method: 'Опрыскивание посевов в период вегетации. Расход рабочей жидкости — 200–400 л/га'
  wait: '20 (1)'
regulation_notes:
  reentry: 3 дня
procedures:
- key: prep
  title: Применение
  paras:
  - Посевы обрабатывают наземным опрыскиванием при достижении экономического порога вредоносности.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с большинством пестицидов, за исключением сильнощелочных. В каждом конкретном случае
    перед применением необходимо проверять компоненты на химическую и биологическую совместимость.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Срок хранения: 2 года.'
mechanism:
- key: mech
  title: Как работает имидаклоприд
  paras:
  - Имидаклоприд относится к неоникотиноидам, обладает системным, контактным и кишечным действием. Он блокирует
    никотиновые ацетилхолиновые рецепторы и подавляет передачу сигналов в нервной системе вредителей.
  - Благодаря системному действию препарат поражает и скрытно живущих вредителей. Он действует как на
    взрослых насекомых, так и на личинок разных возрастов.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Вредители быстро теряют подвижность, прекращают питаться и затем гибнут. Продолжительность защитного
    действия зависит от погоды и вида вредителя.
- key: spectrum
  title: Спектр действия
  paras:
  - Сосущие и грызущие вредители — клоп вредная черепашка, хлебная жужелица, колорадский жук — на культурах,
    указанных в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - При нескольких обработках за сезон желательно чередовать инсектициды с разными механизмами действия.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
