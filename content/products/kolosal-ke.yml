regulation_notes:
  reentry: 3 дня (для ручных работ — 6 дней)
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочую жидкость готовят непосредственно перед применением. Препарат перемешивают в заводской упаковке,
    отмеряют количество на одну заправку, бак опрыскивателя наполовину заполняют водой и при непрерывном
    перемешивании вливают препарат, затем доводят бак водой до полного объёма. Перемешивание продолжают
    во время обработки.
  - При работе с баком-смесителем препарат не смешивают с водой в смесителе, а подают в неразбавленном
    виде в наполовину заполненный водой бак опрыскивателя. Колосаль всегда добавляют в воду, а не наоборот.
  - Рабочую жидкость используют в тот же день. Значение pH воды для приготовления рабочего раствора — 5–7.
    В рабочий раствор рекомендуется добавлять адъювант Аллюр.
  - Для защиты пшеницы от фузариоза колоса обработку проводят в начале цветения, когда пыльники видны на
    25–50 % колосьев (обычно через 1–4 дня после полного выхода большинства колосков), если обработку можно
    завершить за 1–2 дня; в крупных хозяйствах начинают, когда колошение наблюдается на 80 % главных стеблей.
  - На озимом рапсе Колосаль применяют осенью в фазе 4–6 листьев (рост перед уходом в зиму и защита от фомоза)
    и весной в начале вытягивания стеблей; на яровом рапсе — в начале вытягивания стеблей.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Колосаль → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −10 до +40 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Работы с препаратом проводят только специалисты по защите растений или под их контролем, или лица,
    прошедшие специальную подготовку, обязательно со средствами индивидуальной защиты органов дыхания, зрения
    и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня, для ручных
    — 6 дней.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.2584-10. Не допускается
    загрязнение водоёмов препаратом или использованной тарой; запрещается сливать препарат в канализацию
    и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат стоек в почве (2 класс опасности по стойкости).
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят в утренние и вечерние часы, днём — в
    пасмурную прохладную погоду, когда пчёлы не вылетают из улья, при скорости ветра не более 4–5 м/с; погранично-защитная
    зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее 7–8 часов. Обязательно предварительное
    оповещение местных пчеловодов о препарате, сроках и зонах применения.
  - Рыбохозяйственная оценка — 3 класс опасности; не допускать попадания препарата в рыбохозяйственные
    водоёмы.
mechanism:
- key: mech
  title: Как работает тебуконазол
  paras:
  - 'Тебуконазол относится к триазолам — ингибиторам деметилирования (DMI): подавляет биосинтез стеролов
    в мембранах клеток возбудителей и нарушает их обмен веществ.'
  - Препарат проявляет профилактическое и лечебное системное действие. Он проникает в растение через листья
    и стебли и равномерно распространяется по сосудистой системе.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Колосаль проникает в растение в первые часы после обработки; уже вскоре после применения улучшается
    фитосанитарное состояние посевов. По данным производителя, препарат устойчив к смыванию дождём и обеспечивает
    длительный период защитного действия.
- key: spectrum
  title: Спектр действия
  paras:
  - Ржавчины, мучнистая роса, септориоз, пиренофороз, фузариоз колоса, пятнистости листьев, ринхоспориоз,
    оливковая плесень, пирикуляриоз риса, альтернариоз и фомоз рапса, оидиум винограда.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - По данным производителя, случаев резистентности к препарату не выявлено. Чтобы предотвратить её появление,
    Колосаль чередуют с фунгицидами других химических классов. Ориентироваться только на разные торговые
    названия недостаточно — разные препараты могут содержать действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, выпить несколько стаканов воды со взвесью активированного угля (из расчёта
    1 г сорбента на 1 кг массы тела), вызвать рвоту раздражением задней стенки глотки; при необходимости
    повторить несколько раз, после чего выпить стакан воды с активированным углём и принять солевое слабительное
    (20 г сернокислой магнезии на полстакана воды).'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух, сменить загрязнённую одежду и вызвать врача.'
- lead: При попадании на кожу
  text: ' — немедленно смыть струёй воды или снять загрязнение ватой или куском ткани, осторожно, не втирая,
    затем тщательно промыть кожу водой с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно промывать глаза большим количеством проточной воды в течение 15 минут при открытых
    веках и обратиться к врачу.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
