procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Протравливать семена можно заблаговременно (до 1 года) или непосредственно перед посевом; заблаговременно
    обрабатывают только кондиционные семена при надлежащих условиях дальнейшего хранения. Рекомендуется
    использовать семена, очищенные от пыли и примесей, — это улучшает прилипаемость препарата. Качество
    обработки контролируют по интенсивности окраски семян.
  - Рабочую жидкость готовят непосредственно перед применением. Препарат перемешивают в заводской упаковке,
    смешивают с водой в отдельной ёмкости в соотношении 1:1. Бак протравочной машины на треть заполняют
    водой и при непрерывном перемешивании вливают маточный раствор; ёмкость из-под него ополаскивают, сливая
    смыв в бак. Затем доводят бак водой до полного объёма и перемешивают до однородной суспензии; перемешивание
    продолжают во время обработки.
  - Для приготовления рабочего раствора используют воду температурой не ниже 10 °C — холодная вода снижает
    диспергируемость препарата. Значение pH воды — 5–7. Рабочую жидкость используют в тот же день.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Виал ТрасТ совместим в баковых смесях с инсектицидными протравителями Табу и Табу Нео. Препарат совместим
    с различными пестицидами для обработки семян, кроме препаратов с сильнощелочной или сильнокислой реакцией.
  - 'Порядок добавления компонентов в бак протравочной машины: СП → Виал ТрасТ → СК (КС, ВСК) → СЭ → МЭ
    → ВРК (ВР). Каждый последующий компонент добавляется после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять смешиваемые компоненты на совместимость, а обработанные
    смесью семена перед посевом — на всхожесть.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −20 до +35 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - В связи с тератогенным действием тебуконазола работы с препаратом проводят только лица, прошедшие специальную
    подготовку, обязательно со средствами индивидуальной защиты органов дыхания, зрения и кожи (ГОСТ 12.3.041-86,
    СанПиН 1.2.1077-01). Запрещено применение в личных подсобных хозяйствах.
  - Протравливание проводят только на централизованных пунктах протравливания при полной механизации процесса,
    эффективной вентиляции, герметичности оборудования, автоматизации и дистанционном управлении.
  - Пролитый препарат засыпают негорючим сорбентом (песок, земля, опилки) до полного впитывания; сорбент
    собирают в контейнеры и обезвреживают или вывозят в места, согласованные с природоохранными органами.
    Загрязнённый участок промывают водой с мылом или содой и перекапывают.
  - Тару обезвреживают 3–5 % раствором кальцинированной соды с последующей многократной промывкой водой.
    Вторичное использование тары не допускается. Запрещается сливать препарат на землю, в канализацию и
    любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат — протравитель семян, оценка токсичности для пчёл не требуется.
  - Применение в санитарной зоне рыбохозяйственных водоёмов запрещено.
mechanism:
- key: mech
  title: Как работают тиабендазол и тебуконазол
  paras:
  - 'Препарат сочетает два действующих вещества с разными механизмами действия. Тебуконазол относится к
    триазолам: подавляет биосинтез эргостерина в мембранах клеток грибов и препятствует развитию наружной
    и внутренней инфекции семян. Тиабендазол относится к бензимидазолам: нарушает деление ядер клеток возбудителя.'
  - Тебуконазол растворим и подвижен, обладает профилактическим и лечащим системным действием. Тиабендазол
    менее подвижен и усиливает действие против возбудителей корневых гнилей и снежной плесени, основная
    масса которых находится на растительных остатках в почве, поэтому препарат подходит для минимальной
    и нулевой обработки почвы и севооборотов, насыщенных зерновыми.
  - Проникая в зерновку и зародыш, препарат уничтожает головнёвую инфекцию, затем передвигается к точкам
    роста проростков. По данным производителя, антистрессовые компоненты препаративной формы снижают риск
    ретардантного действия триазолов в неблагоприятных условиях.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат начинает действовать в первые часы после высева протравленных семян в почву.
  - Против корневых гнилей и листостебельной инфекции Виал ТрасТ действует на начальных этапах роста растений;
    головнёвые болезни колоса подавляются обработкой семян. Препаративная форма образует на зерновке прочную
    окрашенную плёнку, которая после высыхания не осыпается и не пылит.
- key: spectrum
  title: Спектр действия
  paras:
  - Головнёвые заболевания (твёрдая, каменная, пыльная, ложная пыльная, стеблевая, покрытая), гельминтоспориозная
    и фузариозная корневые гнили, плесневение семян, фузариозная и тифулёзная снежная плесень, а также
    ранние бурая ржавчина и септориоз пшеницы.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Сочетание веществ с разными механизмами действия снижает риск резистентности; по данным производителя,
    случаев резистентности не выявлено. При планировании защиты всё же желательно чередовать препараты
    разных групп.
  - Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот чистой водой, немедленно дать выпить несколько стаканов тёплой воды со взвесью
    активированного угля (1 г сорбента на 1 кг массы тела) и вызвать рвоту раздражением задней стенки глотки,
    затем дать выпить несколько стаканов воды с активированным углём. Немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — немедленно вывести пострадавшего на свежий воздух, сменить загрязнённую одежду и вызвать врача.'
- lead: При попадании на кожу
  text: ' — немедленно смыть струёй воды или аккуратно снять препарат куском ваты и тщательно промыть кожу
    водой или слабым раствором питьевой соды.'
- lead: При попадании в глаза
  text: ' — немедленно промыть обильным количеством проточной воды и обратиться к врачу.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
