procedures:
- key: prep
  title: Применение
  paras:
  - Сорняки наиболее чувствительны к гербициду в период активного роста. Лучший результат — при обработке
    однолетних двудольных сорняков в фазе 2–6 листьев и многолетних корнеотпрысковых в фазе розетки. Подмаренник
    цепкий восприимчив к препарату до высоты 15–20 см, виды ромашки — до 20 см.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с большинством пестицидов и агрохимикатов; в каждом конкретном случае совместимость
    компонентов баковой смеси проверяют заранее.
  - Ламбаду нельзя применять в баковых смесях с противозлаковыми гербицидами для зерновых колосовых — в
    таких смесях они значительно ослабляют действие на злаковые сорняки.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л и 10 л.'
  - 'Срок хранения: 3 года.'
mechanism:
- key: mech
  title: Как работают 2,4-Д и флорасулам
  paras:
  - 2,4-Д (2-этилгексиловый эфир) относится к синтетическим ауксинам. Он проникает в сорняки через надземную
    массу, нарушает фотосинтез и вызывает аномальный рост клеток — ткани деформируются и разрываются.
  - Флорасулам относится к триазолопиримидинам. Он проникает через листья и частично через корни и подавляет
    фермент ацетолактатсинтазу, блокируя синтез важных аминокислот (лейцина, изолейцина, валина).
  - Действующие вещества с разными механизмами действия дополняют друг друга, поэтому препарат эффективен
    и против сорняков, устойчивых к 2,4-Д.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост сорняков останавливается вскоре после обработки. Затем при оптимальной погоде появляются увядание,
    скручивание и изменение окраски — обесцвечивание и хлороз жилок, потом некроз листа; после этого чувствительные
    сорняки погибают.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние и некоторые многолетние двудольные сорняки, в том числе устойчивые к 2,4-Д, — амброзия, подмаренник
    цепкий, паслён чёрный, осоты, виды ромашки, горцев, мари, крестоцветные сорняки, щирица и др.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Сочетание двух действующих веществ с разными механизмами действия снижает риск появления устойчивых
    сорняков. Чтобы предотвратить его, гербициды с разными механизмами действия также чередуют.
