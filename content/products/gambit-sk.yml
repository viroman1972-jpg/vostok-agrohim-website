  liquid_flow: 100–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Оптимальная температура применения — 10–20 °C; при длительном похолодании воздуха и почвы ниже 10 °C
    эффективность против отдельных видов может заметно снизиться. При опрыскивании до всходов почва должна
    быть хорошо подготовлена и увлажнена; при низкой влажности рекомендуется мелкая заделка препарата на
    глубину 2–3 см.
  - На тяжёлых почвах применяют максимальные нормы, на лёгких — минимальные; на торфяниках лучше обрабатывать
    по всходам сорняков. После внесения не рекомендуется рыхлить междурядья — это разрушает гербицидный
    «экран».
  - Рабочий раствор готовят непосредственно перед применением. Препарат перемешивают в заводской таре, бак
    наполовину заполняют чистой водой, включают мешалку, добавляют отмеренное количество препарата и доливают
    воду до полного объёма при перемешивании; ёмкость из-под препарата ополаскивают, сливая смыв в бак.
    Перемешивание продолжают во время обработки; раствор используют в течение нескольких часов. Значение
    pH воды — 6–7.
  - Раствор готовят на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → Гамбит → СК (ВСК)
    → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −5 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в водоохранных зонах водных
    объектов (минимальная ширина — 100 м). Работы проводят со средствами индивидуальной защиты органов
    дыхания, зрения и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10). Возможность скармливания обработанных
    культур животным решают органы государственного ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    собирают в контейнеры для обезвреживания; участок в помещении промывают водой с мылом или содой (200
    г соды на ведро воды), участок земли перекапывают. Утилизация остатков — по СанПиН 1.2.2584-10 и СанПиН
    1.2.1330-03.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат токсичен для водорослей — высокий риск для водных организмов.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    5–6 часов.
  - Запрещено применение в водоохранных зонах водных объектов, включая рыбохозяйственные водоёмы; минимальная
    ширина водоохранной зоны — 100 м.
mechanism:
- key: mech
  title: Как работает прометрин
  paras:
  - Прометрин относится к производным триазинов. Это системный гербицид, действующий через почву и частично
    через листья. Он поступает в растения в основном через корни и проростки, в меньшей степени через стебли
    и листья, перемещается по ксилеме к точкам роста и у чувствительных сорняков подавляет дыхание и фотосинтез.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Препарат уничтожает сорняки в момент прорастания или в течение нескольких дней при применении по всходам.
    Чем теплее, тем быстрее прометрин поступает в растения; при довсходовом внесении важна влажность почвы.
  - Почвенный «экран» сохраняет защитное действие длительное время — в зависимости от погоды.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Чувствительны: вероника (виды), галинсога мелкоцветковая, горчица полевая, гречишка вьюнковая, звездчатка
    средняя, осот огородный и шероховатый, паслён чёрный, пастушья сумка, пикульник обыкновенный, портулак
    огородный, редька дикая, ромашка непахучая, фиалка полевая, щирица запрокинутая, ярутка полевая и др.'
  - 'Среднечувствительны: просо куриное, канареечник (виды), метлица обыкновенная, щетинник (виды), амброзия
    полыннолистная, василёк синий, горец (виды), канатник Теофраста, марь белая.'
  - 'Слабочувствительны: овсюг, лисохвост (виды), ценхрус.'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться
    за медицинской помощью.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
