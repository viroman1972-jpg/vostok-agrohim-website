procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Эскудо применяют в смеси с адъювантом Адью (0,2 л/га). Сорняки чувствительны к препарату в ранние фазы
    роста. Эффективно дробное двукратное опрыскивание — первая обработка при не более 3 листьях у злаковых
    и до второй пары настоящих листьев у двудольных, вторая — по второй «волне». В засуху против злаковых
    используют 300 л/га рабочего раствора (Адью — 0,3 л/га). Против проса волосовидного в фазе 1–3 листьев
    норма — 25 г/га.
  - Оптимальная температура — 15–25 °C; не опрыскивать, если до и после обработки ожидается ниже 10 °C или
    выше 25 °C, по мокрым от росы или дождя растениям и по культуре в стрессе. Дождь через 2 часа после
    обработки на эффективность не влияет.
  - 'Рабочий раствор готовят непосредственно перед применением. Маточный раствор: ведро наполовину заполняют
    водой, при перемешивании добавляют препарат (не более 100 г на 10 л) и доливают воду до трёх четвертей
    объёма. Бак опрыскивателя наполовину заполняют водой, включают мешалку, вливают маточный раствор, добавляют
    Адью и доливают воду до полного объёма; ведро ополаскивают, сливая смыв в бак. Используют штанговые
    опрыскиватели со щелевыми распылителями.'
  - Значение pH воды — 6–7. Раствор готовят на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Не применять совместно с фосфорорганическими инсектицидами и не чередовать с ними, если между
    опрыскиваниями проходит менее 14 дней, — опасность фитотоксичности.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → Эскудо → ВДГ (СТС) → СК (ВСК)
    → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после
    полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: банки по 300 г препарата.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +30 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в санитарной зоне рыбохозяйственных
    водоёмов. Работы с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены
    (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10). Возможность скармливания скоту зелёной массы кукурузы и ботвы
    картофеля решают органы государственного ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - При аварии прекратить высыпание и пересыпать препарат в плотно закрывающиеся промаркированные контейнеры;
    рассыпанный препарат тщательно собирают. Загрязнённый препарат и почву обезвреживают 10 % раствором
    кальцинированной соды или 7 % кашицей хлорной извести, собирают в контейнеры и удаляют в места, согласованные
    с природоохранными органами; загрязнённую землю перекапывают на глубину штыка лопаты.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Действующее вещество нестойко или малостойко в почве, высокотоксично для водорослей.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — 3–4
    часа.
  - Запрещено применение в санитарной зоне рыбохозяйственных водоёмов.
mechanism:
- key: mech
  title: Как работает римсульфурон
  paras:
  - Римсульфурон относится к производным сульфонилмочевины. Гербицид проникает в растения в основном через
    листья, быстро перемещается к точкам роста и блокирует фермент ацетолактатсинтазу, необходимый для
    синтеза незаменимых аминокислот — валина, лейцина и изолейцина.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Основной симптом — резкая остановка роста сорняков вскоре после обработки; с этого момента они перестают
    конкурировать с культурой. Затем видна явная задержка роста, хлороз точек роста, некроз и деформация
    листьев, и сорняки погибают.
  - Препарат уничтожает сорняки, которые уже взошли или прорастают в момент обработки.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Двудольные: амброзия полыннолистная (всходы — первая пара листьев), бодяк полевой (всходы — розетка),
    галинсога, горец, горчица, гулявник, дурнишник (виды), дымянка аптечная, звездчатка средняя, канатник
    Теофраста, осот (всходы — розетка), пастушья сумка, подмаренник цепкий, подсолнечник однолетний, редька
    дикая, ромашка, чистец, щавель, щирица (виды), ярутка полевая, яснотка (виды).'
  - 'Злаковые: гумай, лисохвост, овсюг, плевел (виды), просо куриное и волосовидное, пырей ползучий, росичка,
    тимофеевка, щетинник (виды).'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - При длительном применении сульфонилмочевин у отдельных видов сорняков может вырабатываться устойчивость.
    Чтобы этого избежать, чередуют гербициды разных химических групп с разным механизмом действия или используют
    комбинированные препараты.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани или ваты, не втирая, затем обмыть загрязнённый участок водой с
    мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды при разомкнутых веках.'
- lead: При первых признаках недомогания
  text: ' — немедленно отстранить пострадавшего от работы и вывести из зоны воздействия препарата; осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу и в органы дыхания;
    немедленно обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
