# Источники: регламент — госреестр (agroxxi v176, eskudo-vdg-3); процедуры — инструкция АО Фирма «Август»
# (avgust.com/products/rf/eskudo/, 27.10.2026); срок хранения — госреестр (ПИ10, совпадает с Августом).
# Фасовка — по Августу (банки 300 г; в госреестре — флакон 100 г). Не перенесены: «практически не токсично»
# (ДЗ04), «не отмечено отрицательного действия», «эффективность не зависит от влажности почвы», сроки в
# часах, сутках и неделях из описания действия (ПИ12). ПИ12.
