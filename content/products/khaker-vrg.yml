procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Однолетние сорняки наиболее чувствительны в фазе 2–6 листьев, осоты — в фазе розетки — начала роста
    стебля. При перерастании сорняками чувствительной фазы и при сильной засорённости используют максимальные
    нормы.
  - В рабочий раствор рекомендуется добавлять адъювант Адью. Если вода жёсткая, гидрокарбонатная или щелочная
    (pH выше 7), перед заправкой Хакера в воду рекомендуется добавить кондиционер Сойлент согласно инструкции;
    на льне Сойлент не добавляют.
  - Оптимальная температура обработки — от 10 до 25 °C. Не рекомендуется обрабатывать при угрозе заморозков
    и сразу после них.
  - Рабочий раствор готовят непосредственно перед опрыскиванием. Бак опрыскивателя наполовину заполняют
    водой, добавляют отмеренное на одну заправку количество препарата и доливают воду до полного объёма
    при постоянном перемешивании гидравлическими мешалками. Бак-смеситель для приготовления раствора использовать
    нельзя. Значение pH воды — 6–7.
  - Раствор готовят и заправляют опрыскиватель на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → Хакер → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: банки 0,5 и 1 кг.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - При необходимости пересева обработанных площадей в текущем году можно высевать зерновые, кукурузу,
    рапс, горчицу, капусту, лён; на следующий год — все культуры без ограничений. Для оценки последействия
    рекомендуется биотестирование почвы.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение авиационным способом. Работы с препаратом без средств индивидуальной защиты органов
    дыхания, зрения и кожи запрещены (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10). Возможность скармливания
    животным кормовой свёклы, ботвы сахарной свёклы и соломы зерновых решают органы государственного ветеринарного
    надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Рассыпанный препарат собирают в мешки для обезвреживания; мешки в контейнерах подлежат термическому
    обезвреживанию или вывозу на полигоны токсичных промышленных отходов или в места, согласованные с природоохранными
    органами. Загрязнённый участок промывают водой с мылом или содой (200 г соды на ведро воды) или перекапывают.
  - Обезвреживание и утилизация остатков препарата и сорбента — по СанПиН 1.2.2584-10 и СанПиН 1.2.1330-03.
    Не допускать попадания препарата в поверхностные водоёмы и канализацию.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Действующее вещество малостойкое или стойкое в почве, среднетоксично для водорослей.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят при скорости ветра до 4–5 м/с; погранично-защитная
    зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее 20–24 часов. Пчеловодов оповещают
    за 4–5 суток о препарате, сроках и зонах применения.
  - Запрещено применение в водоохранных зонах водных объектов, включая рыбохозяйственные водоёмы.
mechanism:
- key: mech
  title: Как работает клопиралид
  paras:
  - Клопиралид — синтетический ауксин из хлорпроизводных пиридинкарбоновой кислоты. Он поглощается листьями,
    переносится в точку роста, корни и корневища, легко перемещается по растению, нарушает деление клеток
    и останавливает рост сорняка.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост сорняков подавляется вскоре после обработки, видимые симптомы — хлороз, деформации, отмирание точки
    роста — нарастают в течение нескольких недель, затем сорняки полностью погибают.
- key: spectrum
  title: Спектр действия
  paras:
  - Амброзия полыннолистная, бодяк полевой, василёк синий, вика сорно-полевая, горец (виды), горчак ползучий,
    гречиха татарская, гречишка вьюнковая, дурнишник обыкновенный, латук компасный, одуванчик лекарственный,
    осот (виды), паслён чёрный, полынь (виды), пупавка собачья, ромашка (виды) и другие сорняки семейств
    астровых, бобовых, гречишных и паслёновых.
  - Уничтожает падалицу подсолнечника, в том числе сортов и гибридов, устойчивых к трибенурон-метилу и имидазолинонам.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - При длительном применении в посевах могут накапливаться виды сорняков, слабовосприимчивые к клопиралиду.
    Чтобы этого избежать, препарат чередуют с гербицидами других химических классов.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При острых признаках отравления
  text: ' — прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду
    и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться за медицинской
    помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
