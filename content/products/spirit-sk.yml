procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Рабочий раствор готовят непосредственно перед применением. Препарат тщательно перемешивают в заводской
    упаковке (встряхивают канистру), отмеряют количество на одну заправку и вводят прямо в бак, заполненный
    водой не менее чем наполовину, при хорошо работающей гидравлической мешалке; затем при непрерывном перемешивании
    доводят бак водой до нужного объёма. Тару трижды ополаскивают, сливая смыв в бак. Перемешивание продолжают
    во время обработки.
  - Рабочий раствор используют в день приготовления. Значение pH воды для приготовления рабочего раствора
    — 6–7. В сложных погодных условиях рекомендуется добавлять адъювант Аллюр.
  - Опрыскивание проводят профилактически или при первых симптомах болезни. На зерновых против пятнистостей,
    мучнистой росы и других болезней — в фазы конец кущения — начало выхода в трубку и появление флагового
    листа — начало колошения; против фузариоза колоса — в фазе конец колошения — начало цветения. На кукурузе
    — в фазах видимого образования междоузлий или выметывания метёлок.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется после полного
    растворения (диспергирования) предыдущего.'
  - Перед применением необходимо проверить смесь на совместимость и фитотоксичность по отношению к обрабатываемой
    культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке, с защитой от прямых солнечных лучей, увлажнения, загрязнения
    и механического повреждения.'
  - 'Температурный режим: от −30 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - В связи с эмбриотоксичностью азоксистробина работы с препаратом проводят только специалисты по защите
    растений или под их контролем, или лица, прошедшие специальную подготовку, обязательно со средствами
    индивидуальной защиты органов дыхания, зрения и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10, СанПиН
    1.2.1330-03). Запрещено применение в личных подсобных хозяйствах и авиационным способом. Место заправки
    опрыскивателя удаляют не менее чем на 200 м от жилья, скотных дворов, источников водоснабжения, мест
    хранения фуража и посевов продовольственных культур.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Место разлива засыпают песком или другим негорючим сорбентом, сорбент собирают в контейнеры и вывозят
    на обезвреживание в места, согласованные с природоохранными органами и Роспотребнадзором. Участок в
    помещении промывают водой с мылом или содой, участок земли обезвреживают 10 % раствором кальцинированной
    соды и перекапывают.
  - Тару трижды ополаскивают, смыв выливают в бак с рабочим раствором; вторичное использование тары не
    допускается. Запрещается сливать препарат на землю, в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Действующие вещества способны накапливаться в почве, поэтому не рекомендуется применять препарат на
    одном и том же поле три года подряд и более.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят при скорости ветра не более 3–4 м/с;
    погранично-защитная зона для пчёл — не менее 3–4 км; ограничение лёта пчёл — не менее 5–6 часов. Обязательно
    предварительное оповещение пчеловодов за 4–5 суток о препарате, сроках и зонах применения.
  - Применение в санитарной зоне рыбохозяйственных водоёмов запрещено.
mechanism:
- key: mech
  title: Как работают азоксистробин и эпоксиконазол
  paras:
  - Спирит сочетает действующие вещества двух химических классов с разным механизмом действия. Эпоксиконазол
    — триазол из группы ингибиторов деметилирования (DMI) с профилактическим, искореняющим и длительным
    остаточным действием; нарушает образование клеточных мембран грибов, активно поглощается листьями и
    перемещается по растению, активен и в холодную влажную погоду.
  - Азоксистробин — стробилурин, подавляет митохондриальное дыхание грибов, блокируя перенос электронов
    в дыхательной цепи. По данным производителя, он дольше сохраняет зелёную листовую поверхность и снижает
    потребление воды растением.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Защитное и антиспорулирующее действие проявляется сразу после попадания препарата на лист. По данным
    производителя, Спирит обеспечивает длительный период защитного действия.
- key: spectrum
  title: Спектр действия
  paras:
  - Мучнистая роса, ржавчины, септориоз, пиренофороз, фузариоз колоса, пятнистости и ринхоспориоз зерновых;
    гнили, гельминтоспориоз, пузырчатая головня и фузариоз початков кукурузы; болезни подсолнечника, сои,
    нута, сахарной свёклы и лука, указанные в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Сочетание веществ двух разных групп снижает риск резистентности. При нескольких обработках за сезон
    желательно чередовать препарат с фунгицидами других механизмов действия; ориентироваться только на
    разные торговые названия недостаточно.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки
    глотки вызвать рвоту; повторить несколько раз (рвоту вызывают только у пострадавших в сознании), после
    чего вновь дать выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания кожи, а затем
    обмыть загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть глаза мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду
    и средства индивидуальной защиты, избегая попадания препарата на кожу, немедленно обратиться за медицинской
    помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
