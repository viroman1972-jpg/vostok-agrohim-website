# Источники: регламент — госреестр (agroxxi v176, tebuzil-tks-2; регистрант ООО «Ярило», производитель АФД
# Кемикалс); описание и применение — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/
# tebuzil/, 26.10.2026); срок хранения — госреестр (ПИ10). В действующем регламенте только соя и рапс: зерновые,
# кукуруза и подсолнечник у Гарант Оптимы и в прошлой регистрации (до 23.01.2023) есть — не перенесены, как и
# «мировой опыт». Условий хранения, первой помощи, транспортировки и охраны среды у регистранта и Гарант Оптимы
# нет — ждут этикетки. ПИ12.
rate_header: Норма, л/т
