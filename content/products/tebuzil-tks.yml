  method: 'Протравливание семян перед посевом или заблаговременно. Расход рабочей жидкости — 10 л/т'
  wait: '— (1)'
procedures:
- key: prep
  title: Применение
  paras:
  - Семена протравливают перед посевом или заблаговременно. Посевной материал должен быть откалиброван и очищен
    от посторонних примесей — они снижают эффективность препарата.
  - Посев обработанных семян в недостаточно влажную почву, а также глубже оптимального может вызвать ретардантный
    эффект — задержку появления всходов.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Срок хранения: 2 года.'
mechanism:
- key: mech
  title: Как работают тебуконазол и имазалил
  paras:
  - Оба действующих вещества системные. Тебуконазол относится к триазолам, имазалил — к имидазолам; оба нарушают
    синтез эргостерола в мембранах клеток гриба, что приводит к гибели возбудителя.
  - Препарат проникает в растение при прорастании семени и распределяется по нему по мере роста, защищая
    проростки от семенной и почвенной инфекции.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Фунгицидное действие начинается вскоре после попадания семени во влажную почву. Защита сохраняется на
    ранних этапах развития растений.
- key: spectrum
  title: Спектр действия
  paras:
  - Корневые гнили, фузариоз, аскохитоз, пероноспороз, альтернариоз и плесневение семян — на культурах, указанных
    в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Сочетание двух действующих веществ снижает риск резистентности. Тем не менее протравители желательно
    чередовать по химическим классам. Ориентироваться только на разные торговые названия недостаточно — разные
    препараты могут содержать действующие вещества одной и той же группы.
