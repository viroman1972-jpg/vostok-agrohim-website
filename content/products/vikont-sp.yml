# Источники: регламент — госреестр (agroxxi v176, vikont-sp-2; регистранты ООО «АФД» и ООО «Ярило», производитель
# АФД Кемикалс); описание и применение — сайт ООО «Яровит» (yarovit-zern.ru/product/vikont/, 26.10.2026); на сайте
# Гарант Оптимы Виконта нет. Срок хранения — госреестр (ПИ10). Томат у Яровита есть, в действующем регламенте
# госреестра — нет; не перенесён, как и «мировой опыт» (незарегистрированные культуры). Первой помощи, транспортировки
# и охраны среды у регистрантов и Яровита нет — ждут этикетки. ПИ12.
rate_header: Норма, кг/га
regulation:
- rate: '2–2,5'
  crop: 'Картофель'
  object: 'Фитофтороз, альтернариоз'
  method: 'Опрыскивание в период вегетации: первое — профилактическое, последующие — с интервалом 10–14 дней.
    Расход рабочей жидкости — 200–400 л/га'
  wait: '20 (3)'
regulation_notes:
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Препарат вносят наземным опрыскиванием; растения должны быть покрыты рабочим раствором полностью и
    равномерно, но без стекания с листьев.
  - На картофеле препарат применяют профилактически перед смыканием рядков, до появления первых симптомов
    болезней, когда погодные условия благоприятны для развития возбудителей. Интервал между обработками
    — 10–14 дней, не более 3 обработок за сезон.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с пестицидами нейтральной и слабокислой реакции; с препаратами щелочной реакции не
    применяется. Целесообразно использовать в системе с инсектицидами.
  - В каждом конкретном случае перед применением необходимо проверять компоненты баковой смеси на совместимость.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: пакеты 1 и 5 кг.'
  - 'Срок хранения: 3 года.'
mechanism:
- key: mech
  title: Как работают металаксил и манкоцеб
  paras:
  - Препарат сочетает два действующих вещества с разным механизмом действия. Металаксил относится к фениламидам
    и действует системно — нарушает синтез РНК и белков в клетках возбудителя. Манкоцеб относится к дитиокарбаматам
    и действует контактно — подавляет ферменты и энергетический обмен гриба.
  - Металаксил быстро поглощается надземной частью растения и передвигается снизу вверх, оказывая профилактическое,
    а на ранней стадии инфекции — лечебное действие. Манкоцеб создаёт защитный слой на поверхности листа.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Металаксил поглощается листьями вскоре после опрыскивания, манкоцеб остаётся на листовой поверхности.
    Препарат применяют профилактически, до появления симптомов болезни.
- key: spectrum
  title: Спектр действия
  paras:
  - Фитофтороз и альтернариоз картофеля.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Сочетание веществ с разными механизмами действия снижает риск резистентности. Тем не менее Виконт целесообразно
    чередовать с фунгицидами других химических классов. Ориентироваться только на разные торговые названия
    недостаточно — разные препараты могут содержать действующие вещества одной и той же группы.
