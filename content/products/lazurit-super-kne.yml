regulation_notes:
  reentry: 3 дня
procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - При послевсходовой обработке картофеля оптимально применять препарат при появлении 70–80 % всходов.
    Почва должна быть хорошо разделана; во время обработки и в первые дни после неё почву не перемешивают.
    Учитывают сортовую чувствительность картофеля и томатов к метрибузину — её уточняют у оригинаторов
    сортов. В рабочий раствор рекомендуется добавлять адъювант Адью (0,1 %).
  - Умеренные осадки вскоре после опрыскивания усиливают действие, обильные — снижают за счёт вымывания
    (особенно на лёгких почвах); долгая засуха после обработки тоже снижает эффективность. При обильных
    осадках избегают высоких норм — промывание препарата в зону корней может угнетать культуру.
  - Культура в стрессе (засуха, переувлажнение, болезни, вредители) может временно угнетаться — при неблагоприятных
    условиях обработку лучше отложить.
  - Маточный раствор не нужен. Препарат перемешивают в заводской упаковке, вливают в бак, заполненный водой
    не менее чем на четыре пятых, при работающей мешалке, доливают воду и продолжают перемешивание; ёмкость
    ополаскивают, сливая смыв в бак. Концентрация препарата в рабочем растворе — не более 0,5 %; раствор
    расходуют в день приготовления. Значение pH воды — 5,5–7.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Лазурит Супер → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке. Не допускать замерзания препарата.'
  - 'Температурный режим: от −15 до +45 °C.'
  - 'Срок хранения: 4 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение авиационным способом и в санитарной зоне рыбохозяйственных водоёмов. Работы проводят
    со средствами индивидуальной защиты (ГОСТ 12.3.041-86, СанПиН 1.2.1077-01).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают сорбентом (песок, опилки) до полного впитывания; загрязнённые сорбенты в
    контейнерах, отходы препарата и тару обезвреживают в местах, согласованных с природоохранными органами.
    Места пролива обрабатывают 3–5 % раствором кальцинированной соды и промывают водой. Запрещается сливать
    препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Действующее вещество малостойко или среднестойко в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят при скорости ветра до 4–5 м/с; погранично-защитная
    зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — 3–4 часа.
  - Запрещено применение в санитарной зоне рыбохозяйственных водоёмов.
mechanism:
- key: mech
  title: Как работает метрибузин
  paras:
  - Метрибузин относится к триазинонам. Он проникает в сорняки через листья, корни и проростки, перемещается
    вверх по растению и подавляет фотосинтез, нарушая перенос электронов.
  - Препаративная форма — концентрат наноэмульсии с подобранными поверхностно-активными веществами и адъювантом;
    по данным производителя, мелкие частицы рабочего раствора ускоряют проникновение метрибузина в сорняки.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - При довсходовом внесении препарат уничтожает сорняки в момент прорастания, при послевсходовом — в течение
    нескольких недель после обработки. Он подавляет проростки второй «волны»; на картофеле защищает посадки
    практически до смыкания ботвы — в зависимости от погоды, типа почвы и окультуренности поля.
- key: spectrum
  title: Спектр действия
  paras:
  - Амброзия полыннолистная, василёк синий, вероника (виды), горец (виды), горчица полевая, гулявник (виды),
    дурнишник (виды), дымянка аптечная, звездчатка средняя, канатник Теофраста, лебеда (виды), лисохвост
    полевой, марь (виды), мятлик однолетний, одуванчик лекарственный, осот огородный, пастушья сумка, паслён
    чёрный, пикульник (виды), портулак огородный, просо куриное, ромашка непахучая, редька дикая, чистец
    однолетний, щирица (виды), ярутка (виды) и др.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать несколько стаканов воды с активированным углём (из расчёта
    1 г сорбента на 1 кг массы тела), затем раздражением задней стенки глотки вызвать рвоту, после чего
    дать выпить стакан воды с активированным углём. Вызвать врача.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух, вызвать врача, при остановке дыхания сделать искусственное
    дыхание.'
- lead: При попадании на кожу
  text: ' — снять препарат ватой или куском материи, не втирая, затем обмыть водой с мылом.'
- lead: При попадании в глаза
  text: ' — тотчас тщательно и обильно промыть большим количеством чистой проточной воды и обратиться к
    офтальмологу.'
