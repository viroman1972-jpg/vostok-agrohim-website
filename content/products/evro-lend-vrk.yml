# Источники: регламент и ограничения по севообороту — госреестр (agroxxi v176, evro-lend-vrk-2); описание
# и рекомендации — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/evro_lend/,
# 27.10.2026). По госреестру, а не по Гарант Оптиме: сроки посева последующих культур (у Гарант Оптимы
# через 4 месяца — только озимые пшеница и рожь, люпин и кормовые бобы — через 9). Срок хранения в госреестре
# не указан, у Гарант Оптимы его нет. Не перенесены: сроки в часах, днях и неделях из описания действия (ПИ12).
# Первой помощи, условий хранения и транспортировки у Гарант Оптимы нет — блоки пустые (этикетки не запрашиваем).
# ПИ12.
regulation:
- rate: '1–1,2'
  crop: 'Подсолнечник (сорта и гибриды, устойчивые к имидазолинонам)'
  object: 'Однолетние злаковые и двудольные сорняки'
  method: 'Опрыскивание посевов в ранние фазы роста сорняков (2–4 листа) и в фазе 4–5 настоящих листьев
    культуры'
  wait: '60 (1)'
regulation_notes:
  liquid_flow: 200–300 л/га
  reentry: 3 дня
procedures:
- key: prep
  title: Применение
  paras:
  - Препарат применяют только на подсолнечнике, устойчивом к имидазолинонам, и вносят только наземными
    опрыскивателями. Период от появления семядолей до первой пары настоящих листьев подсолнечника критический
    — в это время препарат не применяют.
  - Лучший результат — на начальных фазах роста сорняков (однолетние двудольные — до 4 настоящих листьев,
    однолетние злаковые — 1–3 листа, амброзия полыннолистная — от семядолей до 2 настоящих листьев, осоты
    — в фазе розетки). По переросшим сорнякам применяют максимальную норму.
  - Расход рабочего раствора — не менее 200 л/га, при густом стоянии растений и большом количестве растительных
    остатков — не менее 250 л/га.
  - Препарат не применяют на подсолнечнике, если на поле в предшествующие годы использовали гербициды из
    групп имидазолинонов и сульфонилмочевин. Если до всходов подсолнечника планируется гербицид сплошного
    действия, его вносят за 2 недели до посева. В течение сезона после обработки на этом поле не применяют
    другие гербициды из групп имидазолинонов и сульфонилмочевин.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Евро-Ленд не применяют в баковых смесях с другими гербицидами, в том числе с противозлаковыми, — смесь
    может угнетать культуру.
  - Не допускаются смеси с минеральными удобрениями, микроэлементами и регуляторами роста для подкормки
    подсолнечника — удобрения ускоряют проникновение гербицида в культуру и могут вызвать её повреждение.
  - Нельзя смешивать препарат с фосфорорганическими инсектицидами; их не применяют и в течение сезона после
    обработки.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Пшеницу и рожь можно сеять не ранее чем через 4 месяца после обработки; люцерну, сою, ячмень, овёс,
    кукурузу, горох — через 9 месяцев; картофель, томаты, табак, лук, просо, салат, подсолнечник, огурцы,
    морковь — через 19 месяцев; сахарную и столовую свёклу, рапс — через 26 месяцев.
mechanism:
- key: mech
  title: Как работают имазамокс и имазапир
  paras:
  - Оба действующих вещества относятся к имидазолинонам. Они проникают в сорняки через листья и корни,
    передвигаются по ксилеме и флоэме к точкам роста и подавляют фермент ацетолактатсинтазу, необходимый
    для синтеза аминокислот валина, лейцина и изолейцина. Синтез белков нарушается, клетки перестают расти,
    и растение погибает.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост сорняков останавливается вскоре после обработки, но в первые дни это может быть незаметно. Затем
    отмирают точки роста, молодые листья желтеют, и сорняки постепенно погибают.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние злаковые и двудольные сорняки, в том числе амброзия полыннолистная, а также осоты — на подсолнечнике,
    устойчивом к имидазолинонам.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
