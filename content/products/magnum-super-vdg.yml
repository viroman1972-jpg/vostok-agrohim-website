procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Однолетние двудольные сорняки наиболее уязвимы в фазе 2–4 листьев, многолетние — в фазе розетки; срок
    внесения лучше выбирать по стадии сорняков, а не культуры. При очень сильной засорённости и густом
    стеблестое используют максимальный объём рабочей жидкости. Не применять по мокрым от росы или дождя
    растениям и если в течение 3 часов после обработки ожидается дождь.
  - При высокой численности и трудноискоренимых сорняках, изреженных посевах, в жаркую и сухую погоду Магнум
    Супер применяют с адъювантом Адью (кроме посевов овса) — 0,2 л/га при наземной обработке, 0,05 л/га
    при авиационной. Адью добавляют в бак в последнюю очередь, иначе из-за пены часть раствора может вылиться.
  - 'Рабочий раствор готовят непосредственно перед опрыскиванием; сначала делают маточный раствор концентрацией
    не выше 3 %: к 1 л воды (15–30 °C) при перемешивании добавляют 300 г препарата, перемешивают 10 минут,
    доводят объём до 10 л и перемешивают ещё 5 минут. Бак опрыскивателя наполовину заполняют водой, вливают
    маточный раствор и доливают воду до полного объёма при постоянном перемешивании; ёмкость из-под маточного
    раствора несколько раз ополаскивают, сливая смыв в бак. Значение pH воды — 6–7.'
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией; его можно комбинировать с адъювантом Адью. Не применять совместно с фосфорорганическими инсектицидами
    и не чередовать с ними, если между опрыскиваниями проходит менее 14 дней, — опасность фитотоксичности.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → Магнум Супер → ВДГ (СТС) →
    СК (ВСК) → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: банки по 300 г препарата.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +30 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - На нейтральных и щелочных почвах на следующий год после уборки зерновых нельзя высевать свёклу и овощи;
    подсолнечник и гречиху — только после глубокой вспашки.
  - Нельзя высевать подсолнечник, гречиху и рапс на следующий год, если pH почвы выше 7,5 или если от применения
    препарата до посева этих культур была продолжительная засуха.
  - При необходимости пересева обработанных площадей высевают только зерновые культуры.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах и в водоохранной зоне водоёмов. Работы с препаратом
    без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены (ГОСТ 12.3.041-86, СанПиН
    1.2.2584-10). Возможность скармливания скоту соломы зерновых решают органы государственного ветеринарного
    надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Рассыпанный препарат собирают в сухие ёмкости для обезвреживания и герметично закрывают; загрязнённый
    участок в помещении промывают водой с мылом, участок земли перекапывают. Обезвреживание и утилизация
    тары, остатков препарата и промывных вод — по СанПиН 1.2.2584-10.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Метсульфурон-метил нестоек или среднестоек, трибенурон-метил малостоек в почве. Действующие вещества
    высокотоксичны для водорослей.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с (при авиаприменении — 0–1 м/с); погранично-защитная зона для пчёл — не менее 2–3 км
    (при авиаприменении — 5–6 км); ограничение лёта пчёл — 3–4 часа. Обязательно предварительное оповещение
    местных пчеловодов о препарате, сроках и зонах применения.
  - Запрещено применение в водоохранной зоне водоёмов.
mechanism:
- key: mech
  title: Как работают трибенурон-метил и метсульфурон-метил
  paras:
  - Оба действующих вещества относятся к производным сульфонилмочевины и блокируют фермент ацетолактатсинтазу,
    участвующий в синтезе незаменимых аминокислот. Гербицид поглощается через листья и корни, легко перемещается
    по сорнякам и останавливает их рост.
  - Магнум Супер действует как на взошедшие, так и на прорастающие в момент обработки сорняки.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Рост чувствительных сорняков прекращается вскоре после опрыскивания. Скорость проявления зависит от
    влажности и температуры, видового состава сорняков и их фазы — молодые растения чувствительнее. Затем
    листья сорняков становятся хлоротичными, точка роста погибает, и сорняки полностью отмирают.
  - По данным производителя, препарат защищает посевы в течение всего вегетационного сезона.
- key: spectrum
  title: Спектр действия
  paras:
  - Амброзия полыннолистная (всходы), бодяк (виды), вероника (виды), горец (виды), горчица полевая, гулявник
    (виды), дескурайния Софии, звездчатка средняя, марь белая, мелколепестник канадский, осот (виды), пастушья
    сумка, пикульник (виды), подсолнечник сорный, редька дикая, ромашка (виды), смолёвка обыкновенная, щавель
    курчавый, щирица запрокинутая, фиалка полевая, яснотка пурпурная, ярутка полевая и др.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить устойчивость сорняков к сульфонилмочевинам, чередуют гербициды с разными механизмами
    действия и применяют комбинированные гербициды.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани или ваты, не втирая, затем обмыть загрязнённый участок водой с
    мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды при разомкнутых веках.'
- lead: При первых признаках недомогания
  text: ' — немедленно отстранить пострадавшего от работы и вывести из зоны воздействия пестицида; осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу и в органы дыхания;
    немедленно обратиться за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
