# Источники: регламент — госреестр (agroxxi v176, drakon-super-100--ke-2); описание, приготовление раствора,
# ограничения и первая помощь — сайт ООО «Гарант Оптима» (garantoptima.ru/catalog/sredstva_zashchity_rasteniy/drakon_super_100/,
# 27.10.2026); срок хранения — госреестр (ПИ10, совпадает с Гарант Оптимой). У Гарант Оптимы два разных
# температурных режима хранения (от −15 и от −20 °C) — взят раздел «Условия хранения». Не перенесены: класс
# опасности «2 (высоко опасное)» (в карточке — по госреестру); ограничение лёта пчёл 6–12 часов из «Предостережений»
# (в экологическом регламенте — 20–24 часа); запрет скармливания 25 дней (решает ветнадзор); нормы для дождливого
# периода из «Предостережений»; фитотоксичность (у Гарант Оптимы — незначительное снижение высоты культуры
# в отдельных опытах); сроки в днях и неделях из описания действия (ПИ12); центр в информации для врача —
# ФГБУ. ПИ12.
