procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Препарат действует только на взошедшие к моменту обработки сорняки, поэтому опрыскивание проводят,
    когда появится основная масса однолетних злаковых сорняков. Лучший результат — при обработке в фазе
    2–3 листьев сорняков; от середины до конца их кущения применяют максимальную норму. Оптимально обрабатывать
    посевы до конца кущения культуры — позже густой травостой мешает равномерно покрыть сорняки раствором.
    Озимую пшеницу обрабатывают весной.
  - Не следует вносить препарат, когда культура в состоянии стресса (пониженная или повышенная температура
    воздуха, засуха, заморозки).
  - Рабочий раствор готовят в день обработки на специально оборудованных площадках. Для маточного раствора
    ёмкость на четверть заполняют водой, добавляют отмеренное количество гербицида, тщательно перемешивают
    и доливают воду до полного объёма. Бак опрыскивателя наполовину заполняют водой и при работающей мешалке
    добавляют маточный раствор, несколько раз промывая ёмкость, затем доливают бак водой при включённой
    мешалке. Норма расхода рабочего раствора должна обеспечивать полное и равномерное покрытие сорняков.
  - Опрыскивают наземными штанговыми опрыскивателями, избегая сноса раствора на соседние культуры и полезные
    растения; после работы оборудование сразу промывают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с большинством фунгицидов и инсектицидов (кроме фосфорорганических), применяемых
    на зерновых культурах. Не рекомендуется применять его в баковой смеси с регуляторами роста на основе
    тринексапак-этила и с гербицидами на основе 2,4-Д, дикамбы, флорасулама, флуроксипира, бромоксинила.
    В смеси с гербицидами на основе МЦПА количество МЦПА не должно превышать 400 г/га по действующему веществу.
  - В каждом случае необходима предварительная проверка смешиваемых компонентов на совместимость. Препараты
    не смешивают напрямую, без предварительного разведения водой.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в исправной заводской таре с этикеткой, на складах, специально предназначенных для
    пестицидов, отдельно от других пестицидов, пищевых продуктов и фуража, с защитой от прямых солнечных
    лучей, влаги, загрязнения и механических повреждений.'
  - 'Температурный режим: от −20 до +30 °C.'
  - 'Срок хранения: 2 года со дня изготовления.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки на каждом виде транспорта.
    Совместная перевозка и хранение с кормами и пищевыми продуктами, а также перевозка людей вместе с препаратом
    не допускаются.
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в водоохранной зоне водных
    объектов. Препарат выраженно раздражает слизистые оболочки глаз, поэтому работать с ним могут только
    лица, прошедшие специальную профессиональную подготовку, в средствах индивидуальной защиты органов дыхания,
    зрения и кожи. Возможность скармливания животным зелёной массы и соломы решают органы государственного
    ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Разлитый препарат не допускают в канализацию и водоёмы — его поглощают древесными опилками, песком
    или землёй и вместе с загрязнённой почвой собирают в контейнер для утилизации; участок обрабатывают
    раствором хлорной извести и перекапывают.
  - Тару три-четыре раза промывают водой (промывную воду используют для приготовления рабочего раствора),
    обрабатывают раствором хлорной извести, ополаскивают, приводят в непригодное для повторного использования
    состояние и утилизируют в местах, согласованных с органами санитарно-эпидемиологического надзора.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат — 3 класс опасности по стойкости в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    20–24 часов. Пчеловодов оповещают о предстоящей обработке за 4–5 суток.
  - Запрещено применение в водоохранной зоне водных объектов.
mechanism:
- key: mech
  title: Как работает феноксапроп-П-этил
  paras:
  - Феноксапроп-П-этил относится к арилоксифеноксипропионатам. Он поглощается надземной частью сорняков,
    быстро перемещается в точки роста и блокирует синтез липидов и жирных кислот, необходимых для построения
    мембран при делении клеток; злаковый сорняк перестаёт расти и погибает.
  - Антидот мефенпир-диэтил ускоряет распад действующего вещества в растениях пшеницы до нетоксичных соединений.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Гербицид быстро проникает в листья, и конкуренция сорняков с культурой в значительной мере устраняется
    уже вскоре после обработки. Первые признаки — угнетение, побурение, у некоторых сорняков антоциановая
    окраска; полная гибель наступает позже и зависит от погоды. Быстрее всего препарат действует на молодые
    сорняки при оптимальных влажности и температуре.
  - На сорняки, взошедшие после опрыскивания, препарат не действует, но для раскустившейся культуры они
    уже не представляют существенной опасности.
- key: spectrum
  title: Спектр действия
  paras:
  - Однолетние злаковые сорняки — овсюг, метлица обыкновенная, виды щетинника, просо куриное, просо сорное.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При попадании в глаза
  text: ' — промыть большим количеством воды; если раздражение сохраняется, обратиться к врачу.'
- lead: При попадании на кожу
  text: ' — немедленно смыть струёй воды или аккуратно снять препарат ватой или куском материи, не втирая,
    затем тщательно смыть водой или слабым раствором питьевой соды.'
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно выпить несколько стаканов воды со взвесью активированного
    угля (из расчёта 1 г сорбента на 1 кг массы тела) и вызвать рвоту раздражением задней стенки глотки,
    затем выпить ещё несколько стаканов воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — немедленно вывести пострадавшего из зоны действия препарата и обратиться к врачу.'
