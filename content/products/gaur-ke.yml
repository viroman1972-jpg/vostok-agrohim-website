procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - Почва должна быть хорошо разделанной и ровной, без комьев и растительных остатков. Оптимальные условия
    — увлажнённая почва и температура выше 10 °C. Обработку откладывают, если в течение 3–4 часов ожидаются
    осадки или культура угнетена. После опрыскивания почвы не менее 2–3 недель не проводят культивацию
    и рыхление междурядий.
  - На луке и чесноке Гаур применяют дробно с фазы двух листьев культуры — первая обработка в фазе 1–2
    листьев от 0,04 л/га, следующие — с интервалом 7–10 дней с постепенным повышением нормы до суммарной
    полной дозировки. Если лук в стрессе (холод, сильное повреждение вредителями, обильные дожди), обработку
    переносят.
  - Если вода жёсткая, гидрокарбонатная или щелочная (pH выше 7), перед заправкой Гаура в воду рекомендуется
    добавить кондиционер Сойлент согласно инструкции; на луке и чесноке Сойлент не добавляют.
  - Рабочий раствор готовят непосредственно перед применением. Препарат перемешивают в заводской таре, бак
    наполовину заполняют чистой водой, включают мешалку, добавляют отмеренное количество препарата и доливают
    воду до полного объёма при перемешивании; ёмкость ополаскивают, сливая смыв в бак. Перемешивание продолжают
    во время обработки. Значение pH воды — 5,5–6,5.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - На подсолнечнике при высокой засорённости эффективна смесь с гербицидом Симба.
  - На луке и чесноке смеси Гаура с другими пестицидами, микроэлементами, адъювантами и прилипателями применяют
    с осторожностью — возможна фитотоксичность.
  - Перед приготовлением смеси совместимость, стабильность и фитотоксичность рабочей жидкости проверяют
    в небольшой ёмкости.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → Гаур → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от 0 до +35 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - Ограничений нет.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами, кормами
    и комбикормами категорически запрещены.
  - Работы проводят со средствами индивидуальной защиты органов дыхания, зрения и кожи (ГОСТ 12.3.041-86,
    СанПиН 1.2.2584-10). Возможность скармливания животным зелёной массы подсолнечника решают органы государственного
    ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    собирают в контейнеры для обезвреживания; участок в помещении промывают водой с мылом или содой (200
    г соды на ведро воды), участок земли перекапывают. Утилизация остатков — по СанПиН 1.2.2584-10 и СанПиН
    1.2.1330-03.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    20–24 часов.
  - Запрещено применение в водоохранных зонах водных объектов, включая рыбохозяйственные водоёмы.
mechanism:
- key: mech
  title: Как работает оксифлуорфен
  paras:
  - Оксифлуорфен относится к дифениловым эфирам и обладает контактным действием — внутри сорняков он не
    перемещается. Препарат подавляет фотосинтез и обмен веществ у чувствительных сорняков.
  - На луке и чесноке Гаур действует на сорняки напрямую, при опрыскивании почвы до всходов подсолнечника
    и сои — через почвенный «экран». Поэтому особенно важно качественное, равномерное опрыскивание.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Хлороз и некроз у чувствительных сорняков появляются через несколько дней после опрыскивания, затем
    сорняки погибают; проростки отмирают почти сразу из-за поражения подсемядольного колена у двудольных
    и точки роста у злаковых.
  - Препарат прочно связывается почвой, поэтому защитное действие длительное; оно зависит от сохранности
    плёнки препарата на поверхности почвы. При низких температурах и слабом освещении действие дольше,
    в жару и на ярком солнце препарат быстрее разлагается.
  - На подсолнечнике после очень обильных осадков возможны жёлтые пятна и ожоги на листьях культуры, на
    урожай это не влияет.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - При длительном применении на одном поле могут сформироваться популяции двудольных сорняков, устойчивые
    к оксифлуорфену. Гаур чередуют с гербицидами других химических классов.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего снова
    выпить стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться
    за медицинской помощью.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, антидот неизвестен. При необходимости — консультация
