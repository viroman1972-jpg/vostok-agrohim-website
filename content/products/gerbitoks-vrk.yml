regulation_notes:
  liquid_flow: 50–300 л/га (в зависимости от типа распылителей)
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Гербитокс, как и другие синтетические ауксины, наиболее эффективен на ранних стадиях развития сорняков
    (2–5 настоящих листьев) в период их активного роста, поэтому опрыскивание проводят как можно раньше
    в пределах рекомендованной фазы культуры. На горохе обрабатывают в фазе 3–5 настоящих листьев (высота
    10–15 см) до начала цветения; на усатых сортах возможна значительная фитотоксичность.
  - Оптимальная температура обработки — 10–20 °C; в засуху действие препарата может снижаться. Опрыскивание
    не рекомендуется при вероятности дождя в течение 6 часов и при температуре выше 20 °C.
  - Если вода жёсткая, гидрокарбонатная или щелочная (pH выше 7), перед заправкой Гербитокса в воду рекомендуется
    добавить кондиционер Сойлент согласно инструкции. На льне, горохе и клевере Сойлент не добавляют.
  - Рабочий раствор готовят непосредственно перед применением. Препарат перемешивают в заводской упаковке,
    бак опрыскивателя на четверть заполняют водой, вливают препарат на одну заправку, тщательно перемешивают
    и доливают воду до полного объёма при непрерывном перемешивании. Перемешивание продолжают и во время
    обработки; раствор используют в течение нескольких часов. Значение pH воды — 6–7.
  - Раствор готовят и заправляют опрыскиватель на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Нежелательно смешивать его с микроэлементами (медь, железо, цинк и др.).
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ
    → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → Гербитокс → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −16 до +40 °C.'
  - 'Срок хранения: 5 лет со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Работы с препаратом проводят только специалисты по защите растений, под их контролем или лица, прошедшие
    специальную подготовку, со средствами индивидуальной защиты органов дыхания, глаз и кожи (ГОСТ 12.3.041-86,
    СанПиН 1.2.2584-10).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - При проливе на почву участок присыпают песком или землёй, загрязнённую почву помещают в опечатанные
    контейнеры для утилизации. Обезвреживание и утилизация тары, остатков препарата и промывных вод — по
    СанПиН 1.2.2584-10. Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Действующее вещество среднестойко в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят ранним утром или вечером после захода
    солнца при скорости ветра до 4–5 м/с; погранично-защитная зона для пчёл — 2–3 км; ограничение лёта
    пчёл — 12–18 часов. Обязательно предварительное оповещение местных пчеловодов о препарате, сроках и
    зонах применения.
  - Рыбохозяйственная оценка — 3 класс опасности. Разрешено применение в санитарной зоне рыбохозяйственных
    водоёмов.
mechanism:
- key: mech
  title: Как работает МЦПА
  paras:
  - МЦПА — синтетический ауксин из производных феноксиуксусной кислоты. Гербитокс действует на наземные
    органы вегетирующих сорняков, поглощается главным образом листьями и, по данным производителя, подавляет
    фотосинтез.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Признаки угнетения сорняков — деформации, трещины, нарушение роста — появляются через несколько дней
    после обработки, затем сорняки полностью погибают.
  - Гербитокс защищает посевы от момента обработки до появления новой «волны» сорняков.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Чувствительны: амброзия полыннолистная, василёк синий, гулявник (виды), горчица полевая, клубнекамыш
    (виды), кохия веничная, марь (виды), монохория Корсакова, осот огородный, пастушья сумка, пикульник
    (виды), редька дикая, стрелолист трилистный, чистец однолетний, ярутка полевая и др.'
  - 'Среднечувствительны: хвощ (виды), фиалка (виды), яснотка (виды), вероника (виды), горец (виды), осот
    полевой.'
  - 'Слабочувствительны: вьюнок полевой, бодяк (виды), молочай (виды), полынь (виды), подмаренник цепкий.'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, гербициды с разными механизмами действия чередуют.
    Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — немедленно дать выпить несколько стаканов тёплой воды с активированным углём (из расчёта 1 г
    сорбента на 1 кг массы тела), затем раздражением задней стенки глотки вызвать рвоту; повторить несколько
    раз для более полного удаления препарата из организма.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — снять препарат ватой или куском материи, не втирая, затем обмыть водой с мылом.'
- lead: При попадании в глаза
  text: ' — тщательно и обильно промыть при разомкнутых веках большим количеством чистой проточной воды.'
