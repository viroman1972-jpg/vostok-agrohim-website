# Источники: регламент — госреестр (agroxxi v176, dublon-gold-vdg-3); процедуры — инструкция АО Фирма «Август»
# (avgust.com/products/rf/dublon_gold/, 27.10.2026); срок хранения — госреестр (ПИ10; Август пишет 4 года,
# госреестр — 2). Не перенесены: «практически не токсичен» (ДЗ04), «случаев резистентности не выявлено»,
# фраза о селективности к дикамбе (в препарате дикамбы нет), центр Склифосовского (в информации для врача
# — ФМБА), сроки в часах, днях и неделях из описания действия (ПИ12). ПИ12.
regulation:
- rate: '0,05–0,07'
  crop: 'Кукуруза (кроме кукурузы на масло)'
  object: 'Однолетние и многолетние злаковые и однолетние двудольные сорняки'
  method: 'Опрыскивание в фазе 2–6 листьев кукурузы при высоте пырея ползучего 10–15 см, в фазе 1–4 листьев
    однолетних двудольных и злаковых сорняков, с добавлением адъюванта Адью 200 мл/га (0,1 % от объёма
    рабочей жидкости)'
  wait: '60 (1)'
regulation_notes:
  liquid_flow: 50–300 л/га (в зависимости от типа распылителей)
  reentry: 3 дня
procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Кукурузу обрабатывают в фазе 2–6 листьев при высоте пырея ползучего 10–15 см и в фазе 1–4 листьев однолетних
    сорняков. Нежелательно применять препарат на сахарной и лопающейся кукурузе и на родительских линиях
    для производства семян.
  - 'Рабочий раствор готовят непосредственно перед опрыскиванием. Маточный раствор: ведро на четверть заполняют
    водой, добавляют препарат на одну заправку, тщательно перемешивают и доливают воду до трёх четвертей
    объёма. Бак опрыскивателя наполовину заполняют водой, включают мешалку, вливают маточный раствор, добавляют
    Адью и доливают воду до полного объёма; ведро несколько раз ополаскивают, сливая смыв в бак.'
  - Адью добавляют в бак в последнюю очередь — иначе из-за обильной пены часть раствора может вылиться.
    Значение pH воды — 6–7.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Не применять совместно с фосфорорганическими инсектицидами и не чередовать с ними, если между
    опрыскиваниями проходит менее 14 дней, — опасность фитотоксичности.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → Дублон Голд → ВДГ (СТС) →
    СК (ВСК) → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ. Каждый последующий компонент добавляется
    после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: банки по 750 г препарата.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −30 до +40 °C.'
  - 'Срок хранения: 2 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Работы с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи запрещены (ГОСТ
    12.3.041-86, СанПиН 1.2.2584-10).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый рабочий раствор засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый
    песок собирают в контейнеры для утилизации согласно местной инструкции; участок промывают водой с мылом
    или содой (200 г соды на ведро воды) и перекапывают. Обезвреживание и утилизация тары, остатков препарата
    и промывных вод — по СанПиН 1.2.2584-10. Запрещается сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Никосульфурон среднестоек, тифенсульфурон-метил нестоек в почве.
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят ранним утром или вечером после захода
    солнца при скорости ветра не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение
    лёта пчёл — не менее 3–4 часов.
  - Запрещено применение в санитарной зоне рыбохозяйственных водоёмов.
mechanism:
- key: mech
  title: Как работают никосульфурон и тифенсульфурон-метил
  paras:
  - Оба действующих вещества относятся к производным сульфонилмочевины. Они проникают в сорняки через листья
    и корни, передвигаются по ксилеме и флоэме и угнетают фермент ацетолактатсинтазу, участвующий в синтезе
    незаменимых аминокислот лейцина, изолейцина и валина; деление клеток нарушается, рост останавливается,
    и сорняки погибают.
  - Избирательность основана на том, что кукуруза быстро разрушает и обезвреживает действующие вещества.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Гербицид быстро поступает в растения, рост сорняков замедляется вскоре после обработки; видимые симптомы
    появляются позже — скорость зависит от влажности, температуры, видового состава и фазы сорняков.
  - 'Симптомы: резкое замедление роста, затем антоциановая окраска, обесцвечивание жилок, хлороз листьев,
    отмирание точек роста, некроз тканей. Переросшие или менее чувствительные сорняки не погибают, но угнетаются
    и прекращают развитие.'
  - Препарат уничтожает в основном сорняки, взошедшие или прорастающие в момент обработки; во влажных условиях
    его почвенное действие усиливается.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Однолетние злаковые: просо (виды), щетинник (виды), овсюг; многолетние злаковые: пырей ползучий, сорго
    алеппское (гумай).'
  - 'Однолетние двудольные: амброзия полыннолистная, василёк синий, горец (виды), гулявник (виды), дескурайния
    Софии, марь (виды), осот огородный, пастушья сумка, пикульник (виды), горчица полевая и белая, редька
    дикая, ромашка (виды), чистец однолетний, щирица запрокинутая, ярутка полевая, яснотка пурпурная; многолетние
    двудольные: бодяк полевой, латук татарский, осот полевой.'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Чтобы предотвратить появление устойчивых сорняков, Дублон Голд чередуют с гербицидами других химических
    классов и с другим механизмом действия.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой; если пострадавший в сознании, немедленно дать выпить несколько стаканов
    воды с активированным углём (из расчёта 1 г сорбента на 1 кг массы тела).'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух, сменить загрязнённую одежду и вызвать врача.'
- lead: При попадании на кожу
  text: ' — снять загрязнение ватным тампоном или куском ткани, осторожно, не втирая, затем тщательно смыть
    большим количеством воды с мылом.'
- lead: При попадании в глаза
  text: ' — тотчас промыть при разомкнутых веках большим количеством чистой проточной воды и обратиться
    к врачу.'
- lead: При первых признаках недомогания
  text: ' — вывести пострадавшего из зоны действия препарата, снять спецодежду и обеспечить доступ свежего
    воздуха.'
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
    — консультация ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая
    Сухаревская площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
