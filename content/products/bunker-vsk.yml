procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Протравливать семена можно заблаговременно или непосредственно перед посевом; свежеубранные семена озимых
    обрабатывают не позднее чем за 2–5 дней до посева. Рекомендуется использовать семена, очищенные от пыли
    и примесей. Качество обработки контролируют по интенсивности окраски семян.
  - Рабочую жидкость готовят непосредственно перед применением. Препарат перемешивают в заводской упаковке,
    смешивают с водой в отдельной ёмкости в соотношении 1:1. Бак протравочной машины на треть заполняют
    водой и при непрерывном перемешивании вливают маточный раствор; ёмкость из-под него ополаскивают, сливая
    смыв в бак. Затем доводят бак водой до полного объёма и перемешивают до однородной суспензии; перемешивание
    продолжают во время обработки.
  - Для приготовления рабочего раствора используют воду температурой не ниже 10 °C — холодная вода снижает
    диспергируемость препарата. Значение pH воды — 5–6,5. Рабочую жидкость используют в тот же день.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Бункер можно применять в комбинации с инсектицидными протравителями Табу и Табу Нео. Препарат совместим
    с различными пестицидами для обработки семян, кроме препаратов с сильнощелочной или сильнокислой реакцией.
  - 'Порядок добавления компонентов в бак протравочной машины: СП → Бункер → СК (КС, ВСК) → СЭ → МЭ → ВРК
    (ВР). Каждый последующий компонент добавляется после полного растворения (диспергирования) предыдущего.'
  - В каждом конкретном случае необходимо проверять смешиваемые компоненты на совместимость, а обработанные
    смесью семена перед посевом — на всхожесть.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −5 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами транспорта в соответствии с правилами перевозки опасных грузов. Транспортировка
    и хранение совместно с пищевыми продуктами и комбикормами категорически запрещены.
  - Работы с препаратом проводят только специалисты по защите растений или под их контролем, или лица,
    прошедшие специальную подготовку, обязательно со средствами индивидуальной защиты органов дыхания, зрения
    и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.1077-01).
  - Протравливание проводят на централизованных пунктах протравливания при полной механизации процесса
    и эффективной вентиляции.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.1077-01. Не допускается
    загрязнение водоёмов препаратом или использованной тарой; запрещается сливать препарат в канализацию
    и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат стоек в почве (2 класс опасности по стойкости).
  - Препарат — протравитель семян, оценка токсичности для пчёл не требуется.
  - Рыбохозяйственная оценка — 4 класс опасности; не допускать попадания препарата в рыбохозяйственные
    водоёмы. Применение в водоохранной зоне водных объектов запрещено.
mechanism:
- key: mech
  title: Как работает тебуконазол
  paras:
  - Тебуконазол относится к триазолам и обладает профилактическим и лечащим системным действием. Он подавляет
    биосинтез эргостерина в мембранах клеток грибов, что приводит к гибели возбудителя.
  - Препарат угнетает грибы, находящиеся как на поверхности семян, так и внутри них. Перемещаясь в зародыш
    семени, Бункер уничтожает головнёвую инфекцию, затем передвигается к точкам роста и защищает всходы и
    корневую систему от почвенных патогенов.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - На семенную инфекцию препарат начинает действовать в первые часы после высева протравленных семян в
    почву.
  - Бункер подавляет поверхностную и внутреннюю семенную инфекцию; против корневых гнилей и листостебельной
    инфекции действует на начальных этапах роста — до кущения зерновых и бутонизации льна-долгунца. Благодаря
    лечащему действию болезни подавляются и после появления симптомов.
  - Препаративная форма образует на поверхности семян прочную окрашенную плёнку, которая после высыхания
    не осыпается; при приготовлении раствора препарат не пылит и не оседает на дно бака.
- key: spectrum
  title: Спектр действия
  paras:
  - Головнёвые заболевания (твёрдая, пыльная, каменная, ложная пыльная, покрытая), гельминтоспориозная и
    фузариозная корневые гнили, плесневение семян, септориоз, фузариозная снежная плесень, красно-бурая
    пятнистость овса, а на льне-долгунце — антракноз и крапчатость.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - По данным производителя, случаев резистентности к препарату не выявлено. При планировании защиты желательно
    чередовать препараты с разными механизмами действия по годам и обработкам.
  - Ориентироваться только на разные торговые названия недостаточно — разные препараты могут содержать
    действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, выпить несколько стаканов воды со взвесью активированного угля (из расчёта
    1 г сорбента на 1 кг массы тела), вызвать рвоту раздражением задней стенки глотки; при необходимости
    повторить несколько раз, после чего выпить стакан воды с активированным углём и немедленно обратиться
    к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух, сменить загрязнённую одежду и вызвать врача.'
- lead: При попадании на кожу
  text: ' — немедленно смыть струёй воды или снять загрязнение ватой или куском ткани, осторожно, не втирая,
    затем тщательно промыть кожу водой с мылом.'
- lead: При попадании в глаза
  text: ' — немедленно промыть большим количеством проточной воды в течение 15 минут при открытых веках
    и обратиться к врачу.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
