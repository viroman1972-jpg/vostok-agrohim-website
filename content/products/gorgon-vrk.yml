# Источники: регламент — госреестр (agroxxi v176, gorgon-vrk-5); процедуры — инструкция АО Фирма «Август»
# (avgust.com/products/rf/gorgon/, 27.10.2026); срок хранения — госреестр (ПИ10, совпадает с Августом). Не назван
# Полифем (нет в ассортименте). Не перенесены: «практически не токсична» (ДЗ04), «гербицид сплошного действия»
# применительно к спектру (в каталоге — избирательного действия), обезвреживание на предприятии-изготовителе,
# сроки в часах, днях и неделях из описания действия (ПИ12). ПИ12.
