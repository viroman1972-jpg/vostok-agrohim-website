procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Наибольший эффект достигается при температуре воздуха 18–28 °C. В засуху действие препарата может ухудшаться
    — он слабее проникает в растение и медленнее перемещается по нему.
  - Если вода жёсткая, гидрокарбонатная или щелочная (pH выше 7), перед заправкой Горгона в воду рекомендуется
    добавить кондиционер Сойлент согласно инструкции.
  - Рабочий раствор готовят непосредственно перед применением. Препарат тщательно перемешивают в заводской
    таре, бак опрыскивателя наполовину заполняют чистой водой, включают мешалку (в ранцевом опрыскивателе
    перемешивают подручными средствами), добавляют отмеренное количество препарата и доливают воду до полного
    объёма при перемешивании. Ёмкость из-под гербицида несколько раз ополаскивают, сливая смыв в бак. Значение
    pH воды — 6–7.
  - Раствор готовят и заправляют опрыскиватель на специальных площадках, которые затем обезвреживают. После
    работы аппаратуру тщательно промывают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Нежелательно смешивать его с микроэлементами (медь, железо, цинк и др.).
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
  - 'Порядок добавления компонентов в бак: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → Балерина
    Форте → СЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → Горгон → ВРК (ВР) → ВГР → ПАВ. Каждый последующий компонент
    добавляется после полного растворения (диспергирования) предыдущего.'
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 и 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от 0 до +30 °C.'
  - 'Срок хранения: 5 лет со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: rotation
  title: Ограничения по севообороту
  paras:
  - 'При норме до 0,2 л/га: через 3 месяца можно высевать зерновые, рапс, рыжик, горчицу; через 10 месяцев
    — кукурузу, сорго, капусту, сафлор, мяту; через 12 месяцев — сою, люцерну, бобы, подсолнечник, чечевицу,
    горох, сахарную свёклу, морковь, лук; через 18 месяцев — картофель; через 24 месяца — любые культуры.'
  - При норме 1,5–4,5 л/га через 24 месяца можно высевать зерновые и кукурузу; двудольные культуры — только
    после биотестирования почвы.
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами и комбикормами
    категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах, авиационным способом и в водоохранной зоне водоёмов.
    Обработку проводят только специалисты по защите растений, под их контролем или лица, прошедшие специальную
    подготовку, со средствами индивидуальной защиты органов дыхания, зрения и кожи (ГОСТ 12.3.041-86, СанПиН
    1.2.2584-10).
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 3 дня.
  - Пролитый препарат засыпают негорючим сорбентом (песок, земля, опилки, синтетический абсорбент) до полного
    впитывания; загрязнённый сорбент в контейнерах подлежит термическому обезвреживанию или вывозу на полигоны
    токсичных промышленных отходов или в места, согласованные с природоохранными органами. Участок промывают
    водой с мылом или содой (200 г соды на ведро воды) и перекапывают.
  - Обезвреживание и утилизация тары, остатков препарата и промывных вод — по СанПиН 1.2.2584-10. Запрещается
    сливать препарат в канализацию и любые водоёмы.
- key: eco
  title: Охрана окружающей среды
  paras:
  - МЦПА малостойка или среднестойка, пиклорам очень стоек в почве (1 класс).
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    до 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — 3–4 часа.
    Обязательно предварительное оповещение местных пчеловодов о препарате, сроках и зонах применения.
  - Запрещено применение в водоохранной зоне водоёмов.
mechanism:
- key: mech
  title: Как работают МЦПА и пиклорам
  paras:
  - Оба действующих вещества — синтетические ауксины. МЦПА (производное феноксиуксусной кислоты) быстро
    проникает в сорняки через надземные органы, главным образом через листья, перемещается к точкам роста,
    накапливается в меристемах и нарушает рост тканей, биосинтез белков и энергетический обмен. Пиклорам
    (производное пиридинкарбоновой кислоты) легко перемещается в новые растущие ткани и также нарушает рост,
    деление клеток и синтез белка.
  - В высоких нормах на несельскохозяйственных землях и парах Горгон уничтожает горчак ползучий, борщевик
    Сосновского и древесно-кустарниковую растительность; в нормах для полевых культур действует против
    двудольных сорняков.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Первые признаки угнетения — потеря тургора, деформация листовых пластинок — появляются в первые сутки,
    затем — угнетение роста, скручивание и утолщение стеблей и листьев, хлороз и отмирание точки роста;
    после этого сорняки полностью погибают.
  - В нормах для полевых культур препарат освобождает посевы от чувствительных сорняков с момента опрыскивания
    до уборки урожая; в высоких нормах подавляет горчак ползучий, нежелательную травянистую и древесно-кустарниковую
    растительность на длительный срок — в зависимости от нормы, засорённости, погоды и свойств почвы.
- key: spectrum
  title: Спектр действия
  paras:
  - 'Чувствительны: падалица подсолнечника (в том числе устойчивая к трибенурон-метилу и имидазолинонам),
    амброзия полыннолистная, ромашка (виды), пикульник (виды), подмаренник цепкий, василёк синий, марь белая.'
  - 'Среднечувствительны: бодяк (виды), осот (виды), латук (виды), горец (виды), полынь (виды).'
  - 'Слабочувствительны (в нормах для полевых культур): вьюнок полевой, молочай лозный, горчак ползучий.'
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - При длительном применении гербицидов с МЦПА известны популяции сорняков, устойчивые к синтетическим
    ауксинам, — горчица полевая, лютик едкий, трёхрёберник непахучий, бодяк полевой, чертополох, подмаренник
    цепкий, редька дикая, дескурайния Софии, звездчатка средняя; устойчивая к МЦПА горчица полевая устойчива
    и к пиклораму.
  - Чтобы предотвратить резистентность, чередуют гербициды с разными механизмами действия и соблюдают севооборот.
first_aid:
- lead: При случайном проглатывании
  text: ' — немедленно дать пострадавшему выпить несколько стаканов тёплой воды с активированным углём (из
    расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки глотки вызвать рвоту; повторить
    несколько раз для более полного удаления препарата из организма.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок большим количеством воды с мылом.'
- lead: При попадании в глаза
  text: ' — тотчас промыть при разомкнутых веках мягкой струёй чистой проточной воды.'
- lead: При первых признаках отравления
  text: ' — немедленно отстранить пострадавшего от работы, вывести из зоны загрязнения и обратиться за медицинской
    помощью.'
- lead: ''
  text: Во всех случаях отравления после оказания первой помощи необходимо обратиться к врачу.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
