procedures:
- key: prep
  title: Применение и приготовление рабочего раствора
  paras:
  - 'Наиболее уязвимы: однолетние злаковые — при высоте более 5 см до выхода в трубку; многолетние злаковые
    — при 5–6 листьях и высоте 10–20 см; однолетние двудольные — от двух листьев до цветения; многолетние
    двудольные — в фазе розетки до бутонизации и цветения (осоты — розетка диаметром 10–20 см, горчак —
    розетка — стеблевание, вьюнок — розетка 10–12 см).'
  - Препарат лучше действует на свежие, быстро растущие сорняки. В жару обрабатывают утром или вечером,
    в сильную засуху не опрыскивают. Воздерживаются от обработки, если в течение 2–4 часов ожидается дождь,
    при обильной росе и по запылённым листьям. Многолетние сорняки обрабатывают в период оттока питательных
    веществ в корни; культивацию проводят не ранее чем через две недели после обработки.
  - Рекомендуется добавлять в раствор адъювант Аллюр. Если вода жёсткая, гидрокарбонатная или щелочная
    (pH выше 7), перед заправкой в воду добавляют кондиционер Сойлент согласно инструкции. Объём рабочего
    раствора не увеличивают сверх рекомендованного — это снижает поступление глифосата в сорняки.
  - Не допускать попадания препарата на культурные растения и лесополосы; не обрабатывать при ветре более
    5 м/с.
  - Рабочий раствор готовят непосредственно перед применением. Препарат перемешивают в заводской таре, бак
    наполовину заполняют чистой водой, включают мешалку (в ранцевом опрыскивателе перемешивают подручными
    средствами), добавляют отмеренное количество препарата и доливают воду до полного объёма при перемешивании.
    Значение pH воды — 6–7; при электропроводности воды выше 500 мкСм/см нужен анализ на соли жёсткости
    и умягчение воды. Раствор готовят на специальных площадках, которые затем обезвреживают.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Препарат совместим с различными пестицидами, за исключением препаратов с сильнощелочной или сильнокислой
    реакцией. Нежелательно смешивать его с микроэлементами (медь, железо, цинк и др.).
  - В баковой смеси с Гербитоксом обязательно используют кондиционер Сойлент и добиваются полного растворения
    каждого компонента перед добавлением следующего.
  - В каждом конкретном случае необходимо проверять совместимость компонентов перед приготовлением баковой
    смеси, а готовую смесь — на фитотоксичность по отношению к обрабатываемой культуре.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 10 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −15 до +40 °C.'
  - 'Срок хранения: 5 лет со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — только в заводской упаковке с заводской этикеткой, всеми видами транспорта в соответствии
    с правилами перевозки опасных грузов. Транспортировка и хранение совместно с пищевыми продуктами, кормами
    и комбикормами категорически запрещены.
  - Запрещено применение в личных подсобных хозяйствах и в водоохранных зонах водных объектов. Работы проводят
    со средствами индивидуальной защиты органов дыхания, зрения и кожи (ГОСТ 12.3.041-86, СанПиН 1.2.2584-10).
    Возможность выпаса скота и скармливания трав с обработанных территорий решают органы государственного
    ветеринарного надзора.
  - Срок безопасного выхода людей на обработанные площади для механизированных работ — 7 дней.
  - При аварии прекратить утечку и перелить препарат в плотно закрывающиеся промаркированные контейнеры.
    Пролитый препарат засыпают песком или другим негорючим адсорбирующим материалом, загрязнённый сорбент
    собирают в контейнеры для обезвреживания; участок в помещении промывают водой с мылом или содой (200
    г соды на ведро воды), участок земли перекапывают. Обезвреживание и утилизация остатков — по СанПиН
    1.2.2584-10 и СанПиН 1.2.1330-03.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Класс опасности для пчёл — 3 (малоопасный). Обработку проводят утром или вечером при скорости ветра
    не более 4–5 м/с; погранично-защитная зона для пчёл — не менее 2–3 км; ограничение лёта пчёл — не менее
    3–4 часов. Пчеловодов оповещают за 4–5 суток о препарате, сроках и зонах применения.
  - Рыбохозяйственная оценка — 2 класс опасности. Запрещено применение в водоохранных зонах водных объектов,
    включая рыбохозяйственные водоёмы.
mechanism:
- key: mech
  title: Как работает глифосат
  paras:
  - Глифосат относится к фосфорорганическим соединениям и обладает системным действием. Он проникает в
    растения через листья и другие зелёные части, переносится по всем органам до корневой системы и блокирует
    синтез ароматических аминокислот — точки роста поражаются, надземные и подземные органы полностью отмирают.
    На семена препарат не действует.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Видимые симптомы появляются сначала на однолетних сорняках, затем на многолетних, позже всего — на
    древесно-кустарниковой растительности и камышах; скорость зависит от активности роста сорняков и погоды.
    В холод, засуху и при осадках действие может замедляться.
  - 'Симптомы: пожелтение, затем побурение растений, усыхание листьев; позже отмирают стебли, подземные
    побеги, корни и корневища.'
  - Препарат препятствует отрастанию многолетних сорняков из корневищ и корневых отпрысков в течение вегетационного
    периода и дольше — в зависимости от нормы, но не подавляет прорастание семян; защитное действие сохраняется
    до появления новой «волны» всходов.
- key: spectrum
  title: Спектр действия
  paras:
  - Все однолетние и многолетние злаковые и двудольные сорняки, включая злостные (пырей ползучий, бодяк
    полевой, вьюнок полевой, свинорой пальчатый и др.), а также нежелательная лиственная древесно-кустарниковая
    растительность (осина, берёза, ольха, ива, акация, клён и др.). Устойчивы к глифосату генно-инженерные
    сорта сои и других культур.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - При длительном применении на одном месте устойчивость возможна у некоторых видов — амарантовых, редьки
    дикой, мелколепестника канадского, амброзии трёхраздельной и полыннолистной, мятлика полевого, плевела,
    гумая, ежовника.
  - Чтобы предотвратить резистентность, чередуют гербициды с разными механизмами действия и соблюдают севооборот.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, немедленно дать пострадавшему выпить несколько стаканов воды со взвесью
    активированного угля (из расчёта 1 г сорбента на 1 кг массы тела), затем раздражением задней стенки
    глотки вызвать рвоту (только если пострадавший в сознании); повторить несколько раз, после чего выпить
    стакан воды с активированным углём и немедленно обратиться к врачу.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, избегая грубого растирания, затем обмыть
    загрязнённый участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — тотчас промыть мягкой струёй чистой проточной воды.'
- lead: При первых признаках отравления
  text: ' — немедленно прекратить работу, вывести пострадавшего из зоны воздействия препарата, осторожно
    снять одежду и средства индивидуальной защиты, избегая попадания препарата на кожу, и немедленно обратиться
    за медицинской помощью.'
- lead: ''
  text: 'Информация для врача: антидота нет, лечение симптоматическое. При необходимости — консультация
    ФГБУ «Научно-практический токсикологический центр» ФМБА России: 129090, Москва, Большая Сухаревская
    площадь, д. 3, к. 7, тел. (495) 628-16-87.'
  tel: '+74956281687'
