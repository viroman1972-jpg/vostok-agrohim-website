procedures:
- key: prep
  title: Приготовление рабочего раствора
  paras:
  - Протравливать семена можно заблаговременно (до 1 года) или непосредственно перед посевом; заблаговременно
    обрабатывают только кондиционные семена при надлежащих условиях дальнейшего хранения. Рекомендуется
    использовать семена, очищенные от пыли и примесей. Качество обработки контролируют по интенсивности
    окраски семян. При раннем севе рекомендуется применять максимальные нормы расхода.
  - Перед применением препарат тщательно взбалтывают в заводской упаковке. Бак протравливателя наполовину
    заполняют водой, включают мешалку, вливают расчётное количество препарата и доливают воду до требуемого
    объёма. Рабочая жидкость во время протравливания должна постоянно перемешиваться.
  - Для приготовления рабочего раствора используют воду температурой не ниже 10 °C — холодная вода снижает
    диспергируемость препарата. Значение pH воды — 4,5–6,5. Рабочую жидкость используют в день приготовления.
- key: mix
  title: Совместимость в баковых смесях
  paras:
  - Табу Нео можно применять с фунгицидными протравителями Бункер, Виал ТрасТ, Виал Трио, Синклер, Оплот,
    Оплот Трио, ТМТД. Препарат совместим с различными пестицидами для обработки семян, кроме препаратов
    с сильнощелочной или сильнокислой реакцией.
  - 'Порядок добавления компонентов в бак протравочной машины: СП → Табу Нео → СК (КС, ВСК) → СЭ → МЭ →
    ВРГ → ВРК (ВР). Каждый последующий компонент добавляется после полного растворения (диспергирования)
    предыдущего.'
  - В каждом конкретном случае необходимо проверять смешиваемые компоненты на совместимость, а обработанные
    смесью семена перед посевом — на всхожесть.
- key: store
  title: Хранение и упаковка
  paras:
  - 'Упаковка: канистры 5 л.'
  - 'Условия хранения: в специально предназначенных для пестицидов складских помещениях, в герметично
    закрытой, без повреждений заводской упаковке.'
  - 'Температурный режим: от −5 до +35 °C.'
  - 'Срок хранения: 3 года со дня изготовления препарата при соблюдении условий хранения.'
procedures_tail:
- key: transport
  title: Транспортировка и утилизация
  paras:
  - Транспортировка — всеми видами крытого транспорта в соответствии с правилами перевозки опасных грузов.
    Транспортировка и хранение совместно с пищевыми продуктами и кормами категорически запрещены.
  - Работать с препаратом без средств индивидуальной защиты органов дыхания, зрения и кожи, а также принимать
    пищу, курить и пить во время работы запрещается (СанПиН 1.2.2584-10, СанПиН 1.2.1330-03). Запрещено
    применение в личных подсобных хозяйствах.
  - Место разлива засыпают песком или другим негорючим сорбентом до полного впитывания, сорбент собирают
    в контейнеры для обезвреживания. Участок в помещении промывают водой с мылом или содой, участок земли
    перекапывают.
  - Остатки препарата, загрязнённые сорбенты и тару подвергают термической утилизации или вывозят в места,
    согласованные с природоохранными органами и Роспотребнадзором.
- key: eco
  title: Охрана окружающей среды
  paras:
  - Препарат — протравитель семян; по данным производителя, воздействие на медоносных пчёл практически
    исключено.
  - Применение в водоохранной зоне водных объектов, включая рыбохозяйственные водоёмы, запрещено.
mechanism:
- key: mech
  title: Как работают имидаклоприд и клотианидин
  paras:
  - Оба действующих вещества относятся к неоникотиноидам, обладают контактным и кишечным действием и выраженной
    системной активностью. Они блокируют никотинэргические рецепторы нервной системы насекомых, нарушая
    проведение нервного импульса, что приводит к гибели вредителя.
  - Вещества различаются растворимостью и подвижностью. Клотианидин менее растворим, лучше закрепляется
    вокруг семени и защищает семя и отрастающие корни. Имидаклоприд быстрее поглощается корнями и перемещается
    по тканям растения.
  - Проникая в семена, затем в корни, действующие вещества распределяются по растению по мере роста и поддерживают
    действующую концентрацию в узле кущения и листьях.
- key: timing
  title: Скорость и симптомы воздействия
  paras:
  - Отравленные вредители теряют подвижность, прекращают питаться и вскоре погибают.
  - Период защитного действия зависит от нормы расхода и условий вегетации. По данным производителя, на
    зерновых защита длится до начала кущения — выхода в трубку, на рапсе, кукурузе, подсолнечнике и сое
    — в ранний период развития всходов.
- key: spectrum
  title: Спектр действия
  paras:
  - Почвообитающие и наземные вредители всходов — проволочники, долгоносики, хлебная жужелица, хлебные
    и крестоцветные блошки, злаковые мухи — на культурах, указанных в регламенте применения.
- key: resistance
  title: Возможность возникновения резистентности
  paras:
  - Оба действующих вещества относятся к одной группе. Чтобы снизить риск устойчивости, Табу Нео чередуют
    с инсектицидами других химических групп. Ориентироваться только на разные торговые названия недостаточно
    — разные препараты могут содержать действующие вещества одной и той же группы.
first_aid:
- lead: При случайном проглатывании
  text: ' — прополоскать рот водой, дать пострадавшему выпить несколько стаканов тёплой воды с активированным
    углём (из расчёта 1 г сорбента на 1 кг массы тела), а затем раздражением задней стенки глотки вызвать
    рвоту (только если пострадавший в сознании); повторить несколько раз, затем вновь дать выпить стакан
    воды с активированным углём.'
- lead: При вдыхании
  text: ' — вывести пострадавшего на свежий воздух.'
- lead: При попадании на кожу
  text: ' — удалить препарат куском ткани, ваты или мягкой бумаги, не растирая кожу, а затем обмыть загрязнённый
    участок водой с мылом.'
- lead: При попадании на одежду
  text: ' — после снятия загрязнённой одежды или обуви промыть водой участки возможного загрязнения кожи.'
- lead: При попадании в глаза
  text: ' — немедленно промыть мягкой струёй чистой проточной воды.'
- lead: При первых признаках недомогания
  text: ' — вывести пострадавшего из зоны воздействия препарата, осторожно снять одежду и средства индивидуальной
    защиты, избегая попадания препарата на кожу.'
- lead: ''
  text: После оказания первой помощи при необходимости обратиться за медицинской помощью.
- lead: ''
  text: 'Информация для врача: лечение симптоматическое, специфических антидотов нет. При необходимости
