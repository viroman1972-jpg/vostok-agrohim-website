title: О компании — Восток АгроХим
description: ООО «Восток АгроХим» — поставка средств защиты растений в Челябинске и по России. В отрасли с 2011 года, официальный дилер АО Фирма «Август».
lead: ООО «Восток АгроХим» — подбор и поставка средств защиты растений в Челябинске и по России. В отрасли с 2011 года.
sections:
- title: Знаем продукт. Понимаем задачи хозяйства
  paras:
  - Помогаем подобрать препарат с учётом культуры, условий и особенностей обработки. Вопросы и заявки клиентов ведёт директор компании.
  - list:
    - Подберём препараты под вашу задачу
    - Учтём климатические условия региона и особенности вашего хозяйства
    - Подскажем нормы расхода и баковые смеси
    - Отпустим и одну упаковку, и оптовую партию
    - Обсудим цену индивидуально — зависит от объёма заказа
- title: Производители
  paras:
  - Компания — официальный дилер АО Фирма «Август» на территории Челябинской области. Поставляем препараты АО Фирма «Август» с полным пакетом документов.
  - В нашем ассортименте также препараты ООО НПФ «Альбит», ООО «Гарант Оптима» и других проверенных производителей.
