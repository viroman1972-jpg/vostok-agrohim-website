title: Политика обработки персональных данных — Восток АгроХим
description: Как ООО «Восток АгроХим» обрабатывает персональные данные посетителей сайта vostok-agrohim.ru, в том числе cookie и данные Яндекс.Метрики.
updated: 02.11.2026
pd_operator_date: 28.11.2022
sections:
- title: Общие положения
  paras:
  - Политика составлена в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных» и описывает, какие данные собирает сайт vostok-agrohim.ru, зачем и как они обрабатываются. Политика действует бессрочно, до замены новой редакцией.
- title: Какие данные обрабатываются
  paras:
  - 'Персональные данные обрабатываются у посетителей сайта, отправивших заявку, в том числе у представителей организаций и хозяйств. Состав данных:'
  - list:
    - из формы заявки — имя или обращение, номер телефона, текст задачи, если вы его написали;
    - сведения о заявке — препарат или тип территории, по которому она отправлена, и страница сайта;
    - журнал согласия — дата и время заявки, IP-адрес, отметка о согласии;
    - данные, которые вы сами сообщите при переписке по почте или по телефону.
  - Специальные категории и биометрические персональные данные не обрабатываются. Не указывайте в тексте заявки лишние сведения о себе.
- title: Цели обработки
  paras:
  - list:
    - связь по заявке и подготовка коммерческого предложения;
    - заключение и исполнение договора, если заявка привела к покупке;
    - подтверждение полученного согласия и защита формы от автоматических заявок;
    - сбор обезличенной статистики посещений для улучшения сайта — только после нажатия кнопки «Принять».
  - Рассылок сайт не ведёт, данные из заявки для них не используются.
- title: Правовые основания
  paras:
  - Согласие на обработку персональных данных, которое вы даёте отдельной галочкой в форме заявки (п. 1 ч. 1 ст. 6 Закона № 152-ФЗ). Заявка без галочки не принимается.
  - Заключение и исполнение договора по инициативе субъекта персональных данных (п. 5 ч. 1 ст. 6 Закона № 152-ФЗ).
- title: Как и сколько хранятся данные
  paras:
  - Заявка приходит письмом на почту компании и хранится вместе с журналом согласия на серверах в России. Трансграничная передача данных не осуществляется.
  - list:
    - заявки и журнал согласия — 3 года с даты заявки, если более долгий срок не требуется по договору или закону;
    - записи для ограничения частоты заявок — 30 дней.
  - По истечении срока, при достижении цели обработки или при отзыве согласия данные уничтожаются или обезличиваются, если закон не требует их хранить.
- title: Кому передаются данные
  paras:
  - 'Данные не продаются и не публикуются. Доступ к ним есть у директора компании и сотрудников, которым он нужен для работы с заявкой. Техническую обработку обеспечивают:'
  - list:
    - хостинг-провайдер ООО «ТаймВэб» — размещение сайта и журнала согласия;
    - почтовый сервис Mail.ru (ООО «ВК») — получение и хранение писем с заявками;
    - транспортная компания — только при доставке заказа и только данные, нужные для неё.
  - Данные могут быть переданы государственным органам в случаях, предусмотренных законом.
- title: Cookie и Яндекс.Метрика
  paras:
  - Сайт запоминает в вашем браузере выбор в окне про cookie. Это нужно, чтобы окно не появлялось снова.
  - Сервис статистики Яндекс.Метрика (ООО «Яндекс») подключается только после нажатия кнопки «Принять». Он использует cookie и собирает обезличенные сведения о посещениях — адреса просмотренных страниц, тип устройства и браузера, примерное местоположение по IP-адресу. Если кнопку не нажимать, статистика не собирается. Cookie можно удалить или запретить в настройках браузера.
  - Ссылка на странице контактов открывает сервис Яндекс.Карты (ООО «Яндекс») в новой вкладке. Встроенных карт на сайте нет; на сервисе действуют его собственные правила.
- title: Ваши права
  paras:
  - 'Вы можете:'
  - list:
    - узнать, какие ваши данные обрабатываются, и получить сведения об их обработке;
    - потребовать уточнить, заблокировать или уничтожить данные, если они неполные, устаревшие, неточные, незаконно полученные или не нужны для заявленной цели;
    - отозвать согласие на обработку;
    - обжаловать действия оператора в Роскомнадзоре или в суде.
- title: Как отозвать согласие или отправить запрос
  paras:
  - Напишите на {email} с темой «Отзыв согласия» или «Запрос о персональных данных» и укажите имя и номер телефона из заявки, чтобы мы могли её найти. Ответим в течение 10 рабочих дней.
- title: Меры защиты
  paras:
  - Оператор принимает правовые, организационные и технические меры для защиты данных от неправомерного доступа, изменения, распространения и уничтожения. Сайт работает по защищённому соединению, журнал заявок недоступен из интернета, доступ к почте и хостингу ограничен.
