# П06, ДЗ06: анонимно, модерация по ДЗ04 и B.9. Что убрано — в status.md, запись 02.11.2026. Имена и города авторов сюда не вносить.
title: Отзывы — Восток АгроХим
description: Отзывы покупателей о работе ООО «Восток АгроХим». Имена авторов не публикуются.
lead: Отзывы покупателей, оставленные на прежней версии сайта. Имена авторов и другие личные данные не публикуем.
removal: Автор отзыва может попросить снять его — напишите на
items:
- date: май 2025
  text: >-
    Большое спасибо! Со мной связались быстро, разъяснили информацию по интересующим вопросам. Не думал, что компания пойдёт навстречу и вышлет мне упаковку
    Торнадо 540 (2 канистры по 10 литров). Но без всяких «но» выслали транспортной компанией, прислали на электронную почту сопроводительные документы и трек-номер.
    Пришла посылка в обрешётке, всё в целости и сохранности, в ожидаемые сроки. Компании удачи и процветания. Всем, кто решит делать заказы в этой компании, рекомендую
    и в перспективе буду заказывать ещё.
- date: сентябрь 2024
  text: Заказ пока не состоялся, по личным причинам. Но спасибо менеджерам — всё объяснили, рассказали. Теперь понятно, что покупать и когда использовать.
- date: июль 2021
  text: Заказ пришёл быстро, я очень довольна, советую делать покупки в компании ООО «Восток АгроХим».
- date: февраль 2019
  text: >-
    Оставила заявку на сайте. Нужно было приобрести всего одну упаковку. Не надеялась на то, что отправят такую маленькую партию. Но со мной сразу связался
    менеджер компании, и мы решили все вопросы. Через 3–4 дня пакет был у меня. Благодарю компанию за оперативность и профессионализм!
- date: декабрь 2014
  text: >-
    Понравился индивидуальный подход. Не все компании работают в регионах с небольшими партиями. Здесь сделали исключение. Благодарю, получил всё, что заказывал,
    и достаточно оперативно!
